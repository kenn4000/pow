name: Android playtest APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Game server URL (e.g. http://192.168.1.105:8088/prisoner-of-war/)'
        required: true
        default: 'http://192.168.0.100:8088/prisoner-of-war/'
        type: string
  push:
    branches: [android-playtest]
    paths: ['mobile/**', '.github/workflows/android-playtest.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Locate Android SDK and install required packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install --no-audit --no-fund
      - name: Configure target server
        env:
          PLAYTEST_URL: ${{ inputs.server_url || 'http://192.168.0.100:8088/prisoner-of-war/' }}
        run: node scripts/set-server.mjs
      - run: npm run android:init
      - run: npm run android:sync
      - run: node scripts/install-startup-art.mjs
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Prisoners-of-War-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
