stages:
  - test
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  GOWORK: "off"
  DEPLOY_NAMESPACE: "prisoner-of-war"
  HELM_RELEASE: "prisoner-of-war"

backend-test:
  image: golang:1.25-alpine
  stage: test
  script:
    - go -C backend test -race ./...
    - go -C backend build ./...
  before_script:
    - apk add --no-cache gcc musl-dev

frontend-test:
  image: node:22-alpine
  stage: test
  script:
    - npm --prefix frontend ci
    - npm --prefix frontend run build

helm-test:
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  stage: test
  script:
    - helm lint deploy/helm/prisoner-of-war --strict
    - helm template prisoner-of-war deploy/helm/prisoner-of-war

build-images:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  parallel:
    matrix:
      - COMPONENT: [backend, frontend]
  script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/$COMPONENT/Dockerfile" --destination "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy-production:
  stage: deploy
  image:
    name: alpine/helm:3.17.3
    entrypoint: [""]
  resource_group: prisoner-of-war-production
  environment:
    name: production
    url: https://games.markdownthing.com/prisoner-of-war/
  before_script:
    - apk add --no-cache kubectl curl
    - test -f /var/run/secrets/kubernetes.io/serviceaccount/token
    - test -n "$REGISTRY_DEPLOY_USER"
    - test -n "$REGISTRY_DEPLOY_PASSWORD"
  script:
    - kubectl auth can-i create deployments --namespace "$DEPLOY_NAMESPACE" | grep -qx yes
    - |
      umask 077
      auth=$(mktemp)
      trap 'rm -f "$auth"' EXIT
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$REGISTRY_DEPLOY_USER" "$REGISTRY_DEPLOY_PASSWORD" | base64 | tr -d '\n')" > "$auth"
      kubectl -n "$DEPLOY_NAMESPACE" create secret generic gitlab-registry --type=kubernetes.io/dockerconfigjson --from-file=.dockerconfigjson="$auth" --dry-run=client -o yaml | kubectl apply -f -
    - |
      helm upgrade --install "$HELM_RELEASE" deploy/helm/prisoner-of-war \
        --namespace "$DEPLOY_NAMESPACE" \
        --set-string backend.image.repository="$CI_REGISTRY_IMAGE/backend" \
        --set-string frontend.image.repository="$CI_REGISTRY_IMAGE/frontend" \
        --set-string backend.image.tag="$CI_COMMIT_SHA" \
        --set-string frontend.image.tag="$CI_COMMIT_SHA" \
        --atomic --wait --timeout 5m
    - kubectl -n "$DEPLOY_NAMESPACE" rollout status "deployment/$HELM_RELEASE-backend" --timeout=120s
    - kubectl -n "$DEPLOY_NAMESPACE" rollout status "deployment/$HELM_RELEASE-frontend" --timeout=120s
    - curl --fail --retry 12 --retry-all-errors --retry-delay 10 https://games.markdownthing.com/prisoner-of-war/
    - curl --fail --retry 3 https://games.markdownthing.com/prisoner-of-war/api/state
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
