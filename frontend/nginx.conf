server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /prisoner-of-war {
        return 308 /prisoner-of-war/;
    }

    location /prisoner-of-war/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /prisoner-of-war/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /prisoner-of-war/index.html;
    }
}
