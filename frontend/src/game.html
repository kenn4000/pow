    function renderFeatureScreen() {
      const titles = {
        "camp-draw": "Camp Draw",
        achievements: "Achievements",
        shop: "Shop",
        heroes: "Choose Hero",
        skills: "Skill Tree",
        profile: "Commander Record",
        campaigns: "Campaigns",
        history: "Match History",
        social: "Social"
      };
      document.getElementById("featureTitle").textContent = titles[currentFeature] || "Progression";
      const resources = featureData?.dashboard || state?.dashboard;
      document.getElementById('featureBalances').innerHTML = resources
        ? `<div class="feature-balance-list">
            <span class="feature-balance">${currencyAmountMarkup(resources.marks, "Marks")}</span>
            <span class="feature-balance">${currencyAmountMarkup(resources.crowns, "Crowns")}</span>
            <span class="feature-balance" aria-label="${esc(`${resources.energy} of ${resources.maxEnergy} Energy`)}">${resources.energy}/${resources.maxEnergy}${currencyIconMarkup("energy")}</span>
            <span class="feature-balance">${resources.skillPoints} Skill ${resources.skillPoints === 1 ? "Point" : "Points"}</span>
          </div>`
        : "";
      const message = document.getElementById("featureMessage");
      message.innerHTML = currencyTextMarkup(featureError || (featureData && featureData.message) || "");
      const tabs = document.getElementById("featureTabs");
      if (currentFeature === "shop") {
        const shopTabs = [
          { id: "skins", label: "Skins" },
          { id: "heroes", label: "Heroes" },
          { id: "boxes", label: "Boxes" },
          { id: "energy", label: "Energy & Items" }
        ];
        tabs.setAttribute("aria-label", "Shop categories");
        tabs.innerHTML = renderFeatureTabs(shopTabs, currentShopTab, "shop-tab");
        tabs.classList.remove("hidden");
      } else if (currentFeature === "skills") {
        tabs.setAttribute("aria-label", "Skill tree branches");
        tabs.innerHTML = renderFeatureTabs(skillTreeBranches, currentSkillBranch, "skill-branch");
        tabs.classList.remove("hidden");
      } else {
        tabs.classList.add("hidden");
        tabs.innerHTML = "";
      }
      const content = document.getElementById("featureContent");
      const selectedTab = currentFeature === 'shop' ? currentShopTab : currentFeature === 'skills' ? currentSkillBranch : '';
      if (selectedTab) {
        content.setAttribute('role', 'tabpanel');
        content.setAttribute('aria-labelledby', `feature-tab-${selectedTab}`);
        content.tabIndex = 0;
      } else {
        content.removeAttribute('role');
        content.removeAttribute('aria-labelledby');
        content.removeAttribute('tabindex');
      }
      if (!featureData) {
        content.innerHTML = featureError
          ? featureActionButton('Retry loading', 'retry-feature')
          : '<section class="feature-section">Loading…</section>';
        return;
      }
      switch (currentFeature) {
        case "camp-draw":
          content.innerHTML = renderCampDrawFeature(featureData);
          break;
        case "achievements":
          content.innerHTML = renderAchievementsFeature(featureData);
          break;
        case "shop":
          content.innerHTML = renderShopFeature(featureData);
          break;
        case "heroes":
          content.innerHTML = renderHeroesFeature(featureData);
          break;
        case "skills":
          content.innerHTML = renderSkillsFeature(featureData);
          break;
        case "profile":
          content.innerHTML = renderCommanderFeature(featureData);
          break;
        case "campaigns":
          content.innerHTML = renderCampaignsFeature(featureData);
          break;
        case "history":
          content.innerHTML = renderHistoryFeature(featureData);
          break;
        case "social":
          content.innerHTML = renderSocialFeature(featureData);
          break;
        default:
          content.innerHTML = "";
      }
      if (chestReveal) {
        content.insertAdjacentHTML("beforeend", renderChestReveal());
        drawChestRevealFrames();
      }
    }

    function renderCampDrawFeature(page) {
      const pending = Object.entries(page.pendingBoxes || {}).filter(([, count]) => count > 0);
      const boxName = type => ({ wooden: "Wooden", silver: "Silver", gold: "Gold", diamond: "Diamond", prismatic: "Prismatic" })[type] || String(type || "");
      const outcomeName = outcome => outcome === 2 ? "Win" : outcome === 1 ? "Clash" : "Loss";
      const winsToNext = Math.max(0, (page.dashboard?.winsPerCampDraw || 10) - (page.dashboard?.winsSinceCampDraw || 0));
      const prizeText = (reward, chroma) => {
        const parts = [];
        if (reward.chroma_id) parts.push(esc(`${chroma?.name || reward.chroma_id} skin${reward.chroma_rarity ? ` · ${reward.chroma_rarity}` : ""}`));
        if (reward.marks) parts.push(currencyAmountMarkup(reward.marks, "Marks"));
        if (reward.energy) parts.push(`${formatNumber(reward.energy)} Energy`);
        if (reward.crowns) parts.push(currencyAmountMarkup(reward.crowns, "Crowns"));
        return parts.length ? parts.join(" + ") : "No listed reward";
      };
      const rewardPanel = (title, reward, chroma, boxType) => `<div class="camp-reward">
          <div class="camp-reward-icon">${chestIconMarkup(boxType, `${boxName(boxType)} chest`)}</div>
          <div><p class="camp-reward-eyebrow">${esc(title)}</p>
            ${chroma ? `<div class="camp-reward-art">${chromaPreview(chroma)}</div>` : ""}
            <p class="camp-reward-prize">${prizeText(reward, chroma)}</p>
            <p>${reward.chroma_id ? 'Added to your collection. <a href="#/shop/skins">Apply it to a suit in the Shop</a>.' : "Added to your balance."}</p>
            ${reward.fallback_reason ? `<p class="camp-note">${esc(reward.fallback_reason)}</p>` : ""}
          </div></div>`;
      let html = `<section class="feature-section">
        <h2>Available Draws</h2>
        <p>You have ${page.drawsAvailable} Camp Draw${page.drawsAvailable === 1 ? "" : "s"} available · ${winsToNext} more ${winsToNext === 1 ? "win" : "wins"} until the next one.</p>
        <p>Play three exchanges against the camp. Each win upgrades the reward box: <span class="camp-tiers"><span>0 ${chestIconMarkup("wooden")} Wooden</span><span>1 ${chestIconMarkup("silver")} Silver</span><span>2 ${chestIconMarkup("gold")} Gold</span><span>3 ${chestIconMarkup("diamond")} Diamond</span></span></p>
        ${!page.started ? (page.drawsAvailable > 0
          ? featureActionButton(page.result ? "Start another Camp Draw" : "Start Camp Draw", "start-draw")
          : '<p class="camp-note">No draws left. <a href="#/match/new">Play a match</a> to earn progress toward the next one.</p>') : ""}`;
      if (page.started && page.prompt) {
        const attack = page.prompt.cpuCard;
        const only = page.prompt.playerPool.length === 1;
        const preview = card => {
          if (!page.prompt.isDefending || !attack) return "";
          const mine = card.face * (beats(card.suit, attack.suit) ? 2 : 1);
          const theirs = attack.face * (beats(attack.suit, card.suit) ? 2 : 1);
          const result = mine > theirs ? ["win", "You capture"] : mine < theirs ? ["lose", "They capture"] : ["clash", "Clash"];
          return `<span class="camp-preview ${result[0]}">${mine} vs ${theirs} · ${result[1]}</span>`;
        };
        html += `<div class="camp-exchange">
          <h3>Exchange ${page.prompt.exchangeIndex + 1} of 3 · ${page.prompt.isDefending ? "Defend" : "Attack"}</h3>
          <p>${page.prompt.isDefending
            ? "The camp attacks with the card below. Choose your response; a suit advantage doubles the face value."
            : "You attack. The camp answers after you choose, so pick the card you want to commit."}${only ? " Your last card is played as-is." : ""}</p>
          ${attack ? `<div class="camp-attack"><span class="camp-label">Camp attacks</span>${cardMarkup(attack)}</div>` : ""}
          <div class="camp-options" role="group" aria-label="Your cards">${page.prompt.playerPool.map((card, index) => `
            <button type="button" class="camp-option" data-feature-action="play-camp-card" data-index="${index}" aria-label="Play ${esc(campCardLabel(card))}">
              ${cardMarkup(card)}<span class="camp-option-label">${only ? "Play last card" : "Play"} ${esc(campCardLabel(card))}</span>${preview(card)}
            </button>`).join("")}</div>
        </div>`;
      }
      html += `</section>`;
      if (page.exchanges && page.exchanges.length) {
        html += `<section class="feature-section"><h2>Resolved Battles</h2><div class="feature-list">${
          page.exchanges.map((exchange, index) => `<article class="feature-item camp-battle ${outcomeName(exchange.outcome).toLowerCase()}"><h3>Battle ${index + 1}: ${outcomeName(exchange.outcome)}</h3>
              <p>You: ${esc(campCardLabel(exchange.player_card))} · Camp: ${esc(campCardLabel(exchange.cpu_card))}</p>
            </article>`).join("")
        }</div></section>`;
      }
      if (pending.length) {
        html += `<section class="feature-section"><h2>Pending Boxes</h2><div class="feature-list">${
          pending.map(([boxType, count]) => `<article class="feature-item">
            <h3>${chestIconMarkup(boxType)} ${esc(boxName(boxType))} Box × ${count}</h3>
            ${featureActionButton(`Open ${boxName(boxType)} Box`, "open-box", `data-box-type="${esc(boxType)}"`)}
          </article>`).join("")
        }</div></section>`;
      }
      if (page.result) {
        const wins = page.result.player_wins;
        html += `<section class="feature-section camp-result">
          <h2>Draw Result · ${wins} ${wins === 1 ? "win" : "wins"} · ${esc(boxName(page.result.box_type))} Box</h2>
          ${page.result.awaiting_choice
            ? '<p class="camp-note">Your Reroll skill found two rewards. Choose one to add it to your account.</p>'
            : rewardPanel(`${boxName(page.result.box_type)} Box reward`, page.result.reward || {}, page.rewardChroma, page.result.box_type)}
          <div class="feature-list">${(page.result.exchanges || []).map((exchange, index) => `<article class="feature-item camp-battle ${outcomeName(exchange.outcome).toLowerCase()}"><h3>Battle ${index + 1}: ${outcomeName(exchange.outcome)}</h3>
              <p>You: ${esc(campCardLabel(exchange.player_card))} · Camp: ${esc(campCardLabel(exchange.cpu_card))}</p></article>`).join("")}</div>
        </section>`;
      }
      if (page.boxResult) {
        html += `<section class="feature-section"><h2>Box Opened</h2>${rewardPanel(`${boxName(page.boxResult.box_type)} Box reward`, page.boxResult, page.boxChroma, page.boxResult.box_type)}</section>`;
      }
      return html;
    }

    function beats(suit, other) { return (suit + 1) % 3 === other; }

    function campCardLabel(card) {
      const names = ["Scissors", "Paper", "Rock"];
      return `${names[card.suit] || "Suit"} ${card.face}`;
    }

    function renderAchievementsFeature(page) {
      const all = page.items || [];
      const categories = [...new Set(all.map(item => item.category))];
      const items = all.filter(item => (achievementCategory === 'all' || item.category === achievementCategory) && (achievementFilter === 'all' || achievementFilter === 'new' && item.new || achievementFilter === 'earned' && item.unlocked || achievementFilter === 'progress' && !item.unlocked));
      const sets = page.sets || [];
      return `<section class="feature-section"><h2>Achievement Gallery</h2>
        <p>${all.filter(item => item.unlocked).length} fully earned · ${all.filter(item => item.new).length} newly completed or progressed. Rewards are credited automatically; no claim action is required.</p>
        <div class="filters"><label>Progress<select id="achievementFilter">${[['all','All achievements'],['new','New progress'],['earned','Earned'],['progress','In progress']].map(([id,label]) => `<option value="${id}"${achievementFilter === id ? ' selected' : ''}>${label}</option>`).join('')}</select></label>
          <label>Category<select id="achievementCategory"><option value="all">All categories</option>${categories.map(category => `<option${achievementCategory === category ? ' selected' : ''}>${esc(category)}</option>`).join('')}</select></label></div>
        ${!items.length ? '<p>No achievements match these filters.</p>' : ''}
        <div class="feature-list">${items.map(item => {
          const percent = item.unlocked ? 100 : item.goal > 0 ? Math.min(100, item.progress * 100 / item.goal) : 0;
          const tiers = (item.tiers || []).map(tier =>
            `<p>Tier ${esc(tier.name)} · Target: ${tier.goal} · Reward: ${currencyTextMarkup(tier.rewards || 'Collection milestone')}</p>`
          ).join("");
          return `<article class="feature-item achievement-card${item.unlocked ? " achievement-earned" : ""}">
            <h3>${esc(item.name)}${item.new ? ' <span class="feature-status">NEW</span>' : ""}</h3>
            <p>${esc(item.category)} · ${item.unlocked ? '<span class="achievement-chip">Earned</span>' : "In progress"}</p>
            <p>${esc(item.details)}</p>
            ${item.rewards ? `<p>Reward: ${currencyTextMarkup(item.rewards)}</p>` : ''}
            <p>${item.progressUnit ? `${Math.min(item.progress,item.goal)} / ${item.goal} ${esc(item.progressUnit)}` : item.goal === 1 && !(item.tiers || []).length ? (item.unlocked ? 'Objective completed' : 'Objective not yet completed — see the requirement above') : `Progress toward next tier: ${item.progress}${item.goal > 0 ? ` / ${item.goal}` : ' · exact modifier targets listed below'}`}</p>
            <div class="feature-progress" role="progressbar" aria-label="${esc(item.name)} progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(percent)}"><span style="width:${percent}%"></span></div>${tiers ? `<details><summary>Tier requirements and rewards</summary>${tiers}</details>` : ''}
          </article>`;
        }).join("")}</div>
      </section>
      <section class="feature-section"><h2>Achievement Sets</h2>
        <div class="feature-list">${sets.map(set => `<article class="feature-item">
          <h3>${esc(set.name)}</h3><p>${set.progress} / ${set.total} achievements · ${set.complete ? "Complete" : "In progress"}</p>
        </article>`).join("")}</div>
      </section>`;
    }

    function renderShopEnergy(page) {
      const energyOffers = (page.energyOffers || []).map(offer => {
        const room = page.dashboard.maxEnergy - page.dashboard.energy;
        const canFit = room >= offer.amount;
        return `<article class="feature-item">
          <h3>${offer.amount} Energy Recharge</h3>
          <p>Energy: ${page.dashboard.energy}/${page.dashboard.maxEnergy}</p>
          <p>${formatNumber(offer.marksCost)} Marks or ${formatNumber(offer.crownsCost)} Crowns</p>
          ${featureActionButton(`Buy for ${formatNumber(offer.marksCost)} Marks`, "buy-energy",
            `data-amount="${offer.amount}" data-payment="marks"`,
            !canFit || page.dashboard.marks < offer.marksCost)}
          ${featureActionButton(`Buy for ${formatNumber(offer.crownsCost)} Crowns`, "buy-energy",
            `data-amount="${offer.amount}" data-payment="crowns"`,
            !canFit || page.dashboard.crowns < offer.crownsCost)}
        </article>`;
      }).join("");
      const consumables = (page.consumableOffers || []).map(offer => {
        const prices = [
          ["marks", offer.marksCost, "Marks", page.dashboard.marks],
          ["crowns", offer.crownsCost, "Crowns", page.dashboard.crowns]
        ];
        return `<article class="feature-item">
          <h3 class="consumable-offer-title">${consumableIconMarkup(offer.id)}<span>${offer.quantity} × ${esc(offer.name)}</span></h3>
          <p>${formatNumber(offer.available)} available</p>
          ${prices.map(([payment, cost, currency, balance]) => `<p>${formatNumber(cost)} ${currency}</p>
            ${featureActionButton(`Buy for ${formatNumber(cost)} ${currency}`, "buy-consumable",
              `data-id="${esc(offer.id)}" data-payment="${payment}"`,
              !offer.canBuy || balance < cost)}`).join("")}
        </article>`;
      }).join("");
      const skillPoints = (page.skillPointOffers || []).map(offer => `<article class="feature-item">
        <h3>${offer.quantity} ${esc(offer.name)}</h3>
        <p>Spend Skill Points to unlock skills in any branch.</p>
        ${featureActionButton(`Buy for ${formatNumber(offer.crownsCost)} Crowns`, "buy-skill-points",
          `data-id="${esc(offer.id)}"`, page.dashboard.crowns < offer.crownsCost)}
      </article>`).join("");
      return `<section class="feature-section"><h2>Energy Shop</h2>
        <p>Purchase a 1-energy or 10-energy recharge with Marks or Crowns. The full recharge must fit below your Energy cap.</p>
        <div class="feature-list">${energyOffers}</div>
      </section>
      <section class="feature-section"><h2>Consumables</h2>
        <p>Restart, Undo, Replace Any Card, and Campaign Skip tokens can only be used in campaigns and vs-CPU games, never in Human-vs-Human play. In-game quick purchases use Crowns; Marks purchases are available here. Camp Draw purchases count toward the three-draw storage limit.</p>
        <div class="feature-list">${consumables}</div>
      </section>
      <section class="feature-section"><h2>Skill Points</h2>
        <p>Skill unlocks require Skill Points. Crowns cannot be used to unlock skills.</p>
        <div class="feature-list">${skillPoints}</div>
      </section>`;
    }

    function renderShopFeature(page) {
      const content = currentShopTab === "heroes" ? renderShopHeroes(page)
        : currentShopTab === "boxes" ? renderShopBoxes(page)
          : currentShopTab === "energy" ? renderShopEnergy(page) : renderShopSkins(page);
      return content;
    }

    function chromaFamilyKey(chroma) {
      const path = String(chroma?.skin || "").replaceAll("\\", "/").split("/").filter(Boolean);
      const shopIndex = path.indexOf("shop");
      return (shopIndex >= 0 ? path[shopIndex + 1] : path[path.length - 2])?.toLowerCase()
        || String(chroma?.name || chroma?.id || "").toLowerCase();
    }

    function chromaFamilyName(chroma) {
      const namePrefix = String(chroma?.name || "").split("(")[0].trim();
      if (String(chroma?.name || "").includes("(") && namePrefix) return namePrefix;
      return chromaFamilyKey(chroma).split(/[-_\s]+/).filter(Boolean)
        .map(part => part[0].toUpperCase() + part.slice(1)).join(" ");
    }

    function chromaColorName(chroma) {
      return chromaAppearance(chroma).color || String(chroma?.color || "Default");
    }

    function chromaVariantLabel(item, variants) {
      const color = chromaColorName(item.chroma);
      const duplicateColor = variants.some(other => other !== item
        && chromaColorName(other.chroma).toLowerCase() === color.toLowerCase());
      const availability = item.chroma.currency === "event" ? " · Event-only" : "";
      return `${color}${duplicateColor || availability ? ` · ${item.chroma.name}${availability}` : ""}`;
    }

    function chromaCurrencyName(chroma) {
      return currencyDisplayName(chroma.currency);
    }

    function currencyDisplayName(currency) {
      return currency === "marks" ? "Marks" : "Crowns";
    }

    function canAffordCurrency(dashboard, cost, currency) {
      return currency === "marks" ? dashboard.marks >= cost : dashboard.crowns >= cost;
    }

    function canAffordChroma(page, chroma) {
      return canAffordCurrency(page.dashboard, chroma.cost, chroma.currency);
    }

    function shopFamilyItems(page, familyKey) {
      return (page.chromas || []).filter(item => chromaFamilyKey(item.chroma) === familyKey)
        .sort((first, second) =>
          chromaColorName(first.chroma).localeCompare(chromaColorName(second.chroma), undefined, { sensitivity: "base" }));
    }

    function familyBuyAllQuote(page, familyKey) {
      const purchasable = shopFamilyItems(page, familyKey).filter(item =>
        item.chroma.currency === "marks" || item.chroma.currency === "crowns");
      if (purchasable.length < 2) return null;
      const currencies = new Set(purchasable.map(item => item.chroma.currency));
      if (currencies.size !== 1) return null;
      if (purchasable.some(item => item.owned)) return null;
      const total = purchasable.reduce((sum, item) => sum + item.chroma.cost, 0);
      return { cost: Math.round(total * 0.8), currency: purchasable[0].chroma.currency, count: purchasable.length };
    }

    function renderShopSkins(page) {
      const families = new Map();
      for (const item of page.chromas || []) {
        const chroma = item.chroma;
        const key = chromaFamilyKey(chroma);
        if (!families.has(key)) families.set(key, { key, name: chromaFamilyName(chroma), items: [] });
        families.get(key).items.push(item);
      }
      const tierNames = ["Common", "Uncommon", "Rare", "Epic", "Seasonal / Premium"];
      const tiers = Array.from({ length: tierNames.length }, () => []);
      for (const family of families.values()) {
        family.items = shopFamilyItems(page, family.key);
        const familyTiers = new Map();
        for (const item of family.items) {
          const rank = Math.min(Math.max(Math.trunc(Number(item.chroma.rarityRank) || 0), 0), tierNames.length - 1);
          if (!familyTiers.has(rank)) familyTiers.set(rank, []);
          familyTiers.get(rank).push(item);
        }
        for (const [rank, items] of familyTiers) {
          tiers[rank].push({ ...family, items, rank, representative: items[0] });
        }
      }
      const chromas = tiers.map((tier, rank) => {
        if (!tier.length) return "";
        const familyTiles = tier.sort((first, second) =>
          first.name.localeCompare(second.name, undefined, { sensitivity: "base" }))
          .map(group => {
          const items = group.items;
          const representative = group.representative;
          const ownedCount = items.filter(item => item.owned).length;
          return `<article class="feature-item shop-product shop-family-tile${ownedCount === items.length ? " is-owned" : ""}">
            <h3>${esc(group.name)}</h3>
            ${chromaPreview(representative.chroma)}
            <p>${tierNames[rank]}</p>
            <p>${esc(chromaColorName(representative.chroma))} · ${formatNumber(representative.chroma.cost)} ${esc(chromaCurrencyName(representative.chroma))}</p>
            <p>${items.length} colors in this tier · ${ownedCount} owned</p>
            <div class="product-actions">${featureActionButton("Choose color / family bundle", "preview-chroma", `data-id="${esc(representative.chroma.id)}"`)}</div>
          </article>`;
        }).join("");
        return `<section class="feature-section"><h2>${tierNames[rank]}</h2><div class="feature-list">${familyTiles}</div></section>`;
      }).join("");
      const chromaPick = page.chromaPickTokens > 0
        ? `<article class="feature-item"><h3>Pick Any Chroma · ${page.chromaPickTokens} token(s)</h3>
          <select id="chromaPickChoice">${(page.chromas || []).filter(item => !item.owned).map(item =>
            `<option value="${esc(item.chroma.id)}">${esc(item.chroma.name)}</option>`).join("")}</select>
          ${featureActionButton("Redeem token", "redeem-pick")}</article>`
        : "";
      return `<section class="feature-section"><h2>Chroma Catalog</h2><p>Families appear in every tier that contains one of their colors. Open an entry to preview all family colors, purchase one, or buy the full family for 20% off. Earn Marks and Crowns through matches, campaigns and achievements.</p></section>${chromas}
        ${chromaPick ? `<section class="feature-section"><h2>Chroma Tokens</h2><div class="feature-list">${chromaPick}</div></section>` : ""}`;
    }

    function renderShopHeroes(page) {
      const heroesForSale = (page.heroes || []).filter(item => item.hero.id !== "recruit").map(item => `<article class="feature-item${item.owned ? " is-owned" : ""}">
         <h3>${esc(item.hero.name)}${item.owned ? ' <span class="owned-chip">Owned</span>' : ""}</h3>
         <img class="shop-hero-icon" src="${import.meta.env.BASE_URL}skins/hero_icons/${esc(heroIconNames[item.hero.id] || item.hero.id)}${item.owned ? "" : "_black"}.png?v=1" alt="${esc(item.hero.name)}${item.owned ? "" : " locked"}">
         ${heroDetails(item.hero)}
         <p>${item.plays} plays · ${item.wins} wins</p>
         ${!item.owned ? affordability(item.price, page.dashboard.crowns, 'Crowns') : '<a href="#/heroes">Choose your default hero</a>'}
        ${!item.owned ? featureActionButton(`Buy for ${item.price} Crowns`, "buy-hero",
          `data-id="${esc(item.hero.id)}"`, !item.canBuy) : ""}
      </article>`).join("");
      return `<section class="feature-section"><h2>Heroes</h2><p>Direct purchase prices vary by hero, from 300 to 500 Crowns.</p>
          <div class="feature-list">${heroesForSale}</div></section>`;
    }

    function renderShopBoxes(page) {
      const offers = (page.boxOffers || []).map(offer => {
        const prices = [
          ["marks", offer.marksCost, "Marks", page.dashboard.marks],
          ["crowns", offer.crownsCost, "Crowns", page.dashboard.crowns],
        ].filter(([, cost]) => cost > 0);
        const openButton = offer.available > 0
          ? offer.type === "hero"
            ? featureActionButton("Open Hero Box", "open-hero-box", 'data-box-type="free"')
            : featureActionButton(`Open ${offer.name}`, "open-box", `data-box-type="${esc(offer.type)}"`)
          : "";
        return `<article class="feature-item">
          <h3>${chestIconMarkup(offer.type, "", "chest-icon shop-box-icon")} ${esc(offer.name)}</h3>
          <p>${formatNumber(offer.available)} available</p>
          <p>${esc(boxDescription(offer.type))}</p>
          <details><summary>Reward amounts and chances</summary><p>Odds include current table adjustments. Owned skins convert to Marks at the skin's listed cost.</p><ul>${(page.rewardTables?.[offer.type] || []).map(prize => `<li>${currencyTextMarkup(prize.label)} · ${prize.chance.toFixed(2)}%</li>`).join('')}</ul></details>
          ${prices.map(([payment, cost, currency, balance]) => `<p>${formatNumber(cost)} ${currency}</p>
            ${affordability(cost, balance, currency)}
            ${featureActionButton(`Buy for ${formatNumber(cost)} ${currency}`, "buy-box",
              `data-box-type="${esc(offer.type)}" data-payment="${payment}"`, balance < cost)}`).join("")}
          ${openButton}
        </article>`;
      }).join("");
      return `<section class="feature-section"><h2>Box Shop</h2>
        <p>Purchase boxes with Marks or Crowns. Open them here when available.</p>
        <div class="feature-list">${offers}</div>
        <article class="feature-item">
          <h3>${chestIconMarkup("prismatic")} Diamond Box</h3>
          <p>Earn this prismatic chest through Camp Draw; it is not sold in the Shop.</p>
          <a href="#/camp-draw">Go to Camp Draw</a>
        </article>
      </section>`;
    }

    function renderHeroesFeature(page) {
      const heroes = [...(page.heroes || [])].sort((a, b) => Number(b.unlocked) - Number(a.unlocked));
      const owned = heroes.filter(hero => hero.unlocked).length;
      const initials = name => String(name || "").replace(/^The\s+/i, "").split(/\s+/).map(word => word.charAt(0)).join("").slice(0, 2).toUpperCase();
      const modifiers = hero => {
        const chips = [["Bounty", hero.bounty], ["Shift", hero.shift], ["Favored", hero.favored], ["Draft", hero.draft]]
          .filter(([, value]) => value).map(([label, value]) => `<span class="hero-mod">${label} ${formatModifier(value)}</span>`);
        if (hero.draftFlip) chips.push('<span class="hero-mod special">Negates the opponent’s Draft modifier</span>');
        if (hero.flip) chips.push('<span class="hero-mod special">Flips the opponent’s Bounty</span>');
        return chips.length ? chips.join("") : '<span class="hero-mod none">No modifiers · plays the base rules</span>';
      };
      return `<section class="feature-section"><h2>Commander Hero</h2>
        <p>${owned} of ${heroes.length} heroes owned. Your default hero is used for AI matches; campaigns may require a specific one.</p>
        <div class="feature-list hero-list">${heroes.map(hero => {
          const isDefault = hero.id === page.defaultId;
          const chip = isDefault ? '<span class="hero-chip default">Default</span>' : hero.unlocked ? '<span class="hero-chip owned">Owned</span>' : '<span class="hero-chip locked">Locked</span>';
          const route = hero.unlock === 'campaign:basic'
            ? '<p class="hero-unlock">Earned by completing Basic Training. <a href="#/campaigns">Open Basic Training</a></p>'
            : '<p class="hero-unlock">From Hero Boxes or direct purchase. <a href="#/shop/heroes">View in Shop</a></p>';
          return `<article class="feature-item hero-card${hero.unlocked ? "" : " hero-locked"}${isDefault ? " hero-default" : ""}">
            <div class="hero-card-head">
              <span class="hero-crest" aria-hidden="true">${esc(initials(hero.name))}</span>
              <div class="hero-card-title"><h3>${esc(hero.name)}</h3>${chip}</div>

        <div class="feature-list">${nodes.map(item => {
          const prerequisite = (page.nodes || []).find(other => other.node.id === item.node.prerequisite);
