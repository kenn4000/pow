<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisoners of War</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #07090e;
      color: #f3f4ef;
      font-synthesis: none;
      --felt: #777f7b;
      --felt-dark: #606864;
      --gold: #f0c75e;
      --paper: #f4f2e9;
      --card-red: #c5373d;
      --card-blue: #2873be;
      --card-yellow: #b58a06;
      --card-green: #24834f;
      --card-orange: #c76516;
      --card-purple: #784bb1;
      --card-brown: #805332;
      --card-silver: #6c747b;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: #07090e; }
    button { font: inherit; }
    .shell {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      width: min(430px, 100%); height: 100vh; height: 100dvh; min-height: min(540px, 100vh);
      container-type: inline-size; margin: 0 auto; padding: 0; border: 1px solid #273148; border-radius: 30px;
      background: #0b0f19; box-shadow: 0 24px 80px #000a; color: #eef1f7;
    }
    .shell::before {
      position: absolute; inset: 0; z-index: 0; pointer-events: none; content: "";
      background:
        radial-gradient(circle at 8% 35%, #dc262610, transparent 32%),
        radial-gradient(circle at 95% 70%, #2563eb12, transparent 36%),
        radial-gradient(#ffffff08 1px, transparent 1px);
      background-size: auto, auto, 24px 24px;
    }
    .topline {
      position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex: 0 0 auto; margin: 0; padding: 13px;
      border-bottom: 1px solid #263047; background: #101624eb;
    }
    .brand { margin: 0; color: #f6d46f; font: 800 15px Georgia, "Times New Roman", serif; letter-spacing: .09em; text-transform: uppercase; }
    .brand span { color: var(--gold); }
    .round-label { color: #aeb9cb; font-size: 9px; letter-spacing: .08em; text-align: right; text-transform: uppercase; }
    .board {
      position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 12px; background: transparent; scrollbar-color: #344159 transparent; scrollbar-width: thin;
    }
    .track { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); align-items: start; gap: 5px; }
    .bounty-column { display: grid; grid-column: span 1; grid-template-columns: minmax(0, 1fr); gap: 5px; min-width: 0; }
    .track-cell { min-width: 0; height: clamp(96px, 11vw, 130px); display: flex; align-items: center; justify-content: center; position: relative; border: 2px solid #d2d7d2; border-radius: 9px; background: #626a66; }
    .track-cell.bounty { border: 3px solid var(--bounty-border-color, var(--gold)); background: #6b664f; }
    .bounty-value { color: #ffe18a; font-size: clamp(8px, 1vw, 12px); font-weight: 800; line-height: 1.2; text-align: center; white-space: nowrap; }
    .track-cell.white-capture { border-color: #fff; }
    .track-cell.black-capture { border-color: #151817; }
    .track-cell .card { width: min(64px, calc(100% - 10px)); height: calc(100% - 10px); min-height: 0; }
    .track-cell .card .face { font-size: clamp(18px, 3vw, 32px); }
    .jailed-card { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .jailed-card .card { width: min(64px, calc(100% - 8px)); height: calc(100% - 14px); }
    .jailed-card { animation: capture-drop .35s ease-out both; }
    @keyframes capture-drop { from { opacity: 0; transform: translateY(-12px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .capture-face { height: 14px; color: #fff; font-size: clamp(10px, 1.2vw, 13px); font-weight: 900; line-height: 14px; text-align: center; }
    .round-group { display: grid; grid-column: span 3; grid-template-rows: auto auto auto; gap: 2px; min-width: 0; }
    .round-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .round-brace { position: relative; height: 12px; border-bottom: 2px solid #e1e5e1; color: #fff; }
    .round-brace::before, .round-brace::after, .round-brace .brace-tip {
      position: absolute; display: block; width: 2px; background: #e1e5e1; content: "";
    }
    .round-brace::before, .round-brace::after { bottom: -2px; height: 7px; }
    .round-brace::before { left: 0; }
    .round-brace::after { right: 0; }
    .round-brace .brace-tip { bottom: -2px; left: calc(50% - 1px); height: 8px; }
    .round-weight { display: block; font-size: 11px; font-weight: 800; text-align: center; }
    .cell-empty { color: #aeb5b0; font-size: 13px; }
    .card {
      width: clamp(49px, 7vw, 83px);
      height: clamp(66px, 9vw, 108px);
      display: inline-flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 5px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 4px 9px #0004;
      color: #252a2b;
      cursor: default;
      transition: transform .12s ease, box-shadow .12s ease, outline-color .12s ease;
    }
    .card.skin-card { overflow: visible; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: #fff; }
    .card-art { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .card.skin-card .face {
      position: absolute; z-index: 1; top: 7%; left: 50%; transform: translateX(-50%);
      color: var(--card-suit-color); font-size: clamp(20px, 3vw, 34px);
      -webkit-text-stroke: .7px #161a18; text-shadow: 0 2px 4px #000, 0 0 2px #000;
      pointer-events: none;
    }
    .card.skin-card.mirrored .card-art { transform: scaleX(-1); }
    button.card { cursor: pointer; }
    button.card:hover { transform: translateY(-5px); box-shadow: 0 8px 13px #0005; }
    button.card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .card .face { font-size: clamp(24px, 4vw, 42px); font-weight: 800; line-height: 1; }
    .card .face { color: var(--card-suit-color); }
    .card.back { cursor: default; border-color: #e2e4df; background: repeating-linear-gradient(135deg, #323a39 0 7px, #414b48 7px 14px); }
    .card.back::after { content: "POW"; color: #f0c75e; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
    .card.back .face { display: none; }
    .match-info { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 1.2fr) minmax(0, 1fr); align-items: center; gap: clamp(8px, 2vw, 24px); margin: 16px 0; }
    .match-info[hidden] { display: none; }
    .match-side { min-width: 0; }
    .match-hero { display: grid; justify-items: center; gap: 6px; min-width: 0; text-align: center; }
    .hero-portrait { width: clamp(64px, 9vw, 112px); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border: 3px solid #e7ebe8; border-radius: 50%; background: radial-gradient(circle at 50% 32%, #ffffff26 0 18%, transparent 19%), linear-gradient(145deg, #8d7845, #353b37 72%); box-shadow: 0 5px 13px #0005; }
    .hero-portrait.black { border-color: #171b1a; background: radial-gradient(circle at 50% 32%, #ffffff26 0 18%, transparent 19%), linear-gradient(145deg, #5c6971, #303735 72%); }
    .hero-portrait svg { width: 68%; height: 68%; fill: #e4e8e4; opacity: .82; }
    .hero-portrait-mark { position: absolute; color: #f0c75e; font-size: clamp(14px, 2vw, 22px); font-weight: 900; text-shadow: 0 2px 4px #000; }
    .hero-portrait { position: relative; }
    .match-hero h2 { max-width: 100%; margin: 0; font-size: clamp(11px, 1.5vw, 16px); line-height: 1.2; overflow-wrap: anywhere; }
    .hero-score { margin: 0; font-size: clamp(12px, 1.7vw, 18px); font-weight: 800; }
    .hero-score.white { color: #fff; }
    .hero-score.black { color: #1a1e1c; text-shadow: 0 1px #d5dbd6; }
    .match-center { min-width: 0; text-align: center; }
    .match-rules { display: grid; gap: 3px; margin-top: 2px; color: #e9ece8; font-size: clamp(10px, 1.15vw, 13px); line-height: 1.25; }
    .match-rules p { margin: 0; }
    .match-rules strong { color: #ffe18a; }
    .hero-select { display: grid; gap: 5px; margin-top: 12px; color: #dfe4df; font-size: 13px; }
    .hero-select select { min-height: 38px; padding: 5px 8px; border: 1px solid #aeb7b1; border-radius: 6px; background: #424a47; color: #f2f4f0; font: inherit; }
    .status { min-height: 34px; margin: 2px 0 14px; text-align: center; color: #f4f5f1; font-size: 15px; }
    .player-instructions .status { margin: 3px 0 12px; }
    .battle { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(40px, 64px) minmax(0, 1fr); align-items: center; gap: 8px; min-height: 160px; padding: 14px clamp(8px, 3vw, 32px); border: 1px solid #c2c8c4; border-radius: 13px; background: #68716c; }
    .battle-player { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
    .battle-player-name { max-width: 100%; color: #e4e8e4; font-size: 12px; text-align: center; text-transform: uppercase; letter-spacing: .08em; }
    .battle-vs { position: relative; color: #d5dbd6; text-align: center; font-weight: 800; letter-spacing: .12em; }
    .battle-vs.exploding { color: transparent; }
    .battle-vs.exploding::before, .battle-vs.exploding::after {
      position: absolute; top: 50%; left: 50%; content: ""; pointer-events: none;
    }
    .battle-vs.exploding::before {
      width: 1em; height: 1em; background: #fff2a6;
      clip-path: polygon(50% 0, 61% 35%, 96% 20%, 75% 50%, 100% 78%, 64% 68%, 50% 100%, 37% 67%, 0 78%, 24% 50%, 3% 21%, 40% 35%);
      filter: drop-shadow(0 0 14px #ffcf55); animation: battle-flash .35s ease-out both;
    }
    .battle-vs.exploding::after {
      width: .65em; height: .65em; border: 3px solid #fff2a6; border-radius: 50%;
      animation: battle-ring .35s ease-out both;
    }
    @keyframes battle-flash { from { opacity: 1; transform: translate(-50%, -50%) scale(.1) rotate(0); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.8) rotate(70deg); } }
    @keyframes battle-ring { from { opacity: .9; transform: translate(-50%, -50%) scale(.1); } to { opacity: 0; transform: translate(-50%, -50%) scale(2.8); } }
    .battle .card { width: clamp(62px, 9vw, 93px); height: clamp(84px, 12vw, 119px); }
    .battle .card.skin-card .face { top: -23px; font-size: clamp(20px, 3vw, 30px); }
    .battle-empty { width: clamp(62px, 9vw, 93px); height: clamp(84px, 12vw, 119px); border: 2px dashed #bdc5bf; border-radius: 8px; }
    .players { display: grid; grid-template-columns: minmax(0, 1fr); margin-top: 16px; }
    .player-panel { min-width: 0; padding: 13px clamp(10px, 2vw, 18px) 16px; border: 1px solid #2a354a; border-radius: 12px; background: linear-gradient(145deg, #141b2aef, #101521ee); }
    .player-panel.white { border-top: 4px solid #fff; }
    .player-panel.black { border-top: 4px solid #171b1a; }
    .player-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .player-heading h2 { margin: 0; font-size: 15px; letter-spacing: .09em; text-transform: uppercase; }
    .player-heading span { color: #e1e5e1; font-size: 12px; }
    .row-label { margin: 11px 0 6px; color: #e1e5e1; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-align: center; text-transform: uppercase; }
    .player-card-rows { display: block; }
    .card-group { min-width: 0; }
    .card-row { min-height: 74px; display: flex; align-items: center; gap: clamp(5px, 1vw, 11px); overflow-x: auto; padding: 4px 3px 8px; }
    .pile-row, .hand-row { justify-content: center; }
    .card-row .card { width: clamp(44px, 5.5vw, 62px); height: clamp(60px, 7vw, 80px); }
    .card-row .card .face { font-size: clamp(21px, 3vw, 31px); }
    .pile-row .card, .committing .hand-row .card { width: clamp(62px, 9vw, 93px); height: clamp(84px, 12vw, 119px); }
    .pile-row .card .face, .committing .hand-row .card .face { font-size: clamp(24px, 4vw, 42px); }
    .committing .hand-row {
      display: grid;
      grid-template-columns: repeat(3, clamp(62px, 9vw, 93px));
      justify-content: center;
      overflow-x: visible;
    }
    .empty-row { align-self: center; color: #d0d6d1; font-size: 12px; font-style: italic; }
    .chosen { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-4px); }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 17px; }
    .action {
      min-height: 43px; padding: 0 20px; border: 1px solid #f4d881; border-radius: 8px;
      background: #f0c75e; color: #262a29; font-weight: 800; cursor: pointer;
    }
    .action:hover { background: #ffda74; }
    .action:disabled { border-color: #999f9b; background: #aeb5b0; color: #555d59; cursor: not-allowed; }
    .action.secondary { border-color: #c4ccc6; background: #424a47; color: #f2f4f0; }
    .shell .action, .modal .action {
      min-height: 42px; padding: 0 14px; border-color: #344057; border-radius: 10px;
      background: linear-gradient(145deg, #1b2434, #141b28); color: #e9edf4; font-weight: 700;
    }
    .shell .action:hover, .modal .action:hover { border-color: #68758b; background: linear-gradient(145deg, #222d40, #182132); }
    .shell .action:disabled, .modal .action:disabled { border-color: #29354d; background: #0a0e17; color: #758197; opacity: .7; }
    .shell .action.secondary, .modal .action.secondary { border-color: #48566d; background: #0d1320; color: #c8d0de; }
    .shell .action:focus-visible, .modal .action:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }
    .suit-cycle { position: relative; z-index: 2; width: 100%; aspect-ratio: 4 / 3; margin: 0 auto; }
    .suit-arrows { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .suit-arrows > path { fill: none; stroke: #c5cbc7; stroke-width: 3; marker-end: url(#suit-arrowhead); }
    .suit-arrows > path.connector { marker-end: none; }
    .suit-node-wrap {
      position: absolute; z-index: 1; width: 24%; min-width: 40px; max-width: 82px;
      transform: translate(-50%, -50%);
    }
    .suit-node-wrap.scissors { left: 50%; top: 18.7%; }
    .suit-node-wrap.paper { left: 22.5%; top: 77.3%; }
    .suit-node-wrap.rock { left: 77.5%; top: 77.3%; }
    .suit-node-wrap.menu-open { z-index: 5; }
    .suit-node {
      display: block; width: 100%; aspect-ratio: 1; padding: 0; cursor: pointer;
      overflow: hidden; border: 3px solid var(--suit-node-color); border-radius: 50%;
      background: transparent; box-shadow: 0 4px 12px #0006;
    }
    .suit-node img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: contain; }
    .suit-node:hover { filter: brightness(1.14); }
    .suit-node:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .color-menu {
      position: absolute; z-index: 3; top: calc(100% + 7px); left: 50%; transform: translateX(-50%);
      display: grid; gap: 3px; min-width: 122px; max-height: min(240px, 50vh); overflow-y: auto;
      padding: 5px; border: 1px solid #d1d7d2; border-radius: 8px; background: #303735; box-shadow: 0 8px 22px #0008;
    }
    .color-option {
      display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 3px 7px;
      border: 0; border-radius: 5px; background: transparent; color: #f3f4ef; text-align: left; cursor: pointer;
    }
    .color-option:hover, .color-option:focus-visible { background: #515a56; outline: none; }
    .color-option-swatch { width: 15px; height: 15px; flex: 0 0 auto; border: 1px solid #fff9; border-radius: 50%; }
    .suit-node-wrap.paper .color-menu { left: 0; transform: none; }
    .suit-node-wrap.rock .color-menu { right: 0; left: auto; transform: none; }
    .rotate-colors {
      position: absolute; z-index: 2; left: 50%; top: 57.8%; width: clamp(18px, 5.25vw, 25.5px);
      aspect-ratio: 1; display: grid; place-items: center; padding: 3px; transform: translate(-50%, -50%);
      border: 1.5px solid #e7ebe8; border-radius: 50%; background: #424a47; color: #f3f4ef;
      box-shadow: 0 3px 9px #0006; cursor: pointer;
    }
    .rotate-colors:hover { background: #59625d; }
    .rotate-colors:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    .rotate-colors svg { width: 100%; height: 100%; fill: currentColor; }
    .modal-backdrop { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 18px; background: #141817d9; }
    .modal { width: min(440px, 100%); padding: 27px; border: 1px solid #e6ce81; border-radius: 16px; background: #303735; box-shadow: 0 20px 70px #0008; text-align: center; }
    .modal h2 { margin: 0 0 10px; font-size: 25px; }
    .modal p { color: #d6ddd8; line-height: 1.5; }
    .confirmation-actions { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }
    .confirmation-actions .action { flex: 1; }
    .payout-breakdown { margin: 16px 0; padding: 12px; border: 1px solid #4d593e; border-radius: 10px; background: #171e19; text-align: center; }
    .payout-breakdown .payout-total { margin: 0; color: #f7d76c; font-size: 14px; font-weight: 800; line-height: 1.6; }
    .payout-error { color: #ffb5b5 !important; }
    .mode-list { display: grid; gap: 9px; margin-top: 19px; }
    .mode-list .action { width: 100%; }
    .hidden { display: none !important; }
    .dashboard-shell {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      width: min(430px, 100%); height: 100vh; height: 100dvh;
      min-height: min(540px, 100vh); margin: 0 auto; padding: 0;
      border: 1px solid #273148; border-radius: 30px;
      background: #0b0f19; box-shadow: 0 24px 80px #000a;
      color: #eef1f7;
    }
    .dashboard-shell::before {
      position: absolute; inset: 0; z-index: 0; pointer-events: none; content: "";
      background:
        radial-gradient(circle at 8% 35%, #dc262610, transparent 32%),
        radial-gradient(circle at 95% 70%, #2563eb12, transparent 36%),
        radial-gradient(#ffffff08 1px, transparent 1px);
      background-size: auto, auto, 24px 24px;
    }
    .dashboard-header {
      position: relative; z-index: 1; display: grid; gap: 11px; flex: 0 0 auto;
      padding: 13px 13px 11px; border-bottom: 1px solid #263047;
      background: #101624eb; backdrop-filter: blur(14px);
    }
    .dashboard-profile { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .dashboard-avatar {
      display: grid; place-items: center; width: 43px; height: 43px; flex: 0 0 auto;
      border: 2px solid #d7a629; border-radius: 12px;
      background: linear-gradient(145deg, #493814, #171d2a 70%);
      color: #facc15; font: 900 20px Georgia, serif; box-shadow: 0 0 18px #eab30826;
    }
    .dashboard-identity { min-width: 0; }
    .dashboard-brand {
      margin: 0; color: #f6d46f; font: 800 15px Georgia, "Times New Roman", serif;
      letter-spacing: .09em; text-transform: uppercase;
    }
    .dashboard-commander {
      overflow: hidden; margin: 4px 0 0; color: #aeb9cb;
      font-size: 10px; text-overflow: ellipsis; white-space: nowrap;
    }
    .dashboard-resources { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .dashboard-resource {
      display: flex; align-items: center; gap: 7px; min-width: 0; padding: 7px 8px;
      border: 1px solid #29354d; border-radius: 9px; background: #0a0e17d9;
      box-shadow: inset 0 1px #ffffff08;
    }
    .dashboard-resource-icon {
      display: grid; place-items: center; width: 23px; height: 23px; flex: 0 0 auto;
      border: 1px solid #59677e; border-radius: 50%; color: #f2d170; font-size: 12px;
    }
    .dashboard-resource:nth-child(2) .dashboard-resource-icon { border-color: #a27418; color: #ffc94d; }
    .dashboard-resource:nth-child(3) .dashboard-resource-icon { border-color: #255c9f; color: #60a5fa; }
    .dashboard-resource-copy { min-width: 0; }
    .dashboard-resource-copy span, .dashboard-resource strong { display: block; }
    .dashboard-resource-copy span { margin-bottom: 2px; color: #8995a8; font-size: 8px; letter-spacing: .12em; text-transform: uppercase; }
    .dashboard-resource strong { overflow: hidden; color: #edf1f8; font: 700 12px "Segoe UI", Arial, sans-serif; text-overflow: ellipsis; white-space: nowrap; }
    .dashboard-grid {
      position: relative; z-index: 1; display: flex; flex: 1 1 auto; flex-direction: column;
      gap: 11px; min-height: 0; overflow-y: auto; padding: 12px 12px 76px;
      scrollbar-color: #344159 transparent; scrollbar-width: thin;
    }
    .dashboard-panel {
      min-width: 0; padding: 12px; border: 1px solid #2a354a; border-radius: 14px;
      background: linear-gradient(145deg, #141b2aef, #101521ee); box-shadow: 0 8px 24px #0003;
    }
    .dashboard-panel h2 {
      margin: 0 0 9px; color: #e7c55e; font: 700 10px Georgia, "Times New Roman", serif;
      letter-spacing: .15em; text-transform: uppercase;
    }
    .featured-card {
      position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 90px; overflow: hidden; padding: 12px 14px;
      border: 1px solid #a47d2c80; border-radius: 11px;
      background: linear-gradient(112deg, #171e2d 0%, #24223a 58%, #3a2915 100%);
    }
    .featured-card::after {
      position: absolute; right: 28px; bottom: -38px; width: 112px; height: 112px;
      border-radius: 50%; background: #eab30812; filter: blur(1px); content: "";
    }
    .featured-copy { position: relative; z-index: 1; display: grid; gap: 4px; }
    .featured-copy .eyebrow { color: #d5a935; font-size: 8px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .featured-copy strong { color: #f3f4f6; font: 700 16px Georgia, "Times New Roman", serif; }
    .featured-copy span:last-child { color: #aeb9cb; font-size: 10px; }
    .featured-crest {
      position: relative; z-index: 1; display: grid; place-items: center; width: 54px; height: 54px; flex: 0 0 auto;
      border: 2px solid #d2a940; border-radius: 15px 15px 20px 20px;
      background: linear-gradient(145deg, #634915, #171d29 75%); color: #f6d46f;
      font: 900 24px Georgia, "Times New Roman", serif; text-shadow: 0 2px 6px #000;
      box-shadow: 0 0 22px #eab30825;
    }
    .commander-card {
      width: 100%; color: inherit; text-align: left; font: inherit; cursor: pointer;
      transition: border-color .15s ease, transform .12s ease, filter .15s ease;
    }
    .commander-card:hover { transform: translateY(-1px); border-color: #937536; filter: brightness(1.08); }
    .commander-card:focus-visible, .shop-preview:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }
    .commander-quick-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
    .commander-quick-stats div { min-width: 0; padding: 7px; border: 1px solid #28334a; border-radius: 8px; background: #0b111d; }
    .commander-quick-stats span, .commander-quick-stats strong { display: block; overflow: hidden; text-overflow: ellipsis; }
    .commander-quick-stats span { color: #8290a5; font-size: 8px; letter-spacing: .09em; text-transform: uppercase; }
    .commander-quick-stats strong { margin-top: 4px; color: #e8edf5; font-size: 9px; line-height: 1.3; white-space: nowrap; }
    .dashboard-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .dashboard-action {
      position: relative; display: flex; align-items: center; min-width: 0; min-height: 45px; gap: 8px;
      overflow: hidden; padding: 8px 10px; border: 1px solid #344057; border-radius: 10px;
      background: linear-gradient(145deg, #1b2434, #141b28); color: #e9edf4;
      text-align: left; font-size: 11px; font-weight: 700; cursor: pointer;
      transition: border-color .15s ease, transform .12s ease, filter .15s ease;
    }
    .dashboard-action::before {
      display: grid; place-items: center; width: 25px; height: 25px; flex: 0 0 auto;
      border: 1px solid #48566d; border-radius: 8px; background: #0d1320; color: #f1cb5b; font-size: 13px;
    }
    #dashboardCampDraw::before { content: "✦"; }
    #dashboardAchievements::before { content: "★"; }
    #dashboardCampaigns::before { content: "⚑"; }
    #dashboardHistory::before { content: "◷"; }
    .dashboard-action:hover { transform: translateY(-1px); border-color: #68758b; filter: brightness(1.12); }
    .dashboard-action:focus-visible, .dashboard-footer button:focus-visible { outline: 2px solid #facc15; outline-offset: 2px; }
    .dashboard-action.play, .dashboard-action.wide { grid-column: 1 / -1; }
    .dashboard-action.play {
      justify-content: space-between; min-height: 76px; padding: 11px 15px;
      border-color: #f87171a6; background: linear-gradient(135deg, #ef4444, #b91c1c 62%, #7f1d1d);
      color: #fff; box-shadow: 0 0 23px #ef44442b, inset 0 1px #ffffff44;
    }
    .dashboard-action.play::before { display: none; }
    .dashboard-action.play strong { display: block; font: 900 21px Georgia, "Times New Roman", serif; letter-spacing: .09em; }
    .dashboard-action.play small { display: block; margin-top: 3px; color: #fee2e2; font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .dashboard-action.play .battle-icon {
      display: grid; place-items: center; width: 43px; height: 43px; border: 1px solid #fecaca80;
      border-radius: 50%; background: #450a0a66; color: #fff1f2; font-size: 21px;
    }
    .dashboard-action.half { min-height: 48px; }
    .shop-preview {
      display: grid; gap: 9px; width: 100%; padding: 12px;
      border: 1px solid #7f6233; border-radius: 14px;
      background: linear-gradient(125deg, #1b202c, #211d1b 72%, #322719);
      color: #eef1f7; font: inherit; text-align: left; cursor: pointer;
      box-shadow: 0 8px 24px #0003; transition: border-color .15s ease, transform .12s ease, filter .15s ease;
    }
    .shop-preview:hover { transform: translateY(-1px); border-color: #d0a84b; filter: brightness(1.08); }
    .shop-preview-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .shop-preview-head h2 { margin: 3px 0 0; color: #f3d36e; font: 700 12px Georgia, "Times New Roman", serif; letter-spacing: .1em; text-transform: uppercase; }
    .shop-preview-head .eyebrow { color: #c09b47; font-size: 8px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .shop-preview-open { color: #c9b477; font-size: 8px; font-weight: 700; letter-spacing: .1em; white-space: nowrap; }
    .shop-preview-item { display: flex; align-items: center; justify-content: space-between; gap: 9px; padding: 9px; border: 1px solid #58462c; border-radius: 9px; background: #0d1119a8; }
    .shop-preview-item strong { display: block; color: #f3f4f6; font: 700 13px Georgia, "Times New Roman", serif; }
    .shop-preview-item small { display: block; margin-top: 3px; color: #aeb9cb; font-size: 9px; }
    .shop-preview-price { flex: 0 0 auto; color: #f4d46f; font-size: 10px; font-weight: 800; }
    .dashboard-footer {
      position: fixed; left: 50%; bottom: 0; z-index: 20; display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;
      gap: 3px; width: min(430px, 100%); margin: 0; padding: 8px 9px max(8px, env(safe-area-inset-bottom));
      transform: translateX(-50%); border: 1px solid #263047; border-bottom: 0;
      border-radius: 16px 16px 0 0; background: #101624f5; backdrop-filter: blur(14px);
      box-shadow: 0 -8px 25px #0005;

    .dashboard-footer button {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;

      background: transparent; color: #8995a8; font: 600 8px "Segoe UI", Arial, sans-serif;

    }

    .dashboard-footer button:hover { background: #ffffff0c; color: #f3d46f; }
    .dashboard-footer button[aria-current="page"] { color: #f3d46f; }

      margin-top: -14px; color: #fff; font-weight: 800;

    .dashboard-footer button.nav-battle span:first-child {

    .feature-header {
      position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; flex: 0 0 auto;

    .feature-content {

    .feature-section h2 { margin: 0 0 10px; color: #e7c55e; font: 700 11px Georgia, "Times New Roman", serif; letter-spacing: .12em; text-transform: uppercase; }
    .feature-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 8px; }
    .feature-item { min-width: 0; padding: 11px; border: 1px solid #303c53; border-radius: 10px; background: #1a2231; }
    .feature-item h3 { margin: 0 0 6px; font-size: 13px; }
    .feature-item p { margin: 5px 0; color: #aeb9cb; font-size: 11px; line-height: 1.45; }
    .feature-item .action { margin-top: 8px; }
    .feature-item .action:disabled { opacity: .55; cursor: not-allowed; }
    .feature-item select { min-height: 36px; margin-top: 8px; padding: 4px 7px; border: 1px solid #46536a; border-radius: 7px; background: #101624; color: #f3f4ef; }
    .feature-progress { height: 8px; overflow: hidden; border-radius: 8px; background: #0a0e17; }

    @media (max-width: 700px) {

    @container (max-width: 700px) {

      .round-slots { gap: 3px; }

      .track-cell .card { width: calc(100% - 4px); height: calc(100% - 4px); }
      .jailed-card .card { width: calc(100% - 4px); height: calc(100% - 14px); }

      .round-brace { height: 10px; }
      .round-weight { font-size: 9px; }
      .match-info { grid-template-columns: minmax(0, 1fr) minmax(118px, 1.4fr) minmax(0, 1fr); gap: 5px; margin: 12px 0; }
      .hero-portrait { width: clamp(46px, 14vw, 68px); border-width: 2px; }
      .match-hero h2 { font-size: 10px; }
      .hero-score { font-size: 11px; }
      .match-rules { font-size: 9px; }
      .battle { grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); min-height: 108px; padding: 8px 3px; gap: 2px; }

      .battle .card, .battle-empty { width: clamp(34px, 10vw, 55px); height: clamp(48px, 14vw, 70px); }
      .player-panel { padding: 10px 7px; }
      .player-heading h2 { font-size: 12px; }
      .player-heading span { font-size: 10px; }

      .card-row .card { width: clamp(40px, 13vw, 52px); height: clamp(54px, 17vw, 70px); }
      .pile-row .card, .committing .hand-row .card { width: clamp(62px, 9vw, 93px); height: clamp(84px, 12vw, 119px); }

    }
    @media (max-width: 480px) {
      .dashboard-shell, .shell { width: 100%; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main id="dashboardScreen" class="dashboard-shell">
    <header class="dashboard-header">
      <div class="dashboard-profile">
        <div id="dashboardAvatar" class="dashboard-avatar" aria-hidden="true">P</div>

      </div>

        <div class="dashboard-resource"><span class="dashboard-resource-icon" aria-hidden="true">✦</span><div class="dashboard-resource-copy"><span>Crowns</span><strong id="dashboardCrowns">—</strong></div></div>
        <div class="dashboard-resource"><span class="dashboard-resource-icon" aria-hidden="true">⚡</span><div class="dashboard-resource-copy"><span>Energy</span><strong id="dashboardEnergy">—</strong></div></div>

    <div class="dashboard-grid">

        <div class="featured-card">
          <div class="featured-copy">
            <span class="eyebrow">Active Commander · tap for full record</span>

            <span id="dashboardCommanderLabel" class="dashboard-commander">Commander · Loading profile</span>

          <div id="dashboardHeroCrest" class="featured-crest" aria-hidden="true">R</div>
        </div>
        <div class="commander-quick-stats">
          <div><span>Login Streak</span><strong id="dashboardStreak">—</strong></div>
          <div><span>Camp Draw</span><strong id="dashboardProgress">—</strong></div>
          <div><span>Skill Points</span><strong id="dashboardSkillPoints">—</strong></div>
        </div>
        <p id="dashboardAd" class="dashboard-ad" hidden></p>
        <p id="dashboardPreviewNote" class="dashboard-preview-note" hidden>Preview values are for layout testing only; your profile is unchanged.</p>

      <section class="dashboard-panel">

          <button id="dashboardCampDraw" class="dashboard-action half" type="button">Camp Draw</button>

          <span class="shop-preview-open">OPEN SHOP →</span>
        </span>
        <span class="shop-preview-item">
          <span><strong id="dashboardShopItem">Loading today's feature…</strong><small id="dashboardShopDetail">Checking the current catalog</small></span>
          <span id="dashboardShopPrice" class="shop-preview-price"></span>

  </main>
  <main id="featureScreen" class="dashboard-shell hidden">
    <header class="feature-header">
      <button id="featureBack" class="action secondary" type="button">Dashboard</button>
      <h1 id="featureTitle">Progression</h1>
    </header>
    <p id="featureMessage" class="feature-message" aria-live="polite"></p>

    <button id="dashboardNavHome" type="button" data-nav="home"><span aria-hidden="true">⌂</span><span>Home</span></button>
    <button id="dashboardNavShop" type="button" data-nav="shop"><span aria-hidden="true">▣</span><span>Shop</span></button>
    <button id="dashboardNavBattle" class="nav-battle" type="button" data-nav="battle"><span aria-hidden="true">⚔</span><span>Battle</span></button>

  <main id="gameShell" class="shell hidden">
    <header class="topline">
      <h1 class="brand">Prisoners <span>of War</span></h1>
      <div id="roundLabel" class="round-label">Card battle</div>
    </header>
    <section class="board" aria-label="Game board">

          <section id="suitCycle" class="suit-cycle" role="group" aria-label="Suit relationships and color selectors"></section>

  <div id="modal" class="modal-backdrop hidden"></div>
  <script>
    const suits = ["Scissors", "Paper", "Rock"];
    const skinFolders = {
      Red: "tribal_red",
      Blue: "tribal_blue",
      Yellow: "tribal_yellow",
      Purple: "tribal_purple",
      Orange: "tribal_orange",
      Green: "tribal_green"
    };
    const defaultSuitColors = ["Blue", "Yellow", "Red"];
    const colors = ["Red", "Blue", "Yellow", "Green", "Orange", "Purple"];
    const colorVars = {
      Red: "var(--card-red)", Blue: "var(--card-blue)", Yellow: "var(--card-yellow)",
      Green: "var(--card-green)", Orange: "var(--card-orange)", Purple: "var(--card-purple)"
    };
    const suitColors = loadSuitColors();
    const dashboardPreview = new URLSearchParams(window.location.search).get("preview") === "dashboard";
    const selected = new Set();
    let openSuitMenu = null;
    let state = null;
    let activeMode = "";
    let showNewGameConfirmation = false;
    let actionInProgress = false;
    let showDashboard = true;
    let showFeature = false;
    let currentFeature = "";
    let currentShopTab = "skins";
    let currentSkillBranch = "battle-rewards";
    let featureData = null;
    let featureError = "";
    let featureActionInProgress = false;
    let showModeSelection = false;
    let battleAnimation = null;
    let battleAnimationTimer = null;
    const skillTreeBranches = [
      { id: "battle-rewards", label: "Battle Rewards", nodeIDs: ["quartermaster", "field-warden", "first-blood"] },
      { id: "camp-draw", label: "Camp Draw", nodeIDs: ["camp-lore", "fortune", "chroma-curator"] },
      { id: "energy", label: "Energy", nodeIDs: ["expanded-rations", "quick-recovery", "second-wind", "daily_energy"] },
      { id: "hero-acquisition", label: "Hero Acquisition", nodeIDs: ["hero_broker", "lucky_dupe", "premium_dupe"] },
      { id: "campaigns", label: "Campaigns", nodeIDs: ["curator", "campaign_free"] },
      { id: "commander-tactics", label: "Commander Tactics", nodeIDs: ["conductor_1", "conductor_2", "hero_history", "hero_preview"] }
    ];

    function loadSuitColors() {
      const legacyDefaults = ["Red", "Yellow", "Blue"];
      try {
        const saved = JSON.parse(localStorage.getItem("pow-suit-colors") || "null");
        if (Array.isArray(saved) && saved.length === suits.length &&
            saved.every(color => colors.includes(color)) && new Set(saved).size === suits.length) {
          return JSON.stringify(saved) === JSON.stringify(legacyDefaults) ? [...defaultSuitColors] : saved;
        }
      } catch {
        return [...defaultSuitColors];
      }
      return [...defaultSuitColors];
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    async function api(path, body) {
      const requestPath = dashboardPreview
        ? `${path}${path.includes("?") ? "&" : "?"}preview=dashboard`
        : path;
      const response = await fetch(`${import.meta.env.BASE_URL}${requestPath.replace(/^\//, "")}`, body ? {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      } : {});
      const payload = await response.json();
      if (response.status === 401) window.dispatchEvent(new Event("pow-session-expired"));
      if (!response.ok) throw new Error(payload.error || "Request failed");
      return payload;
    }

    function cardMarkup(item, options = {}) {
      const card = item.card || item;
      const color = suitColors[card.suit];
      const skin = skinFolders[color] || skinFolders[defaultSuitColors[card.suit]];
      const tier = card.face <= 3 ? "small" : card.face <= 6 ? "med" : "large";
      const pose = ["idle", "attack", "win", "lose"].includes(options.pose) ? options.pose : "idle";
      const selectable = Boolean(item.selectable);
      const chosen = options.commit && selected.has(item.index);
      const tag = selectable ? "button" : "div";
      const attrs = selectable ? `type="button" data-index="${item.index}" aria-pressed="${chosen}"` : "";
      const face = options.face === undefined ? card.face : options.face;
      const faceMarkup = options.hideFace ? "" : `<span class="face">${esc(face)}</span>`;
      const mirrored = options.mirror ? " mirrored" : "";
      const faceColor = options.faceColor || colorVars[color] || "var(--paper)";
      const ariaLabel = options.hideFace ? `${color} card` : `${color} ${face}`;
      return `<${tag} class="card skin-card${chosen ? " chosen" : ""}${mirrored}" style="--card-suit-color:${faceColor}" ${attrs} aria-label="${esc(ariaLabel)}">
        <img class="card-art" src="${import.meta.env.BASE_URL}skins/${skin}/${tier}_${pose}.png?v=3" alt="" aria-hidden="true">
        ${faceMarkup}
      </${tag}>`;
    }

    function battleAnimationKey() {
      if (!state || !state.battleAttack || !state.battleDefend || !state.battleOutcome) return "";
      return `${state.round}-${state.exchange}-${state.attacker}-${state.battleAttack.face}-${state.battleDefend.face}`;
    }

    function scheduleBattleAnimation(key, stage, delay) {
      battleAnimationTimer = window.setTimeout(() => {
        if (!battleAnimation || battleAnimation.key !== key || !state || state.phase !== "result") return;
        battleAnimation.stage = stage;
        render();
        if (stage === "values") scheduleBattleAnimation(key, "outcome", 2000);
        else if (stage === "outcome") scheduleBattleAnimation(key, "settled", 2000);
        else if (stage === "settled") scheduleBattleContinuation(key);
      }, delay);
    }

    function scheduleBattleContinuation(key) {
      battleAnimationTimer = window.setTimeout(() => {
        if (!battleAnimation || battleAnimation.key !== key || battleAnimation.stage !== "settled" ||
            !state || state.phase !== "result") return;
        act("continue");
      }, 2000);
    }

    function syncBattleAnimation() {
      if (!state || state.phase !== "result") {
        window.clearTimeout(battleAnimationTimer);
        battleAnimation = null;
        return;
      }
      const key = battleAnimationKey();
      if (!key || battleAnimation?.key === key) return;
      window.clearTimeout(battleAnimationTimer);
      battleAnimation = {
        key,
        stage: "impact",
        previousScores: {
          White: document.querySelector("#whiteHeroPanel .hero-score")?.textContent || "",
          Black: document.querySelector("#blackHeroPanel .hero-score")?.textContent || ""
        }
      };
      scheduleBattleAnimation(key, "values", 350);
    }

        { suit: 1, location: "paper" },
        { suit: 2, location: "rock" }

          <defs><marker id="suit-arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#c5cbc7"></path>
          </marker></defs>
          <path class="connector" d="M145 141 L90 232"></path>
          <path class="connector" d="M200 232 L310 232"></path>
          <path class="connector" d="M255 141 L200 56"></path>
          <path d="M178 96 L145 141"></path>
          <path d="M140 232 L200 232"></path>
          <path d="M288 187 L255 141"></path>
        </svg>${locations.map(({ suit, location }) => {
          const menu = openSuitMenu === suit
            ? `<div class="color-menu" role="menu" aria-label="Choose an unused color">
                ${colors.filter(color => !suitColors.includes(color)).map(color =>

            : "";
          return `<div class="suit-node-wrap ${location}${openSuitMenu === suit ? " menu-open" : ""}">
            <button type="button" class="suit-node" data-suit-trigger="${suit}"
              style="--suit-node-color:${colorVars[suitColors[suit]]}"
              aria-label="${suitColors[suit]} suit color, open color menu" aria-haspopup="menu"
              aria-expanded="${openSuitMenu === suit}">
              <img src="${import.meta.env.BASE_URL}skins/${skinFolders[suitColors[suit]]}/large_attack.png?v=3" alt="" aria-hidden="true">
            </button>
            ${menu}
          </div>`;
        }).join("")}<button type="button" class="rotate-colors" data-rotate-colors
          aria-label="Rotate colors counterclockwise" title="Rotate colors counterclockwise">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.11 8.53A5.99 5.99 0 0 1 12 6c3.31 0 6 2.69 6 6s-2.69 6-6 6a5.99 5.99 0 0 1-5.65-4H4.26A8 8 0 0 0 12 20c4.42 0 8-3.58 8-8s-3.58-8-8-8c-2.21 0-4.21.9-5.66 2.34L4 4v6h6L7.11 8.53z"></path>
          </svg>
        </button>`;
      container.onclick = event => {
        event.stopPropagation();
        if (event.target.closest("[data-rotate-colors]")) {
          const scissorsColor = suitColors[0];
          const paperColor = suitColors[1];
          const rockColor = suitColors[2];
          suitColors[0] = rockColor;
          suitColors[1] = scissorsColor;
          suitColors[2] = paperColor;
          openSuitMenu = null;
          localStorage.setItem("pow-suit-colors", JSON.stringify(suitColors));
          render();
          return;
        }
        const option = event.target.closest("[data-suit-option]");
        if (option) {
          const suit = Number(option.dataset.suitOption);
          const color = option.dataset.color;
          if (!Number.isInteger(suit) || suit < 0 || suit >= suits.length ||
              !colors.includes(color) || suitColors.includes(color)) return;
          suitColors[suit] = color;
          openSuitMenu = null;
          localStorage.setItem("pow-suit-colors", JSON.stringify(suitColors));
          render();
          return;

        const trigger = event.target.closest("[data-suit-trigger]");
        if (trigger) {
          const suit = Number(trigger.dataset.suitTrigger);
          openSuitMenu = openSuitMenu === suit ? null : suit;

    function backs(count) {
      return count > 0 ? '<div class="card back" aria-label="Hidden cards"></div>' : "";
    }

    function connectionError(error) {
      return error instanceof TypeError && error.message === "Failed to fetch"
        ? "Game server unavailable. Keep `go run .` running, then reload this page."
        : error.message;
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message || "";
      status.style.color = isError ? "#ffd0ce" : "";
    }

    function renderTrack() {
      const track = document.getElementById("track");
      if (!state || !state.started) {
        track.innerHTML = "";
        return;
      }
      const bounty = `<div class="bounty-column">
        <div class="track-cell bounty" style="--bounty-border-color:${colorVars[suitColors[state.bounty.suit]]}">
          ${cardMarkup(state.bounty, { pose: "win", hideFace: true })}
        </div>
        <span class="bounty-value">Bounty: ${formatModifier(state.modifiers.bounty)}</span>
      </div>`;
      const rounds = [0, 1, 2].map(roundIndex => {
        const slots = state.jailSlots.slice(roundIndex * 3, roundIndex * 3 + 3)
          .map((cell, index) => {
            const slotIndex = roundIndex * 3 + index;
            const border = cell.capturedBy === "White" ? "white-capture"
              : cell.capturedBy === "Black" ? "black-capture" : "";
            const resolvingSlot = state.phase === "result" && battleAnimation &&
              battleAnimation.key === battleAnimationKey() && battleAnimation.stage !== "settled" &&
              slotIndex === (state.round - 1) * 3 + state.exchange - 1;
            const content = resolvingSlot
              ? '<span class="cell-empty" aria-label="Battle resolving"></span>'
              : cell.card
              ? `<div class="jailed-card">${cardMarkup(cell.card, { pose: "lose", hideFace: true })}
                  <span class="capture-face" style="color:${colorVars[suitColors[cell.card.suit]]}">${cell.card.face}</span>
                </div>`
              : `<span class="cell-empty">${cell.clash ? "CLASH" : String(slotIndex + 1).padStart(2, "0")}</span>`;
            return `<div class="track-cell ${resolvingSlot ? "" : border}">${content}</div>`;
          }).join("");
          return `<div class="round-group">
            <div class="round-slots">${slots}</div>
            <div class="round-brace" aria-hidden="true"><span class="brace-tip"></span></div>
            <span class="round-weight">x${state.modifiers.reckoning[roundIndex]}</span>
          </div>`;
      }).join("");
      track.innerHTML = bounty + rounds;
    }

    function formatModifier(value) {
      return value > 0 ? `+${value}` : String(value);
    }

    function heroPanelMarkup(player, heroName, heroID) {
      const color = player.color.toLowerCase();
      const title = heroName || "Commander";
      const initials = title.replace(/^The\s+/i, "").split(/\s+/)
        .map(word => word.charAt(0)).join("").slice(0, 2).toUpperCase();
      const priorScore = battleAnimation && battleAnimation.key === battleAnimationKey() &&
        battleAnimation.stage !== "settled" && battleAnimation.previousScores[player.color];
      const scoreText = priorScore || `${player.you ? "You" : player.color} = ${player.score}`;
      return `<article class="match-hero ${color}">
        <div class="hero-portrait ${color}" role="img" aria-label="${esc(title)} portrait for ${esc(player.color)}">
          <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
            <path d="M50 14c-13 0-22 10-22 24 0 10 5 18 12 22-17 7-27 20-27 34v3h74v-3c0-14-10-27-27-34 7-4 12-12 12-22 0-14-9-24-22-24z"></path>
          </svg>
          <span class="hero-portrait-mark">${esc(initials || heroID.slice(0, 2).toUpperCase())}</span>
        </div>
        <h2>${esc(title)}</h2>
        <p class="hero-score ${color}">${esc(scoreText)}</p>
      </article>`;
    }

    function renderMatchInfo() {
      const info = document.getElementById("matchInfo");
      if (!state || !state.started) {
        info.hidden = true;
        return;
      }
      info.hidden = false;
      const mods = state.modifiers;
      const white = state.players.find(player => player.color === "White");
      const black = state.players.find(player => player.color === "Black");
      const heroAt = player => {
        const index = state.players.indexOf(player);
        return index === 0
          ? [state.playerHero, state.playerHeroId]
          : [state.opponentHero, state.opponentHeroId];
      };
      const [whiteHero, whiteHeroID] = heroAt(white);
      const [blackHero, blackHeroID] = heroAt(black);
      document.getElementById("whiteHeroPanel").innerHTML = heroPanelMarkup(white, whiteHero, whiteHeroID || "");
      document.getElementById("blackHeroPanel").innerHTML = heroPanelMarkup(black, blackHero, blackHeroID || "");
      const favored = `x2${mods.favored > 0 ? `+${mods.favored}` : mods.favored < 0 ? mods.favored : ""}`;
      document.getElementById("matchRules").innerHTML = `
        <p><strong>Favored Rule:</strong> ${favored}</p>
        <p><strong>Face Values:</strong> ${1 + mods.shift}–${9 + mods.shift}</p>`;
    }

    function renderPlayers() {
      const container = document.getElementById("players");
      const statusHost = document.getElementById("statusHost");
      const status = document.getElementById("status");
      if (status.parentElement !== statusHost) {
        statusHost.append(status);
      }
      if (!state || !state.started) {
        container.innerHTML = "";
        return;
      }
      if (state.phase === "handoff") {
        container.innerHTML = "";
        return;
      }
      const playerIndex = state.mode === "hvh" ? state.actor : 0;
      const player = state.players[playerIndex];
      const committing = state.phase === "commit" && player.canSelectHand;
      const colorClass = player.color.toLowerCase();
      const playerTitle = state.mode === "hvh" ? `Player ${playerIndex + 1}` : "You";
      const handCards = player.hand.map(item => cardMarkup(item, { commit: state.phase === "commit" })).join("");
      const poolCards = player.pool.map(item => cardMarkup(item)).join("");
      const handContent = handCards || backs(player.hiddenHand) || '<span class="empty-row">No cards held</span>';
      const poolContent = poolCards || backs(player.hiddenPool) || '<span class="empty-row">No cards in pile</span>';
      container.innerHTML = `<article class="player-panel ${colorClass}${committing ? " committing" : ""}">
        <div class="player-heading">
          <h2>${esc(player.color)} · ${esc(playerTitle)}</h2>
          <span>Seat ${esc(player.seat)} · ${player.score} pts</span>
        </div>
        <div class="player-instructions"></div>
        <div class="player-card-rows">
          <section class="card-group">
            <div class="row-label">Round Pile</div>
            <div class="card-row pile-row">${poolContent}</div>
          </section>
          <section class="card-group">
            <div class="row-label">Hand</div>
            <div class="card-row hand-row">${handContent}</div>
          </section>
        </div>
      </article>`;
      container.querySelector(".player-instructions").append(status);

      container.querySelectorAll(".card[data-index]").forEach(button => {
        button.addEventListener("click", () => {
          const index = Number(button.dataset.index);
          const player = state.players[state.actor];
          if (state.phase === "commit" && player.canSelectHand) {
            if (selected.has(index)) selected.delete(index);
            else if (selected.size < 3) selected.add(index);
            render();
          } else if (state.phase === "attack" && player.canSelectPool) {
            act("attack", { index });
          } else if (state.phase === "defend" && player.canSelectPool) {
            act("defend", { index });
          }
        });
      });
    }

    function renderBattle() {
      const animation = battleAnimation && battleAnimation.key === battleAnimationKey()
        ? battleAnimation : null;
      const resolved = state && state.battleOutcome;
      const settled = animation && animation.stage === "settled";
      const showValues = resolved && animation &&
        (animation.stage === "values" || animation.stage === "outcome");
      const attacker = state && state.players && state.players[state.attacker];
      const defender = state && state.players && state.players[1 - state.attacker];
      const attackColor = attacker && attacker.color === "White" ? "#fff" : "#151817";
      const defendColor = defender && defender.color === "White" ? "#fff" : "#151817";
      let attackOptions = { pose: "attack" };
      let defendOptions = { pose: "attack", mirror: true };
      if (showValues) {
        attackOptions = { ...attackOptions, face: resolved.attackerValue, faceColor: attackColor };
        defendOptions = { ...defendOptions, face: resolved.defenderValue, faceColor: defendColor };
      }
      if (resolved && animation && animation.stage === "outcome") {
        attackOptions.pose = resolved.winner === 0 ? "win" : "lose";
        defendOptions.pose = resolved.winner === 1 ? "win" : "lose";
      }
      const attack = state && state.battleAttack && !settled
        ? cardMarkup(state.battleAttack, attackOptions) : '<div class="battle-empty"></div>';
      const defend = state && state.battleDefend && !settled
        ? cardMarkup(state.battleDefend, defendOptions) : '<div class="battle-empty"></div>';
      const attackerName = attacker ? attacker.color : "Attacker";
      const defenderName = defender ? defender.color : "Defender";
      document.getElementById("battleLeft").innerHTML =
        `<span class="battle-player-name">${esc(attackerName)} attacks</span>${attack}`;
      document.getElementById("battleRight").innerHTML =
        `<span class="battle-player-name">${esc(defenderName)} defends</span>${defend}`;
      const versus = document.getElementById("battleVs");
      versus.classList.toggle("exploding", Boolean(animation && animation.stage === "impact"));
      versus.textContent = "VS";
    }

    function renderActions() {
      const actions = document.getElementById("actions");
      actions.innerHTML = "";
      if (!state || !state.started || state.phase === "gameover") return;
      actions.append(makeButton("Dashboard", openDashboard, "secondary"));
      if (state.phase === "commit" && (state.mode === "hvh" || state.actor === 0)) {
        if (selected.size === 3) {
          actions.append(makeButton("Lock in pile", () => act("commit", { cards: [...selected] })));
        }
      } else if (state.phase === "seat" && (state.mode === "hvh" || state.actor === 0)) {
        actions.append(makeButton("Take seat X", () => act("seat", { seat: "X" })));
        actions.append(makeButton("Take seat Y", () => act("seat", { seat: "Y" })));
      }
      if (state.phase !== "gameover" && state.phase !== "handoff" && activeMode) {
        actions.append(makeButton("New game", requestNewGameConfirmation, "secondary"));
      }
    }

    function requestNewGameConfirmation() {
      showNewGameConfirmation = true;
      renderModal();
    }

    function renderModal() {
      const modal = document.getElementById("modal");
      if (showDashboard || showFeature) {
        modal.classList.add("hidden");
        modal.innerHTML = "";
        return;
      }
      if (showModeSelection || !state || !state.started) {
        const options = (state && state.heroes || []).map(hero =>
          `<option value="${esc(hero.id)}"${hero.id === state.defaultHeroId ? " selected" : ""}${hero.unlocked ? "" : " disabled"}>${esc(hero.name)}${hero.unlocked ? "" : " (locked)"}</option>`
        ).join("");
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal">
          <h2>Choose your match</h2>
          <p>Three rounds. Choose your cards, win prisoners, and claim the bounty.</p>
          ${state.opponentHint ? `<p>Your opponent last played: ${esc(state.opponentHint)}</p>` : ""}
          <label class="hero-select">Player 1 hero
            <select id="playerHero">${options}</select>
          </label>
          <label class="hero-select">Player 2 hero (Human vs Human)
            <select id="opponentHero">${options}</select>
          </label>
          <div class="mode-list">
            <button class="action" data-mode="hvh">Human vs Human</button>
            <button class="action secondary" data-mode="easy">Human vs AI · Easy</button>
            <button class="action secondary" data-mode="normal">Human vs AI · Normal</button>
            <button class="action secondary" data-mode="hard">Human vs AI · Hard</button>
            <button class="action secondary" id="backToDashboard">Back to dashboard</button>
          </div>
        </section>`;
        modal.querySelectorAll("[data-mode]").forEach(button => {
          button.addEventListener("click", () => startNewGame(button.dataset.mode));
        });
        modal.querySelector("#backToDashboard").addEventListener("click", openDashboard);
        return;
      }
      if (state.phase === "handoff") {
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal">
          <h2>Pass the screen</h2>
          <p>${esc(state.message)} Your cards stay hidden until you continue.</p>
          <button class="action" id="readyButton">I’m ready</button>
        </section>`;
        modal.querySelector("#readyButton").addEventListener("click", () => act("ready"));
      } else if (showNewGameConfirmation) {
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="newGameTitle">
          <h2 id="newGameTitle">Start a new game?</h2>
          <p>Your current game will be lost.</p>
          <div class="confirmation-actions">
            <button type="button" class="action secondary" id="cancelNewGameButton">Cancel</button>
            <button type="button" class="action" id="confirmNewGameButton">Start new game</button>
          </div>
        </section>`;
        modal.querySelector("#cancelNewGameButton").addEventListener("click", () => {
          showNewGameConfirmation = false;
          renderModal();
        });
        modal.querySelector("#confirmNewGameButton").addEventListener("click", () => {
          showNewGameConfirmation = false;
          modal.classList.add("hidden");
          modal.innerHTML = "";
          startNewGame();
        });
      } else if (state.phase === "gameover") {
        modal.classList.remove("hidden");
        const white = state.players.find(player => player.color === "White");
        const black = state.players.find(player => player.color === "Black");
        const heading = state.mode === "hvh"
          ? `${state.players[state.winner].color} wins`
          : state.winner === 0 ? "You Won!" : "You Lost";
        const payout = state.payout;
        const payoutDetails = payout
          ? (() => {
              const winBonus = payout.playerWon ? " ×3 (win bonus)" : "";
              const skillMultiplier = payout.skillBonusPercent > 0
                ? ` ×${(1 + payout.skillBonusPercent / 100).toFixed(2).replace(/0+$/, "").replace(/\.$/, "")} (Quartermaster +${payout.skillBonusPercent}%)`
                : "";
              const label = payout.playerWon ? "You Earned:" : "You Earn:";
              return `<section class="payout-breakdown" aria-label="Match Marks earnings">
                <p class="payout-total">${label} (50 + ${formatNumber(payout.playerScore)})${winBonus}${skillMultiplier} = ${formatNumber(payout.totalMarks)} Marks</p>
              </section>`;
            })()
          : '<p class="payout-error">Match earnings are unavailable.</p>';
        const tiebreakDetails = state.tiebreak && state.tiebreak.toLowerCase() !== "higher total score"
          ? `<p>${esc(state.tiebreak)}.</p>` : "";
        modal.innerHTML = `<section class="modal">
          <h2>${esc(heading)}</h2>
          <p>Final score: <strong>${white.score} – ${black.score}</strong> (White–Black)</p>
          ${tiebreakDetails}
          ${payoutDetails}
          <div class="confirmation-actions">
            <button type="button" class="action secondary" id="homeButton">Home</button>
            <button type="button" class="action" id="rematchButton">Rematch</button>
          </div>
        </section>`;
        modal.querySelector("#homeButton").addEventListener("click", openDashboard);
        modal.querySelector("#rematchButton").addEventListener("click", () => startNewGame());
      } else {
        modal.classList.add("hidden");
        modal.innerHTML = "";
      }
    }

    function makeButton(label, callback, style = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `action ${style}`.trim();
      button.textContent = label;
      button.addEventListener("click", callback);
      return button;
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString();
    }

    function renderDashboard() {
      const dashboard = state && state.dashboard;
      if (!dashboard) return;
      const drawsAvailable = dashboard.drawsAvailable;
      const skillPoints = dashboard.skillPoints;
      document.getElementById("dashboardCommander").textContent =
        `Player [${dashboard.commander}]`;
      document.getElementById("dashboardCommanderLabel").textContent =
        `Commander [${dashboard.commander}]`;
      const heroInitial = String(dashboard.title || "?").replace(/^The\s+/i, "").trim().charAt(0) || "?";
      document.getElementById("dashboardFeaturedHero").textContent = dashboard.title;
      document.getElementById("dashboardHeroCrest").textContent = heroInitial.toUpperCase();
      document.getElementById("dashboardAvatar").textContent = heroInitial.toUpperCase();
      document.getElementById("dashboardMarks").textContent = formatNumber(dashboard.marks);
      document.getElementById("dashboardCrowns").textContent = formatNumber(dashboard.crowns);
      const energy = `${dashboard.energy}/${dashboard.maxEnergy}`;
      const next = dashboard.energyNextSeconds > 0
        ? ` · next in ${Math.floor(dashboard.energyNextSeconds / 60)}:${String(dashboard.energyNextSeconds % 60).padStart(2, "0")}`
        : "";
      document.getElementById("dashboardEnergy").textContent = energy + next;
      document.getElementById("dashboardStreak").textContent =
        `Day ${dashboard.loginStreakCurrent} of 30 · Best: ${dashboard.loginStreakBest}`;
      document.getElementById("dashboardProgress").textContent =
        `${dashboard.winsSinceCampDraw} / ${dashboard.winsPerCampDraw} wins · ${drawsAvailable} draws`;
      document.getElementById("dashboardSkillPoints").textContent = String(skillPoints);
      const featuredItem = dashboard.dailyFeaturedItem;
      document.getElementById("dashboardShopItem").textContent =
        featuredItem ? featuredItem.name : "No featured item available";
      document.getElementById("dashboardShopDetail").textContent = featuredItem
        ? `${featuredItem.rarity} chroma · ${featuredItem.owned ? "Already owned" : "Preview only · regular listed price"}`
        : "The shop catalog has no available items.";
      document.getElementById("dashboardShopPrice").textContent = featuredItem
        ? `${formatNumber(featuredItem.cost)} ${featuredItem.currency === "marks" ? "Marks" : "Crowns"}`
        : "";
      const campDraw = document.getElementById("dashboardCampDraw");
      campDraw.textContent = drawsAvailable > 0
        ? `Camp Draw (${drawsAvailable})`
        : `Camp Draw · ${dashboard.pendingBoxes} pending boxes`;
      document.getElementById("dashboardAchievements").textContent =
        dashboard.unseenAchievements > 0
          ? `Achievements (${dashboard.unseenAchievements} new)`
          : "Achievements";
      const ad = document.getElementById("dashboardAd");
      const canWatchAd = dashboard.energy < dashboard.maxEnergy && dashboard.adsLeft > 0;
      ad.hidden = !canWatchAd;
      ad.textContent = canWatchAd
        ? `Watch Ad (+3 energy, ${dashboard.adsLeft} left today) · available in the terminal UI`
        : "";
      document.getElementById("dashboardPreviewNote").hidden = !dashboardPreview;
    }

    async function openFeature(feature) {
      const endpoints = {
        "camp-draw": "/api/camp-draw",
        achievements: "/api/achievements",
        shop: "/api/shop",
        heroes: "/api/heroes",
        skills: "/api/skills",
        profile: "/api/profile",
        campaigns: "/api/campaigns",
        history: "/api/history"
      };
      currentFeature = feature;
      if (feature === "shop") currentShopTab = "skins";
      if (feature === "skills") currentSkillBranch = skillTreeBranches[0].id;
      showDashboard = false;
      showFeature = true;
      showModeSelection = false;
      featureData = null;
      featureError = "";
      render();
      try {
        featureData = await api(endpoints[feature]);
        if (featureData.dashboard) state.dashboard = featureData.dashboard;
        render();
      } catch (error) {
        featureError = connectionError(error);
        render();
      }
    }

    function featureActionButton(label, action, attributes = "", disabled = false) {
      return `<button class="action${disabled ? " secondary" : ""}" type="button"
        data-feature-action="${action}" ${attributes}${disabled ? " disabled" : ""}>${esc(label)}</button>`;
    }

    function renderFeatureTabs(tabs, selected, dataAttribute) {
      return tabs.map(tab =>
        `<button class="feature-tab" type="button" role="tab" aria-selected="${tab.id === selected}"
          data-${dataAttribute}="${esc(tab.id)}">${esc(tab.label)}</button>`
      ).join("");
    }

    function renderFeatureScreen() {
      const titles = {
        "camp-draw": "Camp Draw",
        achievements: "Achievements",
        shop: "Shop",
        heroes: "Choose Hero",
        skills: "Skill Tree",
        profile: "Commander Record",
        campaigns: "Campaigns",
        history: "Match History"
      };
      document.getElementById("featureTitle").textContent = titles[currentFeature] || "Progression";
      const message = document.getElementById("featureMessage");
      message.textContent = featureError || (featureData && featureData.message) || "";
      const tabs = document.getElementById("featureTabs");
      if (currentFeature === "shop") {
        const shopTabs = [
          { id: "skins", label: "Skins" },
          { id: "heroes", label: "Heroes" },
          { id: "boxes", label: "Boxes" }
        ];
        tabs.setAttribute("aria-label", "Shop categories");
        tabs.innerHTML = renderFeatureTabs(shopTabs, currentShopTab, "shop-tab");
        tabs.classList.remove("hidden");
      } else if (currentFeature === "skills") {
        tabs.setAttribute("aria-label", "Skill tree branches");
        tabs.innerHTML = renderFeatureTabs(skillTreeBranches, currentSkillBranch, "skill-branch");
        tabs.classList.remove("hidden");
      } else {
        tabs.classList.add("hidden");
        tabs.innerHTML = "";
      }
      const content = document.getElementById("featureContent");
      if (!featureData) {
        content.innerHTML = featureError
          ? ""
          : '<section class="feature-section">Loading…</section>';
        return;
      }
      switch (currentFeature) {
        case "camp-draw":
          content.innerHTML = renderCampDrawFeature(featureData);
          break;
        case "achievements":
          content.innerHTML = renderAchievementsFeature(featureData);
          break;
        case "shop":
          content.innerHTML = renderShopFeature(featureData);
          break;
        case "heroes":
          content.innerHTML = renderHeroesFeature(featureData);
          break;
        case "skills":
          content.innerHTML = renderSkillsFeature(featureData);
          break;
        case "profile":
          content.innerHTML = renderCommanderFeature(featureData);
          break;
        case "campaigns":
          content.innerHTML = renderCampaignsFeature(featureData);
          break;
        case "history":
          content.innerHTML = renderHistoryFeature(featureData);
          break;
        default:
          content.innerHTML = "";
      }
    }

    function renderCampDrawFeature(page) {
      const pending = Object.entries(page.pendingBoxes || {}).filter(([, count]) => count > 0);
      const startButton = featureActionButton(
        page.result ? "Start another Camp Draw" : "Start Camp Draw",
        "start-draw", "", page.drawsAvailable < 1
      );
      let html = `<section class="feature-section">
        <h2>Available Draws</h2>
        <p>You have ${page.drawsAvailable} Camp Draw${page.drawsAvailable === 1 ? "" : "s"} available.</p>
        ${!page.started ? startButton : ""}
        ${page.started && page.prompt ? `<h3>Exchange ${page.prompt.exchangeIndex + 1} of 3</h3>
          <p>${page.prompt.isDefending ? "Defend against" : "Attack"}${
            page.prompt.cpuCard ? ` ${esc(campCardLabel(page.prompt.cpuCard))}` : ""
          }.</p>
          <div class="feature-list">${page.prompt.playerPool.map((card, index) => `
            <article class="feature-item"><h3>${esc(campCardLabel(card))}</h3>
              ${featureActionButton("Play this card", "play-camp-card", `data-index="${index}"`)}
            </article>`).join("")}
          </div>` : ""}
      </section>`;
      if (page.exchanges && page.exchanges.length) {
        html += `<section class="feature-section"><h2>Resolved Battles</h2><div class="feature-list">${
          page.exchanges.map((exchange, index) => {
            const outcome = exchange.outcome === 2 ? "Win" : exchange.outcome === 1 ? "Clash" : "Loss";
            return `<article class="feature-item"><h3>Battle ${index + 1}: ${outcome}</h3>
              <p>You: ${esc(campCardLabel(exchange.player_card))} · Opponent: ${esc(campCardLabel(exchange.cpu_card))}</p>
            </article>`;
          }).join("")
        }</div></section>`;
      }
      if (pending.length) {
        html += `<section class="feature-section"><h2>Pending Boxes</h2><div class="feature-list">${
          pending.map(([boxType, count]) => `<article class="feature-item">
            <h3>${esc(boxType)} Box × ${count}</h3>
            ${featureActionButton(`Open ${boxType} Box`, "open-box", `data-box-type="${esc(boxType)}"`)}
          </article>`).join("")
        }</div></section>`;
      }
      if (page.result) {
        const exchanges = page.result.exchanges || [];
        const reward = page.result.reward || {};
        const prize = reward.chroma_id
          ? `${reward.chroma_rarity || ""} ${reward.chroma_id} chroma`
          : reward.marks ? `${reward.marks} Marks`
            : reward.crowns ? `${reward.crowns} Crowns` : "No listed reward";
        html += `<section class="feature-section">
          <h2>Draw Result · ${page.result.player_wins} wins</h2>
          <p>Reward: ${esc(page.result.box_type)} box · ${esc(prize)}</p>
          <div class="feature-list">${exchanges.map((exchange, index) => {
            const outcome = exchange.outcome === 2 ? "Win" : exchange.outcome === 1 ? "Clash" : "Loss";
            return `<article class="feature-item"><h3>Battle ${index + 1}: ${outcome}</h3>
              <p>Your card: ${esc(campCardLabel(exchange.player_card))} · Opponent: ${esc(campCardLabel(exchange.cpu_card))}</p></article>`;
          }).join("")}</div>
        </section>`;
      }
      if (page.boxResult) {
        const reward = page.boxResult;
        const prize = reward.chroma_id
          ? `${reward.chroma_rarity || ""} ${reward.chroma_id} chroma`
          : reward.marks ? `${reward.marks} Marks`
            : reward.crowns ? `${reward.crowns} Crowns` : "No listed reward";
        html += `<section class="feature-section"><h2>Box Opened</h2>
          <p>${esc(reward.box_type)} box reward: ${esc(prize)}</p></section>`;
      }
      return html;
    }

    function campCardLabel(card) {
      const names = ["Scissors", "Paper", "Rock"];
      return `${names[card.suit] || "Suit"} ${card.face}`;
    }

    function renderAchievementsFeature(page) {
      const items = page.items || [];
      const sets = page.sets || [];
      return `<section class="feature-section"><h2>Achievement Gallery</h2>
        <div class="feature-list">${items.map(item => {
          const percent = item.goal > 0 ? Math.min(100, item.progress * 100 / item.goal) : (item.unlocked ? 100 : 0);
          const tiers = (item.tiers || []).map(tier =>
            `<p>${esc(tier.name)} · ${tier.goal} · ${tier.marks} Marks / ${tier.crowns} Crowns</p>`
          ).join("");
          return `<article class="feature-item">
            <h3>${esc(item.name)}${item.new ? ' <span class="feature-status">NEW</span>' : ""}</h3>
            <p>${esc(item.category)} · ${item.unlocked ? "Unlocked" : "In progress"}</p>
            <p>${esc(item.details)}</p>
            <p>${item.progress}${item.goal > 0 ? ` / ${item.goal}` : ""}</p>
            <div class="feature-progress"><span style="width:${percent}%"></span></div>${tiers}

          <h3>${esc(set.name)}</h3><p>${set.progress} / ${set.total} achievements · ${set.complete ? "Complete" : "In progress"}</p>
        </article>`).join("")}</div>

    function renderShopFeature(page) {
      const content = currentShopTab === "heroes" ? renderShopHeroes(page)
        : currentShopTab === "boxes" ? renderShopBoxes(page) : renderShopSkins(page);
      return content;
    }

    function renderShopSkins(page) {
      const chromas = (page.chromas || []).map(item => {
        const chroma = item.chroma;
        const currency = chroma.currency === "marks" ? "Marks" : "Crowns";
        const canAfford = chroma.currency === "marks"
          ? page.dashboard.marks >= chroma.cost
          : page.dashboard.crowns >= chroma.cost;
        const eventOnly = chroma.currency === "event";
        return `<article class="feature-item">
          <h3>${esc(chroma.name)}${item.owned ? " · Owned" : ""}</h3>
          <p>${esc(chroma.rarity)} · ${esc(chroma.color)}</p>
          <p>${eventOnly ? "Event offer" : `${chroma.cost} ${currency}`}</p>
          ${!item.owned && !eventOnly
            ? featureActionButton(`Buy for ${chroma.cost} ${currency}`, "buy-chroma", `data-id="${esc(chroma.id)}"`, !canAfford)
            : ""}
        </article>`;
      }).join("");
      const bundles = (page.bundles || []).map(item => `<article class="feature-item">
        <h3>${esc(item.bundle.name)}${item.owned ? " · Owned" : ""}</h3>
        <p>${esc(item.bundle.chroma_ids.join(", "))}</p>
        <p>${item.bundle.cost_crowns} Crowns</p>
        ${!item.owned ? featureActionButton(`Buy bundle · ${item.bundle.cost_crowns} Crowns`, "buy-bundle",
          `data-id="${esc(item.bundle.id)}"`, page.dashboard.crowns < item.bundle.cost_crowns) : ""}
      </article>`).join("");
      const chromaPick = page.chromaPickTokens > 0
        ? `<article class="feature-item"><h3>Pick Any Chroma · ${page.chromaPickTokens} token(s)</h3>
          <select id="chromaPickChoice">${(page.chromas || []).filter(item => !item.owned).map(item =>
            `<option value="${esc(item.chroma.id)}">${esc(item.chroma.name)}</option>`).join("")}</select>
          ${featureActionButton("Redeem token", "redeem-pick")}</article>`
        : "";
      return `<section class="feature-section"><h2>Chroma Catalog</h2><div class="feature-list">${chromas}</div></section>
        <section class="feature-section"><h2>Bundles</h2><div class="feature-list">${bundles}</div></section>
        ${chromaPick ? `<section class="feature-section"><h2>Chroma Tokens</h2><div class="feature-list">${chromaPick}</div></section>` : ""}`;

    function renderShopHeroes(page) {
      const heroesForSale = (page.heroes || []).filter(item => item.hero.id !== "recruit").map(item => `<article class="feature-item">
        <h3>${esc(item.hero.name)}${item.owned ? " · Owned" : ""}</h3>
        <p>${item.plays} plays · ${item.wins} wins</p>
        ${!item.owned ? featureActionButton(`Buy for ${page.directHeroCost} Crowns`, "buy-hero",
          `data-id="${esc(item.hero.id)}"`, !item.canBuy) : ""}
      </article>`).join("");
      return `<section class="feature-section"><h2>Heroes</h2><p>Direct purchase: ${page.directHeroCost} Crowns</p>
          <div class="feature-list">${heroesForSale}</div></section>`;
    }

    function renderShopBoxes(page) {
      const offers = (page.boxOffers || []).map(offer => {
        const currency = offer.currency === "crowns" ? "Crowns" : "Marks";
        const balance = offer.currency === "crowns" ? page.dashboard.crowns : page.dashboard.marks;
        const openButton = offer.available > 0
          ? offer.type === "hero"
            ? featureActionButton("Open Hero Box", "open-hero-box", 'data-box-type="free"')
            : featureActionButton(`Open ${offer.name}`, "open-box", `data-box-type="${esc(offer.type)}"`)
          : "";
        return `<article class="feature-item">
          <h3>${esc(offer.name)}</h3>
          <p>${formatNumber(offer.available)} available</p>
          <p>${formatNumber(offer.cost)} ${currency}</p>
          ${featureActionButton(`Buy for ${formatNumber(offer.cost)} ${currency}`, "buy-box",
            `data-box-type="${esc(offer.type)}"`, balance < offer.cost)}
          ${openButton}
        </article>`;
      }).join("");
      return `<section class="feature-section"><h2>Box Shop</h2>
        <p>Purchase boxes with Marks or Crowns. Open them here when available.</p>
        <div class="feature-list">${offers}</div>
      </section>`;
    }

    function renderHeroesFeature(page) {
      return `<section class="feature-section"><h2>Commander Hero</h2>
        <div class="feature-list">${(page.heroes || []).map(hero => `<article class="feature-item">
          <h3>${esc(hero.name)}${hero.id === page.defaultId ? " · Default" : ""}</h3>
          <p>${hero.unlocked ? "Unlocked" : "Locked"}</p>
          ${hero.unlocked && hero.id !== page.defaultId
            ? featureActionButton("Set as default", "select-hero", `data-id="${esc(hero.id)}"`)
            : ""}
        </article>`).join("")}</div>
      </section>`;
    }

    function renderSkillsFeature(page) {
      const branch = skillTreeBranches.find(item => item.id === currentSkillBranch) || skillTreeBranches[0];
      const nodes = (page.nodes || []).filter(item => branch.nodeIDs.includes(item.node.id));
      return `<section class="feature-section"><h2>Skill Tree · ${page.dashboard.skillPoints} Skill Point(s) · ${formatNumber(page.dashboard.crowns)} Crowns · ${esc(branch.label)}</h2>
        <div class="feature-list">${nodes.map(item => `<article class="feature-item">
          <h3>${esc(item.node.name)}${item.unlocked ? " · Unlocked" : ""}</h3>
          <p>${esc(item.node.description)}</p>
          ${item.node.prerequisite ? `<p>Requires: ${esc(item.node.prerequisite)}</p>` : ""}
          <p>Cost: ${item.node.cost_crowns} Crowns or 1 Skill Point</p>
          ${!item.unlocked ? `<div>
            ${item.canUnlockSkillPoint ? featureActionButton("Unlock with Skill Point", "unlock-skill",
              `data-id="${esc(item.node.id)}" data-payment="skill-point"`) : ""}
            ${item.canUnlockCrowns ? featureActionButton(`Unlock for ${item.node.cost_crowns} Crowns`, "unlock-skill",
              `data-id="${esc(item.node.id)}" data-payment="crowns"`) : ""}
            ${!item.canUnlockSkillPoint && !item.canUnlockCrowns
              ? `<p>${esc(item.skillPointReason || item.crownsReason)}</p>` : ""}
          </div>` : ""}
        </article>`).join("")}</div>
