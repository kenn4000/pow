        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        renderPuzzleBattleRemote();
        return;
      }
      if (state?.variant === "rummy") {
        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        renderRummyBattle();
        return;
      }
      if (state?.variant === "ladder") {
        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        renderLadderBattle();
        return;
      }
      if (state?.variant === "tug-war") {
        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        renderTugWarBattle();
        return;
      }
      if (state?.variant === "poker") {
        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        renderPokerBattle();
        return;
      }
      if (state?.variant === "poker-duel") {
        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        renderPokerDuelBattle();
        return;
      }
      if (state?.variant === "puzzler" || state?.variant === "abandon" || state?.variant === "abandon-duel") {
        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");
        left.hidden = true;
        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;
        if (state.variant === "puzzler") renderPuzzleBattle();
        else if (state.variant === "abandon-duel") renderAbandonDuelBattle();
        else renderAbandonBattle();
        return;
      }
      variantContent.hidden = true;
      left.hidden = false;
      right.hidden = false;
      versus.hidden = false;
      battle.classList.remove("variant-screen");
      battle.classList.toggle("drafting", state?.phase === "draft");
      if (state?.phase === "draft") {
        const cards = (state.draftPool || []).map(item => cardMarkup(
          state.variant === "fog" ? { ...item, faceHidden: false, faceRange: "" } : item
        )).join("");
        document.getElementById("battleLeft").innerHTML = `<div class="draft-battlefield">
          <span class="battle-player-name">Public battlefield · ${state.draftPool.length} cards remain</span>
          <div class="draft-card-pool">${cards}</div>
        </div>`;
        document.getElementById("battleRight").innerHTML = "";
        versus.classList.remove("exploding", "clash");
        versus.textContent = `PICK ${state.draftPickNumber}/${state.draftPickTotal}`;
        document.getElementById("battleLeft").querySelectorAll(".card[data-index]").forEach(button => {
          button.addEventListener("click", () => {
            if (state.phase === "draft") act("draft-pick", {index: Number(button.dataset.index)});
          });
        });
        return;
      }
      if (state?.variant === "fog" && state.phase !== "result") {
        const attacker = state.players?.[state.attacker];
        const defender = state.players?.[1 - state.attacker];
        const attack = state.battleAttack
          ? cardMarkup(state.battleAttack, { pose: "attack", hideFace: true })
          : '<div class="battle-empty"></div>';
        const defend = state.battleDefend
          ? cardMarkup(state.battleDefend, { pose: "attack", mirror: true, hideFace: true })
          : '<div class="battle-empty"></div>';
        left.innerHTML = `<span class="battle-player-name">${esc(attacker ? playerLabel(attacker) : "Attacker")} attacks</span>${attack}`;
        right.innerHTML = `<span class="battle-player-name">${esc(defender ? playerLabel(defender) : "Defender")} defends</span>${defend}`;
        versus.classList.remove("exploding", "clash");
        versus.textContent = "VS";
        return;
      }
      const animation = battleAnimation && battleAnimation.key === battleAnimationKey()
        ? battleAnimation : null;
      const resolved = state && state.battleOutcome;
      const settled = animation && animation.stage === "settled";
      const showValues = resolved && animation &&
        (animation.stage === "outcome" || animation.stage === "settled");
      const combatValue = (card, opponent) => {
        if (!card || !opponent || !Number.isFinite(card.face) ||
            !Number.isInteger(card.suit) || !Number.isInteger(opponent.suit)) return null;
        const shiftedFace = Math.max(1, card.face + Number(state?.modifiers?.shift || 0));
        return (card.suit + 1) % 3 === opponent.suit
          ? Math.max(1, shiftedFace * 2 + Number(state?.modifiers?.favored || 0))
          : shiftedFace;
      };
      const attackerValue = Number.isFinite(resolved?.attackerValue)
        ? resolved.attackerValue
        : combatValue(state?.battleAttack, state?.battleDefend);
      const defenderValue = Number.isFinite(resolved?.defenderValue)
        ? resolved.defenderValue
        : combatValue(state?.battleDefend, state?.battleAttack);
      const attacker = state && state.players && state.players[state.attacker];
      const defender = state && state.players && state.players[1 - state.attacker];
      const battlePoseActive = state?.phase !== "result" || animation?.stage === "clouds";
      let attackOptions = { pose: battlePoseActive ? "attack" : "idle", hideFace: true };
      let defendOptions = { pose: battlePoseActive ? "attack" : "idle", mirror: true, hideFace: true };
      if (showValues) {
        attackOptions = { ...attackOptions, face: attackerValue };
        defendOptions = { ...defendOptions, face: defenderValue };
      }
      if (resolved && animation && (animation.stage === "outcome" || animation.stage === "settled")) {
        attackOptions.pose = resolved.winner === 0 ? "win" : "lose";
        defendOptions.pose = resolved.winner === 1 ? "win" : "lose";
      }
      const attack = state && state.battleAttack
        ? cardMarkup(state.battleAttack, attackOptions) : '<div class="battle-empty"></div>';
      const defend = state && state.battleDefend
        ? cardMarkup(state.battleDefend, defendOptions) : '<div class="battle-empty"></div>';
      const attackerName = attacker ? playerLabel(attacker) : "Attacker";
      const defenderName = defender ? playerLabel(defender) : "Defender";
      const showResult = resolved && state.battleDefend && (settled || !animation || animation.stage === "outcome");
      const badge = side => {
        if (!showResult) return '';
        if (resolved.winner === -1) return '<span class="battle-result clash">Clash</span>';
        return resolved.winner === side ? '<span class="battle-result win">Captures</span>' : '<span class="battle-result lose">Captured</span>';
      };
      const lost = side => showResult && resolved.winner !== -1 && resolved.winner !== side ? ' battle-card-lost' : '';
      const attackFace = state?.battleAttack
        ? (showValues ? attackerValue : state.battleAttack.face) : "";
      const defendFace = state?.battleDefend
        ? (showValues ? defenderValue : state.battleDefend.face) : "";
      const attackNumberColor = showValues ? "#fff" : suitColorValue(state.battleAttack?.suit);
      const defendNumberColor = showValues ? "#fff" : suitColorValue(state.battleDefend?.suit);
      document.getElementById("battleLeft").innerHTML =
        `<span class="battle-player-name">${esc(attackerName)} ${attackerName === 'You' ? 'attack' : 'attacks'}</span><div class="battle-card-line${lost(0)}"><div class="battle-card-wrap">${attack}</div>${state?.battleAttack ? `<span class="battle-face" style="color:${attackNumberColor}">${attackFace}</span>` : ""}</div>${badge(0)}`;
      document.getElementById("battleRight").innerHTML =
        `<span class="battle-player-name">${esc(defenderName)} ${defenderName === 'You' ? 'defend' : 'defends'}</span><div class="battle-card-line${lost(1)}"><span class="battle-face" style="color:${defendNumberColor}">${defendFace}</span><div class="battle-card-wrap">${defend}</div></div>${badge(1)}`;
      versus.classList.toggle("exploding", Boolean(animation && animation.stage === "impact"));
      versus.classList.toggle("clash", Boolean(showResult && resolved.winner === -1));
      versus.textContent = showResult && resolved.winner === -1 ? "=" : "VS";
      if (animation?.stage === "clouds") {
        const cloud = document.createElement("canvas");
        cloud.className = "battle-cloud-frame";
        cloud.width = animation.cloudAtlas.frameWidth;
        cloud.height = animation.cloudAtlas.frameHeight;
        cloud.setAttribute("aria-hidden", "true");
        versus.append(cloud);
        drawBattleCloudFrame(animation);
      }
    }

    function renderActions() {
      if (lifecycle.signal.aborted) return;
      const actions = document.getElementById("actions");
      const dockActions = document.getElementById("gameplayDockActions");
      actions.innerHTML = "";
      dockActions.replaceChildren();
      renderGameplayDock();
      const appendNavigationAction = (label, callback, className = "secondary") => {
        const target = document.getElementById("gameplayDock").hidden ? actions : dockActions;
        target.append(makeButton(label, callback, className));
      };
      const appendModeManagementActions = () => {
        if (state.phase === "handoff") return;
        const divider = document.createElement("span");
        divider.className = "action-divider";
        divider.setAttribute("aria-hidden", "true");
        actions.append(divider);
        if (state.mode === "online") {
          appendNavigationAction("Find another opponent", chooseMatchMode, "secondary manage");
          return;
        }
        appendNavigationAction("Choose match mode", chooseMatchMode, "secondary manage");
        appendNavigationAction("Restart this mode", requestNewGameConfirmation, "secondary manage");
      };
      if (!state || !state.started) return;
      if (state.variant === "puzzler") {
        appendNavigationAction("Home", openDashboard);
        appendModeManagementActions();
        return;
      }
      if (state.variant === "online-battle-lobby") {
        return;
      }
      if (state.mode === "online" && !state.canAct && state.phase !== "gameover") {
        appendNavigationAction("Home", openDashboard);
        return;
      }
      if (state.variant === "puzzle-battle") {
        return;
      }
      if (state.variant === "poker-duel") {
        appendNavigationAction("Home", openDashboard);
        appendModeManagementActions();
        if (state.phase === "gameover") return;
        const placementActions = document.getElementById("pokerDuelPlacementActions");
        if (!placementActions) return;
        const [index] = selected;
        const player = state.pokerDuel?.players?.[0];
        const canPlay = state.phase === "poker-duel-play" && state.actor === 0 && state.canAct !== false;
        placementActions.replaceChildren();
        (player?.table || []).slice(0, 3).forEach((slot, slotIndex) => {
          const hand = String.fromCharCode(65 + slotIndex);
          const button = makeButton(`Place ${hand}`,
            () => act("poker-duel-place", { index, slot: slotIndex }), "primary");
          button.disabled = actionInProgress || index === undefined || !canPlay || !slot.canPlace;
          button.setAttribute("aria-label", `Place selected card in Hand ${hand}`);
          placementActions.append(button);
        });
        const redraw = makeButton("New Draw", () => act("poker-duel-redraw", { index }), "primary");
        redraw.disabled = actionInProgress || index === undefined || !canPlay || !player?.drawPileCount;
        redraw.setAttribute("aria-label", "Discard selected card and draw a new card");
        placementActions.append(redraw);
        return;
      }
      if (state.variant === "rummy") {
        const turnActions = document.getElementById("rummyTurnActions");
        turnActions?.replaceChildren();
        appendNavigationAction("Home", openDashboard);
        appendModeManagementActions();
        if (state.phase === "handoff") return;
        const rummy = state.rummy || {};
        if (state.phase === "rummy-opening") {
          const draw = makeButton("Draw 2 cards", () => act("rummy-draw-two"), "primary");
          draw.disabled = actionInProgress || !rummy.canDrawTwo;
          (turnActions || actions).append(draw);
        } else if (state.phase === "rummy-turn") {
          const take = makeButton("Take face-up card", () => act("rummy-draw-face-up"), "primary");
          take.disabled = actionInProgress || !rummy.canDrawFaceUp;
          const draw = makeButton("Draw 2 cards", () => act("rummy-draw-two"), "secondary");
          draw.disabled = actionInProgress || !rummy.canDrawTwo;
          (turnActions || actions).append(take, draw);
        } else if (state.phase === "rummy-discard") {
          return;
        }
        return;
      }
      if (state.variant === "ladder") {
        if (state.phase === "gameover") return;
        appendNavigationAction("Home", openDashboard);
        if (state.phase === "ladder-play" && state.ladder?.canPass) {
          const pass = makeButton("Pass · opponent opens a new chain", () => act("ladder-pass"), "primary");
          pass.disabled = actionInProgress;
          actions.append(pass);
        }
        return;
      }
      if (state.variant === "tug-war") {
        appendNavigationAction("Home", openDashboard);
        appendModeManagementActions();
        if (state.phase !== "gameover" && state.tugWar?.canPass) {
          actions.append(makeButton("Pass", () => act("tug-war-pass"), "primary"));
        }
        return;
      }
      if (state.variant === "poker") {
        const poker = state.poker || {};
        if (state.phase === "gameover") {
          appendMissionActions(actions, () => startMission(state.campaign.id, state.campaign.index));
          appendNavigationAction("Choose match mode", chooseMatchMode, "secondary manage");
          return;
        }
        appendNavigationAction("Home", openDashboard);
        appendModeManagementActions();
        if (state.phase === "poker-next-game") {
          const nextHero = document.getElementById("pokerNextHero")?.value || poker.heroId;
          actions.append(makeButton("Next Game", () => act("poker-next-game", { playerHeroId: nextHero }), "primary"));
          return;
        }
        if (state.phase === "poker-play") {
          const [index] = selected;
          if (index === undefined) return;
          (poker.canPlace || []).forEach((canPlace, slot) => {
            if (canPlace) actions.append(makeButton(`Place in Hand ${String.fromCharCode(65 + slot)}`,
              () => act("poker-place", { index, slot }), "primary"));
          });
          const redraw = makeButton("Redraw selected card", () => act("poker-redraw", { index }), "secondary");
          redraw.disabled = actionInProgress || !poker.canRedraw;
          actions.append(redraw);
        }
        return;
      }
      if (state.variant === "abandon") {
        if (state.campaign && state.abandon?.complete) return;
        appendNavigationAction("Home", openDashboard);
        return;
      }
      if (state.phase === "gameover") return;
      appendNavigationAction("Home", openDashboard);
      if (state.phase === "commit" && state.actor === 0) {
        const commit = makeButton(`Lock in pile · ${selected.size}/3 selected`, () => act("commit", { cards: [...selected] }), "primary");
        commit.disabled = selected.size !== 3 || actionInProgress;
        actions.append(commit);
      }
      if (state.phase !== "gameover" && state.phase !== "handoff" && activeMode) appendModeManagementActions();
    }

    function renderGameplayDock() {
      const dock = document.getElementById("gameplayDock");
      const chooser = document.getElementById("gameplaySuitChooser");
      const shell = document.getElementById("gameShell");
      const active = !showDashboard && !showFeature && state?.started &&
        state.phase !== "gameover" && state.dashboard?.matchTokensAllowed;
      dock.hidden = !active;
      shell.classList.toggle("has-gameplay-dock", Boolean(active));
      if (!active) {
        chooser.hidden = true;
        openSuitMenu = null;
        return;
      }

      const dashboard = state.dashboard;
      const addToken = (label, action, kind, count, canUse, canBuyWhenUnavailable = true) => {
        const quantity = Number(count || 0);
        const button = makeButton("", async () => {
          if (quantity < 1) {
            openTokenBuyDialog(kind);
            return;
          }
          if (action === "replace") {
            pendingTokenDialog = { kind: "replace" };
            renderModal();
            syncModalAccessibility();
            return;
          }
          if (action === "undo" || action === "restart") {
            const title = action === "restart" ? "Use Restart Mission token?"
              : "Use Undo Last Move token?";
            const description = action === "restart"
              ? "The current campaign mission or CPU match will restart."
              : "The last move and any CPU response to it will be undone.";
            if (await confirmAction(title, description)) {
              await act(action === "restart" ? "use-restart-token" : "use-undo-token");
            }
            return;
          }
          if (await confirmAction("Skip this campaign mission?", "The mission will advance with no Marks or completion rewards.")) {
            await act("use-campaign-skip-token");
          }
        }, "secondary gameplay-dock-button");
        button.innerHTML = `${consumableIconMarkup(kind)}<span class="gameplay-dock-count">${quantity}</span>`;
        button.setAttribute("aria-label", `${label}, ${quantity} token${quantity === 1 ? "" : "s"} available`);
        button.disabled = actionInProgress || (quantity > 0 && !canUse) ||
          (quantity < 1 && !canBuyWhenUnavailable);
        return button;
      };
      const undo = () => addToken("Undo", "undo", "undo", dashboard.undoMoveTokens, dashboard.canUndo);
      const restart = () => addToken("Restart", "restart", "restart",
        dashboard.restartMissionTokens, dashboard.canRestart);
      const replace = () => addToken("Replace card", "replace", "replace", dashboard.replaceCardTokens,
        (dashboard.replaceOptions || []).length > 0);
      const skip = () => addToken("Skip mission", "skip", "skip", dashboard.campaignSkipTokens,
        dashboard.canSkipMission, Boolean(state.campaign && dashboard.canSkipMission));
      const toggle = makeButton("", () => {
        const opening = chooser.hidden;
        chooser.hidden = !opening;
        openSuitMenu = null;
        toggle.setAttribute("aria-label", opening ? "Hide suit chooser" : "Show suit chooser");
        toggle.setAttribute("aria-expanded", String(opening));
        if (opening) renderDockSuitCycle();
      }, "secondary gameplay-dock-toggle");
      toggle.innerHTML = `<img src="${import.meta.env.BASE_URL}skins/icons/trichooser.png" alt="" aria-hidden="true">`;
      toggle.setAttribute("aria-label", chooser.hidden ? "Show suit chooser" : "Hide suit chooser");
      toggle.setAttribute("aria-expanded", String(!chooser.hidden));
      dock.replaceChildren(undo(), restart(), toggle, replace(), skip());
      if (!chooser.hidden) renderDockSuitCycle();
    }

    function requestNewGameConfirmation() {
      showNewGameConfirmation = true;
      renderModal();
    }

    function updateSetupModal(modal) {
      const duel = setupVariant === "poker-duel";
      const abandonDuel = setupVariant === "abandon-duel";
      const tugWarMatch = setupVariant === "tug-war";
      const cpuMatch = duel || setupVariant === "ladder" || abandonDuel;
      const puzzleBattle = setupVariant === "puzzle-battle";
      if (puzzleBattle && !["easy", "friend", "online", "ranked"].includes(setupMode)) setupMode = "easy";
      const onlineMode = ["friend", "online", "ranked"].includes(setupMode);
      const onlineBattle = onlineMode && !puzzleBattle;
      const matchMode = modal.querySelector("#matchMode");
      if (matchMode.dataset.variant !== setupVariant) {
        const networkOptions = [
          ["friend", "Challenge a Friend"],
          ["online", "Online Matchmaking"],
          ["ranked", "Ranked Matchmaking (best of 3)"]
        ];
        const options = puzzleBattle
          ? [["easy", "Human vs CPU · Easy"], ...networkOptions]
          : tugWarMatch || abandonDuel
            ? [["normal", "Human vs CPU"], ...networkOptions]
            : cpuMatch
              ? [["easy", "Human vs CPU · Easy"], ["normal", "Human vs CPU · Medium"], ["hard", "Human vs CPU · Hard"], ...networkOptions]
              : [["easy", "Human vs AI · Easy"], ["normal", "Human vs AI · Normal"], ["hard", "Human vs AI · Hard"], ...networkOptions];
        matchMode.innerHTML = options.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");
        matchMode.dataset.variant = setupVariant;
      }
      if (tugWarMatch && !["normal", "friend", "online", "ranked"].includes(setupMode)) setupMode = "normal";
      matchMode.value = setupMode;
      modal.querySelector("#matchModeLabel").hidden = false;
      modal.querySelector("#puzzleBattleEntry").hidden = !onlineMode;
      modal.querySelector("#puzzleBattleFriendHandleLabel").hidden = !onlineMode || setupMode !== "friend";
      const description = modal.querySelector("#modeDescription");
      description.textContent = modeDescription(setupMode, setupVariant);
      description.hidden = !description.textContent;
      const start = modal.querySelector("#startMatchButton");
      start.dataset.mode = setupMode;
      start.dataset.variant = setupVariant;
      start.textContent = puzzleBattle || onlineBattle
        ? setupMode === "easy" ? "Play Easy CPU"
          : setupMode === "friend" ? "Invite friend"
          : setupMode === "ranked" ? "Find a ranked opponent" : "Find an opponent"
        : startLabel(setupMode, setupVariant);
      start.disabled = actionInProgress ||
        onlineMode && setupMode === "friend" &&
        !modal.querySelector("#puzzleBattleFriendHandle").value.trim();
    }

    function renderModal() {
      const modal = document.getElementById("modal");
      if (pendingTokenDialog) {
        modal.classList.remove("hidden");
        if (pendingTokenDialog.kind === "replace") {
          const options = state.dashboard?.replaceOptions || [];
          modal.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenDialogTitle"><h2 id="tokenDialogTitle" class="token-dialog-title">${consumableIconMarkup("replace")}<span>Replace any card</span></h2><p>Choose an available card to discard and replace with a random draw.</p><div class="token-options">${options.map((option, optionIndex) => `<button class="action secondary token-option" data-replace-option="${optionIndex}">${esc(option.label)}</button>`).join("")}</div><div class="confirmation-actions"><button class="action secondary" id="closeTokenDialog">Cancel</button></div></section>`;
          modal.querySelector("#closeTokenDialog").onclick = closeTokenDialog;
          modal.querySelectorAll("[data-replace-option]").forEach(button => {
            button.onclick = async () => {
              const option = options[Number(button.dataset.replaceOption)];
              if (!option) return;
              closeTokenDialog();
              await act("use-replace-token", { source: option.source, index: option.index });
            };
          });
        } else {
          const offers = tokenQuickBuyOffers(pendingTokenDialog.kind);
          const crowns = Number(state.dashboard?.crowns || 0);
          modal.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="tokenDialogTitle"><h2 id="tokenDialogTitle" class="token-dialog-title">${consumableIconMarkup(pendingTokenDialog.kind)}<span>Buy ${esc(tokenName(pendingTokenDialog.kind))}</span></h2><p>Quick purchases use Crowns only. You have ${formatNumber(crowns)} Crowns.</p><div class="token-options">${offers.map(offer => `<button class="action secondary token-option" data-token-offer="${esc(offer.id)}" ${crowns < offer.cost || actionInProgress ? "disabled" : ""}>${esc(offer.name)} · ${offer.cost} Crowns</button>`).join("")}</div><div class="confirmation-actions"><button class="action secondary" id="closeTokenDialog">Cancel</button></div></section>`;
          modal.querySelector("#closeTokenDialog").onclick = closeTokenDialog;
          modal.querySelectorAll("[data-token-offer]").forEach(button => {
            button.onclick = async () => {
              const id = button.dataset.tokenOffer;
              closeTokenDialog();
              await act("quick-buy-token", { id });
            };
          });
        }
        return;
      }
      if (pendingConfirmation) {
        modal.classList.remove('hidden');
        modal.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle"><h2 id="confirmationTitle">${esc(pendingConfirmation.title)}</h2><p>${esc(pendingConfirmation.description)}</p><div class="confirmation-actions"><button class="action secondary" id="declineConfirmation">Cancel</button><button class="action primary" id="acceptConfirmation">${esc(pendingConfirmation.acceptLabel)}</button></div></section>`;
        modal.querySelector('#declineConfirmation').onclick = () => settleConfirmation(false);
        modal.querySelector('#acceptConfirmation').onclick = () => settleConfirmation(true);
        return;
      }
      if (shopPreviewChromaID && showFeature && currentFeature === "shop" && featureData) {
        if (renderShopPreviewModal(modal)) return;
      }
      if (showDashboard || showFeature) {
        modal.classList.add("hidden");
        modal.innerHTML = "";
        return;
      }
      if (state?.variant === "online-battle-lobby") {
        modal.classList.add("hidden");
        modal.innerHTML = "";
        return;
      }
      if (showModeSelection || !state || !state.started) {
        if (setupVariant === "puzzler" || setupVariant === "abandon") setupVariant = "main";
        const setupDescription = setupVariant === "tug-war"
          ? "Push three shared piles toward your side. Play cards to win the top-card clash, flip from the deck, and manage limited pushes."
          : setupVariant === "rummy"
            ? "Build three-card sets and same-suit runs. Improve your hand over six turns, then score melds and deadwood."
            : setupVariant === "abandon-duel"
              ? "Flip a shared board card, then choose a pair from the board or your personal pile. Play two six-pair rounds with the seats swapped."
              : setupVariant === "poker-duel"
                ? "Play a standalone Poker mirror match against a CPU, an invited friend, or a randomly matched opponent."
                : setupVariant === "ladder"
                  ? "Play Ladder against an AI, an invited friend, or a randomly matched opponent. Play legal cards that meet or exceed the current chain; wild cards start a suit chain."
                  : "";
        const heroOption = hero =>
          `<option value="${esc(hero.id)}"${hero.id === state.defaultHeroId ? " selected" : ""}${hero.unlocked ? "" : " disabled"}>${esc(hero.name)}</option>`;
        const setupHeroes = (state && state.heroes) || [];
        const lockedHeroes = setupHeroes.filter(hero => !hero.unlocked);
        const options = setupHeroes.filter(hero => hero.unlocked).map(heroOption).join("")
          + (lockedHeroes.length ? `<optgroup label="Locked · unlock in Campaigns or Shop">${lockedHeroes.map(heroOption).join("")}</optgroup>` : "");
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal">
          <h2>Choose your match</h2>
          ${setupDescription ? `<p>${esc(setupDescription)}</p>` : ""}
          ${state?.started && state.phase !== 'gameover' ? '<p>Your current match stays saved until you start a replacement. Starting a mode archives the unfinished match.</p>' : ''}
          ${state?.opponentHint ? `<p>Your opponent last played: ${esc(state.opponentHint)}</p>` : ""}
          <label class="hero-select">Game mode<select id="matchVariant">${[
            ["main", "Prisoners of War"], ["fog", "Fog of War"], ["rummy", "Rummy"],
            ["abandon-duel", "Abandon"],
            ["poker-duel", "Poker"], ["ladder", "Ladder"], ["tug-war", "Tug War"], ["puzzle-battle", "Puzzler"]
          ].map(([id, label]) => `<option value="${id}"${setupVariant === id ? " selected" : ""}>${label}</option>`).join("")}</select></label>
          <label id="matchModeLabel" class="hero-select">Match mode<select id="matchMode">${[['easy','Human vs AI · Easy'],['normal','Human vs AI · Normal'],['hard','Human vs AI · Hard'],['friend','Challenge a Friend'],['online','Online Matchmaking'],['ranked','Ranked Matchmaking (best of 3)']].map(([id,label]) => `<option value="${id}"${setupMode === id ? ' selected' : ''}>${label}</option>`).join('')}</select></label>
          <div id="puzzleBattleEntry" hidden>
            <label id="puzzleBattleFriendHandleLabel" class="hero-select" hidden>Friend handle<input id="puzzleBattleFriendHandle" type="text" maxlength="20" autocomplete="off" placeholder="e.g. player_123" required></label>
          </div>
          <p id="modeDescription">${esc(modeDescription(setupMode, setupVariant))}</p>
          <label id="playerHeroLabel" class="hero-select">Your hero
            <select id="playerHero">${options}</select>
          </label>
          ${conductorTuningMarkup(state?.dashboard?.conductorLevel, "matchConductorTuning")}
          <div id="heroSetupDetails">${heroDetails((state?.heroes || []).find(hero => hero.id === state?.defaultHeroId), false)}</div>
          <div class="mode-list">
            <button class="action primary" id="startMatchButton" data-mode="${setupMode}" data-variant="${setupVariant}">${esc(startLabel(setupMode, setupVariant))}</button>
            <button class="action secondary" id="backToDashboard">Cancel</button>
            <a href="#/cards">Learn the rules and inspect cards</a>
          </div>
        </section>`;
        modal.querySelectorAll("[data-mode]").forEach(button => {
          button.addEventListener("click", () => {
            if (button.dataset.variant === "puzzle-battle") {
              startPuzzleBattle(
                button.dataset.mode,
                document.getElementById("playerHero").value,
                document.getElementById("puzzleBattleFriendHandle").value
              );
              return;
            }
            if (["friend", "online", "ranked"].includes(button.dataset.mode)) {
              startOnlineBattle(
                button.dataset.variant,
                button.dataset.mode,
                document.getElementById("playerHero").value,
                document.getElementById("puzzleBattleFriendHandle").value,
                conductorTuningPayload(document.getElementById("matchConductorTuning"))
              );
              return;
            }
            startNewGame(button.dataset.mode, button.dataset.variant);
          });
        });
        modal.querySelector("#backToDashboard").addEventListener("click", () => navigateGame(state?.started ? 'battle' : 'home'));
        const syncConductorTuning = () => {
          const label = modal.querySelector("#matchConductorTuning")?.closest("label");
          if (label) label.hidden = modal.querySelector("#matchVariant").value === "puzzle-battle";
        };
        modal.querySelector("#matchVariant").addEventListener("change", syncConductorTuning);
        syncConductorTuning();
        modal.querySelector('#playerHero').addEventListener('change', event => {
          modal.querySelector('#heroSetupDetails').innerHTML = heroDetails((state?.heroes || []).find(hero => hero.id === event.target.value), false);
        });
        modal.querySelector('#matchMode').addEventListener('change', event => {
          setupMode = event.target.value;
          updateSetupModal(modal);
        });
        modal.querySelector('#matchVariant').addEventListener('change', event => {
          setupVariant = event.target.value;
          updateSetupModal(modal);
        });
        modal.querySelector("#puzzleBattleFriendHandle").addEventListener("input", () => updateSetupModal(modal));
        updateSetupModal(modal);
        return;
      }
      if (state?.phase === "gameover" &&
          ["abandon", "abandon-duel"].includes(state.variant) &&
          !showNewGameConfirmation) {
        modal.classList.remove("hidden");
        if (state.variant === "abandon") {
          const abandon = state.abandon || {};
          const won = Boolean(abandon.won);
          modal.innerHTML = `<section class="modal result-modal ${won ? "won" : "lost"}">
            ${resultBannerMarkup(won)}
            <p>Final score: <strong>${esc(abandon.score ?? 0)}</strong> · Target: ${esc(abandon.target ?? 0)}</p>
            ${state.campaign?.result ? `<p>${esc(state.campaign.result)}</p>` : ""}
            <div class="confirmation-actions" id="resultActions"></div>
          </section>`;
          const resultActions = modal.querySelector("#resultActions");
          if (state.campaign) {
            appendMissionActions(resultActions,
              () => startMission(state.campaign.id, state.campaign.index));
          } else {
            resultActions.append(makeButton("Home", openDashboard, "secondary"));
            resultActions.append(makeButton("Choose mode", chooseMatchMode, "primary"));
          }
        } else {
          const duel = state.abandonDuel || {};
          const winner = Number(duel.winner ?? state.winner ?? -1);
          const scores = duel.totalScores || [];
          const roundScores = duel.roundScores || [];
          const outcomeMarkup = winner < 0
            ? "<h2>Abandon Duel draw</h2>"
            : resultBannerMarkup(winner === 0);
          const tiebreak = duel.tiebreak === "total_score"
            ? "Higher total score wins."
            : duel.tiebreak === "score_tied"
              ? "Scores were tied."
              : duel.tiebreak || state.tiebreak;
          modal.innerHTML = `<section class="modal result-modal ${winner === 0 ? "won" : winner < 0 ? "" : "lost"}">
            ${outcomeMarkup}
            ${resultPayoutMarkup(state.payout, state.mode)}
            <p>Final score: <strong>${Number(scores[0] || 0)} – ${Number(scores[1] || 0)}</strong> (You–${state.mode === "online" ? "Opponent" : "CPU"})</p>
            <p>Round 1: ${Number(roundScores[0]?.[0] || 0)} – ${Number(roundScores[0]?.[1] || 0)} ·
              Round 2: ${Number(roundScores[1]?.[0] || 0)} – ${Number(roundScores[1]?.[1] || 0)}</p>
            ${tiebreak ? `<p>${esc(tiebreak)}</p>` : ""}
            <div class="confirmation-actions" id="resultActions"></div>
          </section>`;
          const resultActions = modal.querySelector("#resultActions");
          resultActions.append(makeButton("Home", openDashboard, "secondary"));
          resultActions.append(makeButton("Rematch", () => startNewGame(), "primary"));
          resultActions.append(makeButton("Choose mode", chooseMatchMode, "secondary"));
        }
        return;
      }
      if (["puzzler", "abandon"].includes(state?.variant) && !showNewGameConfirmation) {
        modal.classList.add("hidden");
        modal.innerHTML = "";
        return;
      }
      if (state.phase === "handoff") {
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal">
          <h2>Pass the screen</h2>
          <p>${esc(state.message)} Your cards stay hidden until you continue.</p>
          <button class="action primary" id="readyButton">I’m ready</button>
        </section>`;
        modal.querySelector("#readyButton").addEventListener("click", () => act("ready"));
      } else if (showNewGameConfirmation) {
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="newGameTitle">
          <h2 id="newGameTitle">Start a new game?</h2>
          <p>The unfinished match will be archived. This starts a new ${esc(startLabel(activeMode, state?.variant || "main"))}.</p>
          <div class="confirmation-actions">
            <button type="button" class="action secondary" id="cancelNewGameButton">Cancel</button>
            <button type="button" class="action primary" id="confirmNewGameButton">Start new game</button>
          </div>
        </section>`;
        modal.querySelector("#cancelNewGameButton").addEventListener("click", () => {
          showNewGameConfirmation = false;
          renderModal();
        });
        modal.querySelector("#confirmNewGameButton").addEventListener("click", () => {
          showNewGameConfirmation = false;
          modal.classList.add("hidden");
          modal.innerHTML = "";
          startNewGame();
        });
      } else if (state.phase === "gameover" && state.variant === "tug-war") {
        const tug = state.tugWar || {};
        const result = tug.result || {};
        const winner = Number(result.winner ?? -1);
        const outcomeMarkup = winner < 0
          ? "<h2>Tug War draw</h2>"
          : resultBannerMarkup(winner === Number(tug.viewer || 0));
        const payoutDetails = resultPayoutMarkup(state.payout, state.mode);
        const playerName = index => tug.players?.[index]?.you ? "You"
          : state.mode === "online" ? "Opponent"
            : tug.players?.[index]?.cpu ? "CPU"
              : `Player ${index + 1}`;
        const pileMarkup = (result.piles || []).map((pile, index) => {
          const position = pile.zone === -1 ? `${playerName(0)} side` : pile.zone === 1 ? `${playerName(1)} side` : "neutral";
          const column = pile.zone === -1 ? 1 : pile.zone === 1 ? 3 : 2;
          const cards = tug.piles?.[index]?.cards || [];
          return `<section class="tug-war-pile" style="grid-column:${column};grid-row:${index + 1}" aria-label="Pile ${index + 1}, ${esc(position)}, value ${formatModifier(Number(pile.value || 0))}">
            <div class="tug-war-pile-cards">${cards.map(card => cardMarkup(card)).join("") || '<span class="empty-row">No cards</span>'}</div>
            <div class="tug-war-stack-bracket" aria-hidden="true"></div>
            <span class="tug-war-stack-value">${formatModifier(Number(pile.value || 0))}</span>
          </section>`;
        }).join("");
        const scoreLines = (result.scores || []).map((score, index) =>
          `<p><strong>${esc(playerName(index))}:</strong> ${formatModifier(Number(score))} points · ${Number(result.zoneCards?.[index] || 0)} cards in owned piles</p>`
        ).join("");
        const tiebreak = result.tiebreak === "zone-cards" ? "Tied points were broken by cards in owned piles."
          : result.tiebreak === "draw" ? "Both points and owned-card counts were tied." : "Points";
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal result-modal ${winner === tug.viewer ? "won" : winner < 0 ? "" : "lost"}">
          ${outcomeMarkup}
          ${payoutDetails}
          <p>Tiebreak: ${esc(tiebreak)}</p>
          <div class="tug-war-players">${scoreLines}</div>
          <div class="tug-war-board">${pileMarkup}</div>
          <div class="confirmation-actions" id="resultActions"></div>
        </section>`;
        const resultActions = modal.querySelector("#resultActions");
        resultActions.append(makeButton("Home", openDashboard, "secondary"));
        resultActions.append(makeButton("Rematch", () => startNewGame(), "primary"));
        resultActions.append(makeButton("Choose mode", chooseMatchMode, "secondary"));
      } else if (state.phase === "gameover" && state.variant === "rummy") {
        const results = state.rummy?.results || [];
        const outcomeMarkup = state.winner === -1
          ? "<h2>Rummy draw</h2>"
          : resultBannerMarkup(state.winner === 0);
        const payoutDetails = resultPayoutMarkup(state.payout, state.mode);
        const resultMarkup = result => {
          const playerName = result.player === 0 ? "You"
            : state.mode === "online" ? "Opponent" : `${modeName(state.mode)} opponent`;
          const partition = result.partition || {};
          const melds = (partition.melds || []).map(meld =>
            `<li><strong>${esc(meld.kind)} · ${formatModifier(Number(meld.points))}</strong><div class="rummy-result-cards">${(meld.cards || []).map(card => cardMarkup(card)).join("")}</div></li>`
          ).join("");
          const deadwood = (partition.deadwood || []).map(card => cardMarkup(card)).join("");
          return `<section class="rummy-result">
            <h3>${esc(playerName)} · ${formatModifier(Number(partition.total || 0))} points</h3>
            <p>Meld points ${formatModifier(Number(partition.meldPoints || 0))} − deadwood ${partition.deadwoodPenalty || 0}</p>
            <ul>${melds || "<li>No melds</li>"}</ul>
            <p>Deadwood</p><div class="rummy-result-cards">${deadwood || '<span class="empty-row">None</span>'}</div>
          </section>`;
        };
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal result-modal ${state.winner === 0 ? "won" : state.winner === 1 ? "lost" : ""}">
          ${outcomeMarkup}
          ${payoutDetails}
          <p>Final score: <strong>${results.map(result => result.partition?.total ?? 0).join(" – ")}</strong></p>
          <div class="rummy-results">${results.map(resultMarkup).join("")}</div>
          <div class="confirmation-actions" id="resultActions"></div>
        </section>`;
        const resultActions = modal.querySelector("#resultActions");
        resultActions.append(makeButton("Home", openDashboard, "secondary"));
        resultActions.append(makeButton("Rematch", () => startNewGame(), "primary"));
        resultActions.append(makeButton("Choose mode", chooseMatchMode, "secondary"));
      } else if (state.phase === "gameover" && state.variant === "poker-duel") {
        const duel = state.pokerDuel || {};
        const cpuName = { easy: "Easy CPU", normal: "Medium CPU", hard: "Hard CPU" }[state.mode];
        const duelPlayerName = index => state.mode === "online"
          ? index === 0 ? "You" : "Opponent"
          : index === 0 ? "You" : cpuName;
        const outcomeMarkup = state.winner === -1
          ? "<h2>Poker Duel draw</h2>"
          : resultBannerMarkup(state.winner === 0);
        const payoutDetails = resultPayoutMarkup(state.payout, state.mode);
        const scores = duel.finalScores || [];
        const scoreDetails = scores.map((score, index) => `<section class="poker-duel-final-score">
          <h3>${esc(duelPlayerName(index))}</h3>
          ${score.constraintMet
            ? `<p>Game Score: ${score.gameScore}</p>
              <p>Bank Bonus: ${Number(score.bankBonus || 0).toFixed(1)}</p>
              <p>Hand A highest: ${formatModifier(score.handAHighBonus)}</p>
              <p>Hand C lowest: ${formatModifier(score.handCLowBonus)}</p>`
            : `<p>Mission constraint failed: ${esc(score.constraintFailReason || "not met")}</p>`}
        </section>`).join("");
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal result-modal ${state.winner === 0 ? "won" : state.winner === 1 ? "lost" : ""}">
          ${outcomeMarkup}
          ${payoutDetails}
          <div class="poker-duel-final-scores">${scoreDetails}</div>
          <div class="confirmation-actions" id="resultActions"></div>
        </section>`;
        const resultActions = modal.querySelector("#resultActions");
        resultActions.append(makeButton("Home", openDashboard, "secondary"));
        resultActions.append(makeButton("Rematch", () => startNewGame(), "primary"));
        resultActions.append(makeButton("Choose mode", chooseMatchMode, "secondary"));
      } else if (state.phase === "gameover" && state.variant === "ladder") {
        const ladder = state.ladder || {};
        const winner = state.winner;
        const outcomeMarkup = winner < 0
          ? "<h2>Ladder draw</h2>"
          : resultBannerMarkup(winner === 0);
        const payoutDetails = resultPayoutMarkup(state.payout, state.mode);
        const finalHands = nonemptyLadderHands(ladder.finalHands).map(({ cards, index }) => {
          return `<section><h3>${index === 0 ? "You" : "Opponent"}</h3>
            <div class="ladder-final-hand">${cards.map(card => cardMarkup(card)).join("")}</div>
          </section>`;
        }).join("");
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="modal result-modal ${winner === 0 ? "won" : "lost"}">
          ${outcomeMarkup}
          ${payoutDetails}
          ${finalHands ? `<div class="ladder-final-hands">${finalHands}</div>` : ""}
          <div class="confirmation-actions" id="resultActions"></div>
        </section>`;
        const resultActions = modal.querySelector("#resultActions");
        resultActions.append(makeButton("Home", openDashboard, "secondary"));
        resultActions.append(makeButton("Rematch", () => startNewGame(), "primary"));
        resultActions.append(makeButton("Choose mode", chooseMatchMode, "secondary"));
      } else if (state.phase === "gameover") {
        modal.classList.remove("hidden");
        const outcomeMarkup = state.winner < 0
          ? "<h2>Match draw</h2>"
          : resultBannerMarkup(state.winner === 0);
        const payout = state.payout;
        const payoutDetails = payoutBreakdownMarkup(payout);
        const tiebreakDetails = state.tiebreak && state.tiebreak.toLowerCase() !== "higher total score"
          ? `<p>${esc(state.tiebreak)}.</p>` : "";
        modal.innerHTML = `<section class="modal result-modal ${state.winner === 0 ? "won" : "lost"}">
          ${outcomeMarkup}
          <p>Final score: <strong>${state.players[0].score} – ${state.players[1].score}</strong> (You–Opponent)</p>
          ${tiebreakDetails}
          ${state.campaign ? `<p>${esc(state.campaign.result || '')}</p>` : payoutDetails}
          ${state.dashboard ? `<dl class="result-summary">
            <div><dt>Balance</dt><dd>${currencyAmountMarkup(state.dashboard.marks, "Marks")} · ${currencyAmountMarkup(state.dashboard.crowns, "Crowns")}</dd></div>
            <div><dt>Camp Draw</dt><dd>${state.dashboard.winsSinceCampDraw} / ${state.dashboard.winsPerCampDraw} wins</dd></div>
            <div><dt>Achievements</dt><dd>${state.dashboard.unseenAchievements > 0 ? `<a href="#/achievements">${state.dashboard.unseenAchievements} new ${state.dashboard.unseenAchievements === 1 ? "update" : "updates"}</a>` : "No new updates"}</dd></div>
          </dl>` : ''}
          <div class="confirmation-actions" id="resultActions"></div>
          <a href="#/saved-games${state.gameId ? `/${state.gameId}` : ''}">Review saved match</a>
          <details class="score-details"><summary>Achievement changes since match start</summary>${state.achievementUpdates?.length ? `<ul>${state.achievementUpdates.map(update => `<li>${currencyTextMarkup(update)}</li>`).join('')}</ul>` : '<p>No new achievement tiers were awarded during this match.</p>'}</details>
          ${scoreBreakdownMarkup()}
        </section>`;
        const resultActions = modal.querySelector("#resultActions");
        if (state.campaign) {
          appendMissionActions(resultActions,
            () => startMission(state.campaign.id, state.campaign.index));
        } else {
          resultActions.append(makeButton("Home", openDashboard, "secondary"));
          resultActions.append(makeButton("Rematch", () => startNewGame(), "primary"));
          resultActions.append(makeButton("Choose mode", chooseMatchMode, "secondary"));
        }
      } else {
        modal.classList.add("hidden");
        modal.innerHTML = "";
      }
    }

    function makeButton(label, callback, style = "") {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `action ${style}`.trim();
      button.textContent = label;
      button.addEventListener("click", callback);
      return button;
    }

    function formatNumber(value) {
      return Number(value || 0).toLocaleString();
    }

    function currencyIconMarkup(currency, className = "currency-icon", alt = "") {
      const file = { marks: "marks.png", crowns: "crowns.png", energy: "energy.png" }[String(currency).toLowerCase()];
      if (!file) return "";
      return `<img class="${className}" src="${import.meta.env.BASE_URL}skins/icons/${file}" alt="${esc(alt)}"${alt ? "" : ' aria-hidden="true"'}>`;
    }

    function consumableIconMarkup(id, className = "consumable-icon") {
      const file = {
        restart: "restart.png",
        "restart-one": "restart.png",
        "restart-six": "restart.png",
        undo: "undo.png",
        "undo-one": "undo.png",
        "undo-ten": "undo.png",
        replace: "cardswap.png",
        "replace-card-one": "cardswap.png",
        "replace-card-ten": "cardswap.png",
        skip: "skip.png",
        "campaign-skip-one": "skip.png"
      }[String(id).toLowerCase()];
      if (!file) return "";
      return `<img class="${className}" src="${import.meta.env.BASE_URL}skins/icons/${file}" alt="" aria-hidden="true">`;
    }

    function currencyAmountMarkup(value, currency, prefix = "") {
      const formatted = formatNumber(value);
      return `<span class="currency-amount" aria-label="${esc(`${prefix}${formatted} ${currency}`)}">${prefix}${formatted}${currencyIconMarkup(currency)}</span>`;
    }

    function resultBannerMarkup(won) {
      const file = won ? "victory_banner.png" : "defeat_banner.png";
      const alt = won ? "Victory" : "Defeat";
      return `<h2 class="result-banner-heading"><img class="result-banner" src="${import.meta.env.BASE_URL}skins/icons/${file}" alt="${alt}"></h2>`;
    }

    function payoutBreakdownMarkup(payout) {
      if (!payout) return '<p class="payout-error">Match earnings are unavailable.</p>';
      const crowns = payout.totalCrowns > 0
        ? `<p>${currencyAmountMarkup(payout.totalCrowns, "Crowns", "+")}${payout.dailyWinBonusCrowns > 0 ? ` including ${formatNumber(payout.dailyWinBonusCrowns)} first-win-of-day bonus` : ""}</p>`
        : "";
      return `<section class="payout-breakdown" aria-label="Match earnings">
        <p class="payout-total">${currencyAmountMarkup(payout.totalMarks, "Marks", "+")}</p>
        ${crowns}
        <p class="payout-formula">${formatNumber(payout.baseMarks)} base Marks${payout.aiMultiplier < 1 ? ` · ${Math.round(payout.aiMultiplier * 100)}% AI reward` : ""}${payout.skillBonusPercent > 0 ? ` · +${payout.skillBonusPercent}% Marks skill` : ""}</p>
      </section>`;
    }

    function resultPayoutMarkup(payout, mode) {
      if (payout) return payoutBreakdownMarkup(payout);
      return ["easy", "normal", "hard"].includes(mode)
        ? '<p class="payout-error">Match earnings are unavailable.</p>'
        : "";
    }

    function currencyTextMarkup(value) {
      return esc(value).replace(/\b(Marks|Crowns)\b/g, currency =>
        currencyIconMarkup(currency, "currency-icon inline-currency-icon", currency));
    }

    function chestIconMarkup(type, alt = "", className = "chest-icon") {
      const file = {
        wooden: "wooden_chest.png",
        silver: "silver_chest.png",
        gold: "golden_chest.png",
        diamond: "prismatic_chest.png",
        prismatic: "prismatic_chest.png",
        hero: "hero_chest.png"
      }[String(type).toLowerCase()];
      if (!file) return "";
      return `<img class="${className}" src="${import.meta.env.BASE_URL}skins/icons/${file}" alt="${esc(alt)}"${alt ? "" : ' aria-hidden="true"'}>`;
    }

    function chestAnimationFrameNames(prefix) {
      return [
        `${prefix}_chest.png`,
        ...Array.from({ length: 6 }, (_, index) => `${prefix}_shake_${String(index + 1).padStart(2, "0")}.png`),
        `${prefix}_ajar1.png`, `${prefix}_ajar2.png`, `${prefix}_open.png`
      ];
    }

    function loadChestAtlas(boxType) {
      const animation = chestAnimationTypes[boxType];
      if (!animation) return Promise.reject(new Error(`No chest animation is configured for ${boxType}.`));
      if (!chestAtlasPromises.has(animation.sheet)) {
        const request = (async () => {
          const base = `${import.meta.env.BASE_URL}skins/icons/animations/`;
          const response = await fetch(`${base}${animation.sheet}.json`, { signal: lifecycle.signal });
          if (!response.ok) throw new Error(`Chest animation metadata request failed (${response.status})`);
          const atlas = await response.json();
          const frameNames = chestAnimationFrameNames(animation.prefix);
          const frames = frameNames.map(name => {
            const frame = atlas.frames?.[name];
            if (!frame) throw new Error(`Chest animation frame ${name} is missing`);
            return frame;
          });
          const frameWidth = frames[0].frame?.w;
          const frameHeight = frames[0].frame?.h;
          if (frameWidth !== 640 || frameHeight !== 640 || frames.some(frame =>
            frame.frame?.w !== frameWidth || frame.frame?.h !== frameHeight ||
            frame.rotated || frame.trimmed ||
            frame.frame.x < 0 || frame.frame.y < 0 ||
            frame.frame.x + frameWidth > atlas.meta?.size?.w ||
            frame.frame.y + frameHeight > atlas.meta?.size?.h)) {
            throw new Error(`${animation.sheet} has invalid frame dimensions or bounds`);
          }
          const image = new Image();
          image.src = `${base}${encodeURIComponent(atlas.meta?.image || `${animation.sheet}.png`)}`;
          await image.decode();
          if (image.naturalWidth !== atlas.meta?.size?.w || image.naturalHeight !== atlas.meta?.size?.h) {
            throw new Error(`${animation.sheet} dimensions do not match its metadata`);
          }
          return { image, frames, frameNames, frameWidth, frameHeight };
        })().catch(error => {
          chestAtlasPromises.delete(animation.sheet);
          throw error;
        });
        chestAtlasPromises.set(animation.sheet, request);
      }
      return chestAtlasPromises.get(animation.sheet);
    }

    function drawChestRevealFrames() {
      if (!chestReveal?.atlas) return;
      document.querySelectorAll(".chest-reveal-frame canvas").forEach(canvas => {
        const context = canvas.getContext("2d");
        const frame = chestReveal.atlas.frames[chestReveal.frameIndex];
        if (!context || !frame) return;
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(chestReveal.atlas.image,
          frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
          0, 0, canvas.width, canvas.height);
      });
    }

    function chestRewardText(reward, chroma) {
      const parts = [];
      if (reward.chroma_id) parts.push(`${chroma?.name || reward.chroma_id} skin${reward.chroma_rarity ? ` (${reward.chroma_rarity})` : ""}`);
      if (reward.marks) parts.push(`${formatNumber(reward.marks)} Marks`);
      if (reward.energy) parts.push(`${formatNumber(reward.energy)} Energy`);
      if (reward.crowns) parts.push(`${formatNumber(reward.crowns)} Crowns`);
      return parts.join(" + ") || reward.fallback_reason || "No listed reward";
    }

    function renderChestReveal() {
      if (!chestReveal) return "";
      const isChoice = chestReveal.rewards.length > 1;
      const isAnimating = chestReveal.stage === "loading" || chestReveal.stage === "animation";
      const names = { wooden: "Wooden", silver: "Silver", gold: "Gold", diamond: "Diamond", prismatic: "Prismatic" };
      return `<div class="chest-reveal-overlay"><section class="chest-reveal-dialog" role="dialog" aria-modal="true" aria-labelledby="chestRevealTitle">
        <h2 id="chestRevealTitle">${isAnimating ? `Opening ${names[chestReveal.boxType] || "Reward"} Chest` : isChoice ? "Choose Your Reward" : "Chest Reward"}</h2>
        ${chestReveal.error ? `<p role="alert">${esc(chestReveal.error)}</p>` : ""}
        <div class="chest-reveal-chests" style="--chest-count:${chestReveal.rewards.length}">
          ${chestReveal.rewards.map((item, index) => `<article class="chest-reveal-candidate">
            <h3>${isChoice ? `Prize ${index + 1}` : `${names[chestReveal.boxType] || "Reward"} Chest`}</h3>
            <div class="chest-reveal-frame">${chestReveal.atlas ? `<canvas width="640" height="640" aria-hidden="true"></canvas>` : '<span class="chest-reveal-hint">Loading chest animation…</span>'}</div>
            ${!isAnimating ? `<p class="chest-reveal-prize">${esc(chestRewardText(item.reward, item.chroma))}</p>` : ""}
            ${chestReveal.stage === "choice" ? `<button class="action" type="button" data-chest-choice="${index}">Choose Prize ${index + 1}</button>` : ""}
          </article>`).join("")}
        </div>
        ${chestReveal.stage === "reveal" ? '<button class="action" type="button" data-close-chest-reveal>Continue</button>' : ""}
        ${chestReveal.stage === "loading" ? '<p class="chest-reveal-hint">Preparing the chest…</p>' : ""}
      </section></div>`;
    }

    function advanceChestAnimation(id, delay) {
      chestRevealTimer = window.setTimeout(() => {
        if (!chestReveal || chestReveal.id !== id || chestReveal.stage !== "animation") return;
        if (chestReveal.frameIndex === chestReveal.atlas.frames.length - 1) {
          chestReveal.stage = chestReveal.rewards.length > 1 ? "choice" : "reveal";
          render();
          return;
        }
        chestReveal.frameIndex++;
        render();
        drawChestRevealFrames();
        const nextDelay = chestReveal.frameIndex === 0 ? 500 : chestReveal.frameIndex <= 6 ? 60 : 120;
        advanceChestAnimation(id, nextDelay);
      }, delay);
    }

    function beginChestReveal(boxType, rewards) {
      if (!rewards?.length || !chestAnimationTypes[boxType]) return;
      window.clearTimeout(chestRevealTimer);
      const id = ++chestRevealSequenceID;
      chestReveal = { id, boxType, rewards, stage: "loading", frameIndex: 0, atlas: null, error: "" };
      render();
      loadChestAtlas(boxType).then(atlas => {
        if (!chestReveal || chestReveal.id !== id) return;
        chestReveal.atlas = atlas;
        chestReveal.stage = "animation";
        render();
        drawChestRevealFrames();
        advanceChestAnimation(id, 500);
      }).catch(error => {
        if (error.name === "AbortError" || !chestReveal || chestReveal.id !== id) return;
        console.error("Could not load chest animation:", error);
        chestReveal.error = "The chest animation could not be loaded.";
        chestReveal.stage = chestReveal.rewards.length > 1 ? "choice" : "reveal";
        render();
      });
    }

    function selectChestReward(index) {
      if (featureActionInProgress || !chestReveal || chestReveal.stage !== "choice") return;
      featureActionInProgress = true;
      const version = navigationVersion;
      api("/api/camp-draw", { action: "choose-reward", index }).then(data => {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureData = data;
        if (data.dashboard) state.dashboard = data.dashboard;
        window.clearTimeout(chestRevealTimer);
        chestReveal = null;
        render();
      }).catch(error => {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureError = connectionError(error);
        render();
      }).finally(() => { featureActionInProgress = false; });
    }

      else if (preview?.dataset.previewId !== featuredItem.id) {

    async function openFeature(feature) {
      if (shopPreviewChromaID) stopShopPreview();
      const endpoints = {
        "camp-draw": "/api/camp-draw",
        achievements: "/api/achievements",
        shop: "/api/shop",
        heroes: "/api/heroes",
        skills: "/api/skills",
        profile: "/api/profile",
        campaigns: "/api/campaigns",
        history: "/api/history",
        social: "/api/social"
      };
      const version = ++navigationVersion;
      currentFeature = feature;
      if (feature === "shop") currentShopTab = "skins";
      if (feature === "skills") currentSkillBranch = skillTreeBranches[0].id;
      showDashboard = false;
      showFeature = true;
      showModeSelection = false;
      featureData = null;
      featureError = "";
      render();
      try {
        const data = await api(endpoints[feature]);
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        if (feature === "history") {
          // Campaign missions are recorded as AI matches; name them from saved games.
          try {
            const games = await api("/api/games");
            data.campaignNames = Object.fromEntries((games.games || []).filter(game => game.campaignName).map(game => [game.id, game.campaignName]));
          } catch { data.campaignNames = {}; }
          if (version !== navigationVersion || lifecycle.signal.aborted) return;
        }
        featureData = data;
        if (featureData.dashboard) state.dashboard = featureData.dashboard;
        render();
        if (feature === "camp-draw" && featureData.result?.awaiting_choice) {
          const rewards = featureData.result.reward_options || [];
          beginChestReveal(featureData.result.box_type, rewards.map(reward => ({
            reward,
            chroma: featureData.rewardChromas?.[reward.chroma_id]
          })));
        }
      } catch (error) {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureError = connectionError(error);
        render();
      }
    }
