    async function handleFeatureClick(event) {
      const dependency = event.target.closest('[data-prerequisite]');
      if (dependency) { const branch = skillTreeBranches.find(branch => branch.nodeIDs.includes(dependency.dataset.prerequisite)); if (branch) navigateGame(`skills/${branch.id}/${dependency.dataset.prerequisite}`); return; }
      const chestChoice = event.target.closest("[data-chest-choice]");
      if (chestChoice) { selectChestReward(Number(chestChoice.dataset.chestChoice)); return; }
      if (event.target.closest("[data-close-chest-reveal]")) {
        if (featureActionInProgress) return;
        window.clearTimeout(chestRevealTimer);
        chestReveal = null;
        render();
        return;
      }
      const shopTab = event.target.closest("[data-shop-tab]");
      if (shopTab) {
        featureFocusTarget = shopTab.id;
        navigateGame(`shop/${shopTab.dataset.shopTab}`);
        return;
      }
      const skillTab = event.target.closest("[data-skill-branch]");
      if (skillTab) {
        featureFocusTarget = skillTab.id;
        navigateGame(`skills/${skillTab.dataset.skillBranch}`);
        return;
      }
      const button = event.target.closest("[data-feature-action]");
      if (!button || button.disabled || featureActionInProgress) return;
      const action = button.dataset.featureAction;
      if (action === 'retry-feature') { openFeature(currentFeature); return; }
      if (action === 'start-mission') { await startMission(button.dataset.campaign, Number(button.dataset.index)); return; }
      if (action === "preview-chroma") { openShopPreview(button.dataset.id); return; }
      if (action === "buy-chroma") { await purchaseChroma(button.dataset.id); return; }
      let path;
      let body;
      switch (action) {
        case "start-draw":
          path = "/api/camp-draw";
          body = { action: "start-draw" };
          break;
        case "play-camp-card":
          path = "/api/camp-draw";
          body = { action: "play-card", index: Number(button.dataset.index) };
          break;
        case "open-box":
          path = "/api/camp-draw";
          body = { action: "open-box", boxType: button.dataset.boxType };
          break;
        case "buy-hero":
        case "buy-box":
          if (!await confirmAction(`Purchase ${button.closest('article').querySelector('h3').textContent}?`, `${button.textContent.trim()}. Current balance: ${formatNumber(state.dashboard.marks)} Marks and ${formatNumber(state.dashboard.crowns)} Crowns.`)) return;
          path = "/api/shop";
          body = { action, id: button.dataset.id, boxType: button.dataset.boxType, payment: button.dataset.payment };
          break;
        case "buy-energy":
          if (!await confirmAction("Purchase Energy?", `${button.textContent.trim()}. Current balance: ${formatNumber(state.dashboard.marks)} Marks and ${formatNumber(state.dashboard.crowns)} Crowns.`)) return;
          path = "/api/shop";
          body = { action, amount: Number(button.dataset.amount), payment: button.dataset.payment };
          break;
        case "buy-consumable":
          if (!await confirmAction("Purchase item?", `${button.textContent.trim()}. Current balance: ${formatNumber(state.dashboard.marks)} Marks and ${formatNumber(state.dashboard.crowns)} Crowns.`)) return;
          path = "/api/shop";
          body = { action, id: button.dataset.id, payment: button.dataset.payment };
          break;
        case "buy-skill-points":
          if (!await confirmAction("Purchase Skill Points?", `${button.textContent.trim()}. Skill unlocks require Skill Points. Current balance: ${formatNumber(state.dashboard.crowns)} Crowns.`)) return;
          path = "/api/shop";
          body = { action, id: button.dataset.id };
          break;
        case "skip-mission":
          if (!await confirmAction("Skip this campaign mission?", "The mission will advance with no Marks or completion rewards.")) return;
          path = "/api/campaigns";
          body = { action, campaignId: button.dataset.campaign, missionIndex: Number(button.dataset.index) };
          break;
        case "open-hero-box":
          if (!await confirmAction('Open Hero Box?', 'This uses one available Hero Box and adds its reward to your collection.')) return;
          path = "/api/shop";
          body = { action, boxType: button.dataset.boxType };
          break;
        case "redeem-pick":
          path = "/api/shop";
          body = { action, id: document.getElementById("chromaPickChoice").value };
          break;
        case "select-hero":
          path = "/api/heroes";
          body = { action: "select", id: button.dataset.id };
          break;
        case 'save-name':
          path = '/api/profile';
          body = { name: document.getElementById('commanderName').value };
          break;
        case 'assign-chroma':
          path = '/api/shop';
          body = { action, id: button.dataset.id, suit: document.querySelector(`[data-chroma-suit="${button.dataset.id}"]`).value };
          break;
        case "unlock-skill": {
          const skill = button.closest('.skill-card')?.querySelector('h3')?.textContent?.trim() || 'this skill';
          const balance = `You have ${state.dashboard.skillPoints} Skill ${state.dashboard.skillPoints === 1 ? 'Point' : 'Points'}.`;
          if (!await confirmAction(`Unlock ${skill}?`, `${button.textContent.trim()}. Skill unlocks are permanent. ${balance}`)) return;
          featureFocusTarget = `skill-node-${button.dataset.id}`;
          path = "/api/skills";
          body = { action: "unlock", id: button.dataset.id, payment: button.dataset.payment };
          break;
        }
        case "save-social-handle":
          path = "/api/social/handle";
          body = { handle: document.getElementById("socialHandleInput").value };
          break;
        case "send-friend-request":
          path = "/api/social/requests";
          body = { handle: document.getElementById("socialRequestHandle").value, message: document.getElementById("socialRequestMessage").value };
          break;
        case "accept-friend-request":
        case "reject-friend-request":
          path = `/api/social/requests/${encodeURIComponent(button.dataset.requestId)}/${action === "accept-friend-request" ? "accept" : "reject"}`;
          body = {};
          break;
        case "block-player":
          path = "/api/social/blocks";
          body = { handle: button.dataset.handle };
          break;
        case "block-player-input":
          path = "/api/social/blocks";
          body = { handle: document.getElementById("socialBlockHandle").value };
          break;
        case "unblock-player":
          path = "/api/social/unblock";
          body = { handle: button.dataset.handle };
          break;
        case "send-social-message":
          path = "/api/social/messages";
          body = { handle: document.getElementById("socialMessageHandle").value, body: document.getElementById("socialMessageBody").value };
          break;
        default:
          return;
      }
      featureError = "";
      featureActionInProgress = true;
      const version = navigationVersion;
      button.disabled = true;
      try {
        let data = await api(path, body);
        let chestRevealRequest = null;
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        if (currentFeature === "social") {
          const notice = {
            "save-social-handle": "Handle updated.",
            "send-friend-request": "Friend request sent.",
            "accept-friend-request": "Friend request accepted.",
            "reject-friend-request": "Friend request rejected.",
            "block-player": "Player blocked.",
            "block-player-input": "Player blocked.",
            "unblock-player": "Player unblocked.",
            "send-social-message": "Message sent."
          }[action];
          data = await api("/api/social");
          if (notice) data.message = notice;
        }
        featureData = data;
        if (action === "open-box") {
          const result = data.boxResult || {};
          const chroma = data.boxChroma;
          const rewards = [];
          if (result.chroma_id) rewards.push(`${chroma?.name || result.chroma_id} skin${result.chroma_rarity ? ` (${result.chroma_rarity})` : ""}`);
          if (result.marks) rewards.push(`${formatNumber(result.marks)} Marks`);
          if (result.energy) rewards.push(`${formatNumber(result.energy)} Energy`);
          if (result.crowns) rewards.push(`${formatNumber(result.crowns)} Crowns`);
          const reward = rewards.join(" + ") || "No listed reward";
          const type = result.box_type || button.dataset.boxType || "";
          const message = `Opened ${type.charAt(0).toUpperCase()}${type.slice(1)} Box: ${reward}.`;
          if (currentFeature === "shop") {
            featureData = await api("/api/shop");
            featureData.message = message;
            featureData.boxResult = result;
            featureData.boxChroma = chroma;
          }
          if (result.box_type && chestAnimationTypes[result.box_type]) {
            chestRevealRequest = { boxType: result.box_type, rewards: [{ reward: result, chroma }] };
          }
        } else if (action === "play-camp-card" && featureData.result) {
          const result = featureData.result;
          const rewards = result.awaiting_choice ? result.reward_options || [] : [result.reward];
          chestRevealRequest = {
            boxType: result.box_type,
            rewards: rewards.map(reward => ({
              reward,
              chroma: featureData.rewardChromas?.[reward.chroma_id] ||
                (featureData.rewardChroma?.id === reward.chroma_id ? featureData.rewardChroma : null)
            }))
          };
        }
        if (featureData.dashboard) state.dashboard = featureData.dashboard;
        if (currentFeature === "heroes" && featureData.defaultId) {
          state.defaultHeroId = featureData.defaultId;
        }
        render();
        if (chestRevealRequest) beginChestReveal(chestRevealRequest.boxType, chestRevealRequest.rewards);
      } catch (error) {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureError = connectionError(error);
        render();
      } finally {
        featureActionInProgress = false;
      }
    }

    function syncPokerDuelTimer() {
      const active = state?.variant === "poker-duel" &&
        ["poker-duel-play", "poker-duel-thinking"].includes(state.phase);
      if (!active) {
        if (pokerDuelTimer !== null) window.clearInterval(pokerDuelTimer);
        pokerDuelTimer = null;
        pokerDuelTimerKey = "";
        return;
      }
      const duel = state.pokerDuel || {};
      const key = `${state.gameId}:${duel.turnNumber}:${duel.activePlayer}`;
      if (key !== pokerDuelTimerKey) {
        pokerDuelTimerKey = key;
        pokerDuelDeadline = Date.now() + Math.max(0, Number(duel.turnRemainingMs || 0));
      }
      const update = () => {
        const remaining = Math.max(0, pokerDuelDeadline - Date.now());
        const clock = document.getElementById("pokerDuelTimer");
        if (clock) clock.textContent = `${(remaining / 1000).toFixed(1)}s`;
        if (remaining === 0 && state.phase !== "poker-duel-thinking" && !actionInProgress &&
            (state.mode !== "online" || state.canAct)) {
          if (pokerDuelTimer !== null) window.clearInterval(pokerDuelTimer);
          pokerDuelTimer = null;
          act("poker-duel-timeout");
        }
      };
      if (pokerDuelTimer !== null) window.clearInterval(pokerDuelTimer);
      update();
      if (pokerDuelTimer === null) pokerDuelTimer = window.setInterval(update, 100);
    }

    function syncPokerDuelPolling() {
      const active = state?.variant === "poker-duel" && state.mode !== "online" &&
        state.pokerDuel?.activePlayer === 1 && state.phase !== "gameover";
      if (!active) {
        if (pokerDuelPollTimer !== null) window.clearInterval(pokerDuelPollTimer);
        pokerDuelPollTimer = null;
        return;
      }
      if (pokerDuelPollTimer !== null) return;
      pokerDuelPollTimer = window.setInterval(async () => {
        if (pokerDuelPollInProgress || actionInProgress) return;
        pokerDuelPollInProgress = true;
        const gameId = state?.gameId;
        try {
          const next = await api("/api/state");
          if (next.gameId === gameId && next.variant === "poker-duel") {
            state = next;
            activeMode = next.mode;
            if (next.phase === "poker-duel-thinking" &&
                Number(next.pokerDuel?.cpuThinkRemainingMs || 0) <= 0) {
              await act("poker-duel-cpu-turn");
            } else {
              render();
            }
          }
        } catch (error) {
          setStatus(`Waiting for CPU update: ${connectionError(error)}`, true);
        } finally {
          pokerDuelPollInProgress = false;
        }
      }, 400);
    }

    function syncLadderPolling() {
      const active = state?.variant === "ladder" &&
        ["ladder-opening-reveal", "ladder-thinking"].includes(state.phase);
      if (!active) {
        if (ladderPollTimer !== null) window.clearInterval(ladderPollTimer);
        ladderPollTimer = null;
        return;
      }
      if (ladderPollTimer !== null) return;
      ladderPollTimer = window.setInterval(async () => {
        if (ladderPollInProgress || actionInProgress) return;
        ladderPollInProgress = true;
        const gameId = state?.gameId;
        try {
          const next = await api("/api/state");
          if (next.gameId === gameId && next.variant === "ladder") {
            state = next;
            activeMode = next.mode;
            render();
          }
        } catch (error) {
          setStatus(`Waiting for Ladder turn update: ${connectionError(error)}`, true);
        } finally {
          ladderPollInProgress = false;
        }
      }, 100);
    }

    function puzzleBattleStatusMessage(response = {}) {
      if (!response.match) {
        return response.status === "queued" ? "Searching for an opponent."
          : response.outgoingInvites?.length ? "Waiting for your friend to accept."
            : response.incomingInvites?.length ? "You have a Puzzle Battle invitation."
              : "Invite a friend or join random matchmaking.";
      }
      const view = response.match.view;
      if (response.cpuPractice && view.status === "round1") {
        return "Choose your opening pairs. The Easy CPU will pair cards randomly when you submit.";
      }
      if (response.cpuPractice && view.status === "round2") {
        return "Round 1 is complete. Choose your final pairs; the Easy CPU will pair cards randomly.";
      }
      if (view.status === "waiting") return view.ready?.[view.player]
        ? "You are ready; waiting for your opponent."
        : view.readyPrompt ? "Choose Ready when you are prepared."
          : "Review the revealed heroes before the ready check.";
      if (view.status === "countdown") return "The match is starting.";
      if (view.status === "round1") return view.ownSubmitted
        ? "Your Round 1 pairings are locked. Scores remain hidden until both submit."
        : `Choose ${view.requiredPairs} pairs before the shared clock expires.`;
      if (view.status === "round2") return view.ownSubmitted
        ? "Your Round 2 pairings are locked. Waiting for your opponent."
        : `Round 1 is complete. Choose ${view.requiredPairs} final pairs.`;
      if (view.status === "complete") {
        if (view.result?.draw) return "Puzzle Battle ended in a draw.";
        return view.result?.winner === view.player ? "You won the Puzzle Battle." : "Your opponent won the Puzzle Battle.";
      }
      return "Puzzle Battle";
    }

    function setPuzzleBattleResponse(response) {
      if (puzzleBattleShowHistory) response.history = puzzleBattleHistoryCache;
      state = {
        ...(state || {}),
        started: true,
        variant: "puzzle-battle",
        phase: response.status || "idle",
        gameId: response.match?.view?.matchId || "",
        mode: "remote",
        players: [],
        message: "",
        puzzleBattle: response
      };
      activeMode = "remote";
    }

    function setOnlineBattleResponse(response, fallbackVariant = onlineBattleVariant) {
      if (response.match) {
        const view = response.match.view;
        const key = [
          response.match.id, response.match.variant, view.phase, view.actor, view.round,
          view.exchange, view.pokerDuel?.turnNumber, view.rummy?.turnsCompleted,
          view.abandonDuel?.round, view.abandonDuel?.turnNumber
        ].join(":");
        if (onlineBattleStateKey && onlineBattleStateKey !== key) selected.clear();
        onlineBattleStateKey = key;
        onlineBattleVariant = response.match.variant;
        state = {
          ...view, started: true, mode: "online", variant: response.match.variant,
          players: view.players || [], onlineBattle: response
        };
        activeMode = "online";
        return;
      }
      if (onlineBattleStateKey) selected.clear();
      onlineBattleStateKey = "";
      onlineBattleVariant = response.variant || fallbackVariant || "main";
      state = {
        ...(state || {}), started: true, mode: "online", variant: "online-battle-lobby",
        phase: response.status || "idle", onlineBattle: response,
        defaultHeroId: state?.defaultHeroId || ""
      };
      activeMode = "online";
    }

    async function startOnlineBattle(variant, matchMode, heroID, recipient, conductorTuning = {}) {
      if (actionInProgress) return;
      actionInProgress = true;
      showDashboard = false;
      showFeature = false;
      showModeSelection = false;
      onlineBattleVariant = variant || "main";
      render();
      try {
        const request = matchMode === "friend"
          ? { action: "invite", variant: onlineBattleVariant, heroId: heroID, recipient: recipient.trim(), ...conductorTuning }
          : { action: "queue", variant: onlineBattleVariant, matchMode, heroId: heroID, ...conductorTuning };
        let response = await api("/api/online-battle", request);
        if (!response.match) response = await api("/api/online-battle");
        setOnlineBattleResponse(response, onlineBattleVariant);
        navigateGame("battle");
        render();
      } catch (error) {
        showModeSelection = true;
        if (lifecycle.signal.aborted) return;
        render();
        setStatus(connectionError(error), true);
        document.getElementById("modal").querySelector(".modal")?.insertAdjacentHTML(
          "afterbegin", `<p role="alert">${esc(connectionError(error))}</p>`
        );
      } finally {
        actionInProgress = false;
        const modal = document.getElementById("modal");
        if (showModeSelection && modal) updateSetupModal(modal);
        renderActions();
      }
    }

    async function onlineBattleAction(action, payload = {}) {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const match = state?.onlineBattle?.match;
        const matchAction = Boolean(match) && state?.variant !== "online-battle-lobby";
        const path = matchAction
          ? `/api/online-battle/${encodeURIComponent(match.id)}/action`
          : "/api/online-battle";
        let response = await api(path, { action, ...payload });
        if (!matchAction && !response.match) response = await api("/api/online-battle");
        setOnlineBattleResponse(response, onlineBattleVariant);
        render();
      } catch (error) {
        setStatus(connectionError(error), true);
      } finally {
        actionInProgress = false;
        renderActions();
      }
    }

    function syncOnlineBattlePolling() {
      const active = state?.mode === "online" && !showDashboard && !showFeature &&
        !showModeSelection && window.location.hash === "#/battle" &&
        (state.variant === "online-battle-lobby" || state.onlineBattle?.match?.status === "active");
      if (!active) {
        if (onlineBattlePollTimer !== null) window.clearInterval(onlineBattlePollTimer);
        onlineBattlePollTimer = null;
        return;
      }
      if (onlineBattlePollTimer !== null) return;
      onlineBattlePollTimer = window.setInterval(async () => {
        if (onlineBattlePollInProgress || actionInProgress) return;
        onlineBattlePollInProgress = true;
        try {
          const response = await api("/api/online-battle");
          setOnlineBattleResponse(response, onlineBattleVariant);
          render();
        } catch (error) {
          setStatus(`Waiting for online battle update: ${connectionError(error)}`, true);
        } finally {
          onlineBattlePollInProgress = false;
        }
      }, 1000);
    }

    function togglePuzzleBattleCandidate(index) {
      const view = state?.puzzleBattle?.match?.view;
      if (actionInProgress || !view || !["round1", "round2"].includes(view.status) || view.ownSubmitted) return;
      if ((view.ownPairs || []).some(pair =>
        pair.firstIndex === index || pair.secondIndex === index)) return;
      const existingIndex = puzzleBattlePendingPair.indexOf(index);
      if (existingIndex >= 0) {
        puzzleBattlePendingPair.splice(existingIndex, 1);
      } else if (puzzleBattlePendingPair.length < 2) {
        puzzleBattlePendingPair.push(index);
      }
      render();
    }

    async function startPuzzleBattle(matchMode, heroID, recipient) {
      if (actionInProgress) return;
      actionInProgress = true;
      puzzleBattlePendingPair = [];
      puzzleBattlePendingRoundKey = "";
      showDashboard = false;
      showFeature = false;
      showModeSelection = false;
      render();
      try {
        if (matchMode === "easy") {
          const current = await api("/api/puzzle-battle/cpu");
          const response = current.match && current.status !== "complete"
            ? current
            : await api("/api/puzzle-battle/cpu", { action: "start", heroId: heroID });
          puzzleBattleHistoryCache = [];
          puzzleBattleShowHistory = false;
          setPuzzleBattleResponse(response);
          navigateGame("battle");
          render();
          return;
        }
        const current = await api("/api/puzzle-battle");
        if (current.match && current.status !== "complete" ||
            current.status === "queued" && current.matchMode === matchMode && matchMode !== "friend") {
          setPuzzleBattleResponse(current);
          navigateGame("battle");
          render();
          return;
        }
        const request = matchMode === "friend"
          ? { action: "invite", heroId: heroID, recipient: recipient.trim() }
          : { action: "queue", matchMode, heroId: heroID };
        let response = await api("/api/puzzle-battle", request);
        if (!response.match) response = await api("/api/puzzle-battle");
        puzzleBattleHistoryCache = [];
        setPuzzleBattleResponse(response);
        puzzleBattleShowHistory = false;
        navigateGame("battle");
        render();
      } catch (error) {
        showModeSelection = true;
        if (lifecycle.signal.aborted) return;
        render();
        setStatus(connectionError(error), true);
        document.getElementById("modal").querySelector(".modal")?.insertAdjacentHTML(
          "afterbegin", `<p role="alert">${esc(connectionError(error))}</p>`
        );
      } finally {
        actionInProgress = false;
        const modal = document.getElementById("modal");
        if (showModeSelection && modal) updateSetupModal(modal);
        renderActions();
      }
    }

    async function puzzleBattleAction(action, payload = {}) {
      if (action === "toggle-pair") {
        togglePuzzleBattleCandidate(Number(payload.index));
        return;
      }
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const view = state?.puzzleBattle?.match?.view;
        const cpuPractice = Boolean(state?.puzzleBattle?.cpuPractice);
        const matchAction = cpuPractice || ["ready", "submit-pair", "submit"].includes(action);
        const path = cpuPractice
          ? `/api/puzzle-battle/cpu/${encodeURIComponent(view.matchId)}/action`
          : matchAction
            ? `/api/puzzle-battle/${encodeURIComponent(view.matchId)}/action`
            : "/api/puzzle-battle";
        let response = await api(path, { action, ...payload });
        if (!matchAction) response = await api("/api/puzzle-battle");
        if (action === "submit-pair") puzzleBattlePendingPair = [];
        setPuzzleBattleResponse(response);
        render();
      } catch (error) {
        setStatus(connectionError(error), true);
      } finally {
        actionInProgress = false;
        renderActions();
      }
    }

    async function loadPuzzleBattleHistory() {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        const history = await api("/api/puzzle-battle/history");
        puzzleBattleHistoryCache = history.matches || [];
        puzzleBattleShowHistory = true;
        state.puzzleBattle.history = puzzleBattleHistoryCache;
        render();
      } catch (error) {
        setStatus(connectionError(error), true);
      } finally {
        actionInProgress = false;
      }
    }

    function syncPuzzleBattlePolling() {
      const active = state?.variant === "puzzle-battle" && !showDashboard && !showFeature &&
        !showModeSelection && !state.puzzleBattle?.cpuPractice && window.location.hash === "#/battle";
      if (!active) {
        if (puzzleBattlePollTimer !== null) window.clearInterval(puzzleBattlePollTimer);
        puzzleBattlePollTimer = null;
        if (puzzleBattleClockTimer !== null) window.clearInterval(puzzleBattleClockTimer);
        puzzleBattleClockTimer = null;
        puzzleBattleClockKey = "";
        return;
      }
      if (puzzleBattlePollTimer !== null) return;
      puzzleBattlePollTimer = window.setInterval(async () => {
        if (puzzleBattlePollInProgress || actionInProgress) return;
        puzzleBattlePollInProgress = true;
        try {
          const response = await api("/api/puzzle-battle");
          setPuzzleBattleResponse(response);
          render();
        } catch (error) {
          setStatus(`Waiting for Puzzle Battle update: ${connectionError(error)}`, true);
        } finally {
          puzzleBattlePollInProgress = false;
        }
      }, 1000);
    }

    function syncPuzzleBattleClock() {
      const view = state?.variant === "puzzle-battle" ? state.puzzleBattle?.match?.view : null;
      const active = view && !state.puzzleBattle?.cpuPractice &&
        ["countdown", "round1", "round2"].includes(view.status);
      if (!active) {
        if (puzzleBattleClockTimer !== null) window.clearInterval(puzzleBattleClockTimer);
        puzzleBattleClockTimer = null;
        puzzleBattleClockKey = "";
        return;
      }
      const key = `${view.matchId}:${view.status}:${view.deadline || view.countdownEndsAt}`;
      if (key !== puzzleBattleClockKey) {
        puzzleBattleClockKey = key;
        puzzleBattleDeadline = view.status === "countdown"
          ? Date.parse(view.countdownEndsAt)
          : Date.now() + Math.max(0, Number(view.remainingMillis || 0));
      }
      const update = () => {
        const clock = document.getElementById("puzzleBattleClock");
        if (clock) clock.textContent = `${Math.ceil(Math.max(0, puzzleBattleDeadline - Date.now()) / 1000)}s`;
      };
      update();
      if (puzzleBattleClockTimer === null) puzzleBattleClockTimer = window.setInterval(update, 100);
    }

    function render() {
      if (lifecycle.signal.aborted) return;
      document.getElementById('gameLoading').classList.toggle('hidden', initialized);
      if (showFeature) showDashboard = false;
      syncBattleAnimation();
      document.getElementById("dashboardScreen").classList.toggle("hidden", !showDashboard);
      document.getElementById("featureScreen").classList.toggle("hidden", !showFeature);
      document.getElementById("gameShell").classList.toggle("hidden", showDashboard || showFeature);
      document.getElementById("gameBrand").textContent = state?.variant === "fog" ? "Fog of War"
        : state?.variant === "rummy" ? "Rummy"
          : state?.variant === "ladder" ? "Ladder Battle"
            : state?.variant === "tug-war" ? "Tug Of War"
              : state?.variant === "puzzle-battle" ? "Puzzle Battle"
          : ["abandon", "abandon-duel"].includes(state?.variant) ? "Abandon"
            : ["poker", "poker-duel"].includes(state?.variant) ? "Poker" : "Prisoners of War";
      const footer = document.getElementById("dashboardFooter");
      footer.hidden = !showDashboard && !showFeature;
      const activeNav = showDashboard ? "home" : showFeature ? currentFeature : "";
      for (const button of footer.querySelectorAll("[data-nav]")) {
        if (button.dataset.nav === activeNav) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      }
      renderDashboard();
      if (showFeature) renderFeatureScreen();
      let currentStatus = state && state.started
        ? playerMessage(state.message) || (state.variant === "puzzler"
          ? "Choose a card to begin or continue the puzzle."
          : state.variant === "abandon" ? "Select a board card to start a pairing."
          : state.variant === "puzzle-battle" ? puzzleBattleStatusMessage(state.puzzleBattle)
          : state.variant === "online-battle-lobby" ? state.onlineBattle?.status === "queued"
            ? "Searching for an opponent. You can cancel the search or accept a friend invitation."
            : "Invite a friend or find a random opponent for a non-campaign battle."
          : state.variant === "poker-duel" ? "Build three Poker hands, keeping their sizes within one card, before your 15-second turn expires."
          : state.variant === "tug-war" ? "Move the shared piles, spend pushes wisely, and win the top-card clashes."
          : state.variant === "poker" ? "Build three poker hands to meet the mission target."
            : state.variant === "rummy" ? "Build melds and manage your hand."
              : state.variant === "ladder" ? "Play a legal card or pass when none are available." : "")
        : "Choose a game mode to begin.";
      const rankedSeries = state?.variant === "puzzle-battle"
        ? state.puzzleBattle?.match?.view?.rankedSeries
        : state?.rankedSeries;
      if (rankedSeries) currentStatus += ` · ${rankedSeriesDescription(rankedSeries)}`;
      if (state?.phase === "gameover" && state.payout) {
        currentStatus += ` · Rewards: +${formatNumber(state.payout.totalMarks)} Marks, +${formatNumber(state.payout.totalCrowns)} Crowns.`;
      }
      setStatus(currentStatus);
      renderTrack();
      renderMatchInfo();
      renderBattle();
      renderSuitCycle();
      renderPlayers();
      renderActions();
      syncPuzzlerClock();
      scheduleAIDraftPick();
      syncPokerDuelPolling();
      syncLadderPolling();
      syncPokerDuelTimer();
      syncPuzzleBattlePolling();
      syncPuzzleBattleClock();
      syncOnlineBattlePolling();
      renderModal();
      document.getElementById('gameShell').dataset.phase = state?.phase || '';
      document.getElementById('gameShell').dataset.variant = state?.variant || 'main';
      syncModalAccessibility();
      bindPreviewImages();
      if (showFeature && featureData && featureFocusTarget) {
        const target = document.getElementById(featureFocusTarget);
        featureFocusTarget = '';
        if (target) { target.focus({ preventScroll: true }); target.scrollIntoView({ block: 'nearest', behavior: 'instant' }); }
      }
      const title = showDashboard ? 'Home' : showFeature ? document.getElementById('featureTitle').textContent : showModeSelection ? 'Choose match mode' : 'Battle';
      window.document.title = `${title} · Prisoners of War`;
      document.querySelector('#gameShell .board')?.classList.toggle('drafting', state?.phase === 'draft');
    }

    async function startNewGame(mode, variant) {
      if (actionInProgress) return;
      const selectedMode = mode || activeMode || (state && state.mode) || "easy";
      if (["friend", "online", "ranked"].includes(selectedMode)) {
        startOnlineBattle(
          variant || state?.variant || setupVariant || onlineBattleVariant || "main",
          selectedMode,
          document.getElementById("playerHero")?.value || state?.playerHeroId || state?.defaultHeroId || "recruit",
          document.getElementById("puzzleBattleFriendHandle")?.value || "",
          conductorTuningPayload(document.getElementById("matchConductorTuning"))
        );
        return;
      }
      actionInProgress = true;
      try {
        showDashboard = false;
        showFeature = false;
        showModeSelection = false;
        selected.clear();
        const playerHero = document.getElementById("playerHero");
        const gameVariant = variant || state?.variant || setupVariant || "main";
        const body = {
          mode: selectedMode,
          variant: gameVariant,
          playerHeroId: playerHero ? playerHero.value : (state && (state.playerHeroId || state.defaultHeroId)) || "warden",
          ...conductorTuningPayload(document.getElementById("matchConductorTuning")),
          ...(state?.campaign && !mode ? { campaignId: state.campaign.id, missionIndex: state.campaign.index } : {})
        };
        const next = await api("/api/new", body);
        state = next;
        activeMode = state.mode;
        setupVariant = state.variant || gameVariant;
        selected.clear();
        navigateGame('battle');
        render();
      } catch (error) {
        showModeSelection = true;
        if (lifecycle.signal.aborted) return;
        render();
        setStatus(connectionError(error), true);
        document.getElementById('modal').querySelector('.modal')?.insertAdjacentHTML('afterbegin', `<p role="alert">${esc(connectionError(error))}</p>`);
      } finally {
        actionInProgress = false;
        renderActions();
      }
    }

    async function act(action, payload = {}) {
      if (actionInProgress) return;
      const revealAction = state?.variant === "abandon" &&
        action === "abandon-pair-card" && state.phase === "abandon-pair-second"
        ? "abandon-reveal-pair-card"
        : state?.variant === "abandon-duel" &&
          action === "abandon-duel-pair-card" && state.phase === "abandon-duel-pair-second"
          ? "abandon-duel-reveal-pair-card"
          : "";
      const cardIndex = Number(payload.index);
      const secondCard = state?.variant === "abandon"
        ? payload.source === "board" ? state.abandon?.board?.[cardIndex]
          : state.abandon?.personalPile?.[cardIndex]
        : state?.variant === "abandon-duel"
          ? payload.source === "board" ? state.abandonDuel?.board?.[cardIndex]
            : state.abandonDuel?.players?.[state.abandonDuel?.activePlayer]?.personalPile?.[cardIndex]
          : null;
      actionInProgress = true;
      try {
        selected.clear();
        const sendAction = async (nextAction, nextPayload) => {
          if (state?.mode === "online" && state.onlineBattle?.match) {
            const response = await api(
              `/api/online-battle/${encodeURIComponent(state.onlineBattle.match.id)}/action`,
              { action: nextAction, ...nextPayload }
            );
            setOnlineBattleResponse(response, onlineBattleVariant);
          } else {
            state = await api("/api/action", { action: nextAction, ...nextPayload });
          }
          activeMode = state.mode;
        };
        if (revealAction) {
          if (!secondCard?.revealed) {
            await sendAction(revealAction, payload);
            render();
          }
          await new Promise(resolve => window.setTimeout(resolve, 500));
        }
        await sendAction(action, payload);
        render();
      } catch (error) {
        setStatus(connectionError(error), true);
      } finally {
        actionInProgress = false;
        renderActions();
      }
    }

    async function openDashboard() {
      if (shopPreviewChromaID) stopShopPreview();
      if (window.location.hash !== '#/home') { navigateGame('home'); return; }
      const version = ++navigationVersion;
      showDashboard = true;
      showFeature = false;
      currentFeature = "";
      featureData = null;
      showModeSelection = false;
      render();
      try {
        const data = await api("/api/state");
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        state = data;
        setupVariant = state.variant || "main";
        render();
      } catch (error) {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        setStatus(connectionError(error), true);
      }
    }

    async function initialize() {
      document.getElementById('retryInitialization').hidden = true;
      document.getElementById('initializationMessage').textContent = 'Loading commander and saved match…';
      try {
        state = await api("/api/state");
        activeMode = state.mode || "";
        setupVariant = state.variant || "main";
        initialized = true;
        applyGameRoute();
        render();
      } catch (error) {
        if (lifecycle.signal.aborted) return;
        document.getElementById('initializationMessage').textContent = connectionError(error);
        document.getElementById('retryInitialization').hidden = false;
      }
    }

    function modeName(mode) {
      return {
        friend: "Friend PvP", online: "Online PvP", ranked: "Ranked PvP",
        easy: "AI · Easy", normal: "AI · Medium", hard: "AI · Hard"
      }[mode] || "Battle";
    }

    function rankedSeriesDescription(series) {
      const played = Number(series.gamesPlayed || 0);
      const gameNumber = series.complete ? played : Math.min(played + 1, 3);
      const wins = series.wins || [0, 0];
      const scores = series.scores || [0, 0];
      const summary = `Ranked series · Game ${gameNumber} of 3 · Wins ${wins[0]}–${wins[1]} · Total ${scores[0]}–${scores[1]}`;
      if (series.complete && series.draw) return `${summary} · Tied series`;
      if (series.complete) return `${summary} · Player ${Number(series.winner) + 1} wins`;
      return summary;
    }

    function startLabel(mode, variant) {
      return {
        main: `Start ${modeName(mode)} match`,
        fog: `Start Fog of War (${modeName(mode)})`,
        rummy: `Start Rummy (${modeName(mode)})`,
        "abandon-duel": `Start Abandon (${modeName(mode)})`,
        ladder: `Start Ladder (${modeName(mode)})`,
        "tug-war": `Start Tug War (${modeName(mode)})`,
        "poker-duel": `Start Poker (${modeName(mode)})`,
        "puzzle-battle": mode === "easy" ? "Play Easy CPU" : mode === "ranked" ? "Find a ranked opponent" : mode === "friend" ? "Invite friend" : "Find an opponent",
        puzzler: "Start Puzzler",
        abandon: "Start Abandon"
      }[variant] || `Start ${modeName(mode)} match`;
    }

    function playerLabel(player) {
      if (player.you) return 'You';
      return { easy: 'Easy CPU', normal: 'Medium CPU', hard: 'Hard CPU' }[state?.mode] || 'Opponent';
    }

    function playerMessage(message) {
      let text = String(message || '');
      if (state?.variant === "fog") {
        text = text.replace(/^(White|Black) wins this battle and captures the opposing card\.\s*/, "");
      }
      const players = state?.players || [];
      text = text.replace(/^(White|Black) wins this battle and captures the opposing card\./, (original, color) => {
        const winner = players.find(player => player.color === color);
        if (!winner) return original;
        const name = playerLabel(winner);
        return name === 'You' ? 'You win this battle and capture the opposing card.' : `${name} wins this battle and captures the opposing card.`;
      });

      const opponent = state?.players?.find(player => !player.you);
      const opponentName = opponent ? playerLabel(opponent) : 'Opponent';
      return text.replaceAll('Player 1 attacks','You attack').replaceAll('Player 1','You').replaceAll('Player 2', opponentName);
    }

    function scheduleAIDraftPick() {
      const isAIDraftTurn = state?.phase === 'draft' && state.mode !== 'online' && state.actor !== 0;
      if (!isAIDraftTurn) {
        if (aiDraftTimer !== null) window.clearTimeout(aiDraftTimer);
        aiDraftTimer = null;
        aiDraftPendingKey = '';
        return;
      }
      const key = `${state.gameId}:${state.draftPickNumber}:${state.actor}`;
      if (aiDraftPendingKey === key) return;
      if (aiDraftTimer !== null) window.clearTimeout(aiDraftTimer);
      aiDraftPendingKey = key;
      aiDraftTimer = window.setTimeout(() => {
        aiDraftTimer = null;
        if (state?.phase !== 'draft' || state.actor === 0 ||
            `${state.gameId}:${state.draftPickNumber}:${state.actor}` !== key) {
          aiDraftPendingKey = '';
          return;
        }
        aiDraftPendingKey = '';
        act('draft-ai-pick');
      }, 1500);
    }

    function modeDescription(mode, variant = "main") {
      const opponent = mode === "friend" ? "a friend"
        : mode === "ranked" ? "a ranked opponent in a best-of-three series"
          : mode === "online" ? "a randomly matched opponent"
            : ({ easy: "an Easy CPU", normal: "a Medium CPU", hard: "a Hard CPU" }[mode] || "a CPU");
      if (variant === "fog") return ["friend", "online", "ranked"].includes(mode)
        ? `Fog of War online PvP: play ${opponent}.`
        : "Fog of War: hidden opponents show only a face-value range. Choose an AI difficulty or connect online.";
      if (variant === "rummy") return "Rummy: deal 6 cards plus the heroes’ Draft modifier. Player 1 opens by drawing two and discarding one face-up and one to the bottom of the deck. Then each player takes six turns, drawing from the face-up pile or drawing two and discarding two. Score the best sets and same-suit runs; deadwood subtracts points.";
      if (variant === "ladder") return `Ladder: race to empty your hand by playing a legal card on the current chain. Play against ${opponent}.`;
      if (variant === "tug-war") return `Tug War: move three piles toward your side, scoring the cards in piles you own. Play against ${opponent}.`;
      if (variant === "abandon-duel") return `Abandon: play two six-pair rounds with shared hero modifiers and reversed starting seats. Play against ${opponent}.`;
      if (variant === "poker-duel") return `Poker is a standalone randomly seeded mirror match against ${opponent}. Each player gets six cards, must keep hand sizes within one card of each other, and banks unused turn time. Campaign progress is unaffected.`;
      if (variant === "puzzle-battle" && mode === "easy") return "";
      if (variant === "puzzle-battle") return `Puzzler is a remote head-to-head mode. Play against ${opponent}.`;
      if (variant === "puzzler") return "Solve a selected card challenge. This is a solo game.";
      if (variant === "abandon") return "Choose board cards, pair them with another board card or draw from the deck. This is a solo game.";
      return { easy: 'Recommended for learning. The AI makes random legal choices.', normal: 'The AI plans commitments and chooses strong defenses.', hard: 'The AI plans against sampled possibilities for unseen cards.', friend: "Challenge a friend using their handle.", online: "Join casual online matchmaking.", ranked: "Compete in a best-of-three ranked series. A tied series after three games awards both players the win payout." }[mode] || '';
    }

    function navigateGame(route) {
      if (window.location.hash === `#/${route}`) applyGameRoute();
      else window.location.hash = `/${route}`;
    }

    function chooseMatchMode() { navigateGame('match/new'); }

    function applyGameRoute() {
      if (!initialized || lifecycle.signal.aborted) return;
      const route = window.location.hash.replace(/^#\//, '') || 'home';
      if (shopPreviewChromaID && route !== "shop" && route !== `shop/${currentShopTab}`) {
        stopShopPreview();
      }
      const notice = document.getElementById('routeNotice');
      if (notice && route !== 'home') notice.hidden = true;
      if (['saved-games', 'password', 'admin', 'cards'].includes(route)) return;
      if (route === 'home') { openDashboard(); return; }
      if (route === 'battle' || route === 'match/new') {
        navigationVersion++;
        showDashboard = false;
        showFeature = false;
        showNewGameConfirmation = false;
        showModeSelection = route === 'match/new' || !state?.started;
        render();
        return;
      }
      const [feature, tab, node] = route.split('/');
      if (feature === 'skills' && node) featureFocusTarget = `skill-node-${node}`;
      if (['shop', 'skills', 'profile', 'heroes', 'campaigns', 'camp-draw', 'achievements', 'history', 'social'].includes(feature)) {
        if (showFeature && currentFeature === feature && featureData) {
          if (feature === 'shop') currentShopTab = tab || 'skins';
          if (feature === 'skills') currentSkillBranch = tab || 'battle-rewards';
          render();
        } else {
          openFeature(feature);
          if (feature === 'shop' && ['skins', 'heroes', 'boxes'].includes(tab)) currentShopTab = tab;
          if (feature === 'skills' && skillTreeBranches.some(branch => branch.id === tab)) currentSkillBranch = tab;
        }
      } else {
        const notice = document.getElementById('routeNotice');
        if (notice) {
          notice.textContent = `There is no “${route}” page, so you’re on Home instead.`;
          notice.hidden = false;
        }
        navigateGame('home');
      }
    }

    function heroDetails(hero, includeFlavor = true) {
      if (!hero) return '<p>Choose a hero to inspect their abilities.</p>';
      const draft = hero.draftFlip ? "negates the opponent’s Draft modifier" : formatModifier(hero.draft || 0);
      return `${includeFlavor ? `<p>${esc(hero.flavor || '')}</p>` : ""}<p><strong>${esc(hero.name)}:</strong> Bounty ${formatModifier(hero.bounty || 0)} · Shift ${formatModifier(hero.shift || 0)} · Favored ${formatModifier(hero.favored || 0)} · Draft ${draft}${hero.flip ? ' · Flips the opponent’s Bounty contribution' : ''}</p>`;
    }

    function conductorTuningMarkup(level, id) {
      if (!level) return "";
      const options = [["", "No adjustment"]];
      for (const modifier of ["bounty", "shift", "favored"]) {
        for (const amount of [-level, -1, 1, level]) {
          if (!amount || Math.abs(amount) > level || options.some(([value]) => value === `${modifier}:${amount}`)) continue;
          options.push([`${modifier}:${amount}`, `${modifier[0].toUpperCase()}${modifier.slice(1)} ${formatModifier(amount)}`]);
        }
      }
      return `<label class="hero-select">Conductor tuning<select id="${esc(id)}" data-conductor-tuning>
        ${options.map(([value, label]) => `<option value="${esc(value)}">${esc(label)}</option>`).join("")}
      </select></label>`;
    }

    function conductorTuningPayload(select) {
      const [conductorModifier, amount] = (select?.value || "").split(":");
      return conductorModifier ? {conductorModifier, conductorAmount: Number(amount)} : {};
    }

    function affordability(cost, balance, currency) {
      return balance < cost ? `<p class="affordability">Need ${formatNumber(cost - balance)} more ${esc(currency)}.</p>` : '';
    }

    function friendlyRequirement(reason, names) {
      let text = reason || 'Complete its prerequisite or earn more currency.';
      for (const id of Object.keys(names).sort((a,b) => b.length-a.length)) text = text.replaceAll(id, names[id]);
      return text.replaceAll('Skill Tree Points', 'Skill Points');
    }

    function boxDescription(type) {
      return {
        wooden: 'A basic reward box with currency or chroma rewards. Duplicate chromas convert to Marks.',
        silver: 'A higher-tier reward table with currency or chroma rewards. Duplicate chromas convert to Marks.',
        gold: 'A premium reward table with currency or chroma rewards. Duplicate chromas convert to Marks.',
        hero: 'Unlocks a hero. Duplicate heroes convert to Crowns, with the amount depending on the duplicate tier.'
      }[type] || 'Open to add its reward to your collection.';
    }

    function chromaAppearance(chroma) {
      const rawColor = String(chroma?.color || "").trim();
      if (!rawColor) return null;
      const named = rawColor.split(/[\s_-]+/).filter(Boolean).map(part => part[0].toUpperCase() + part.slice(1)).join(' ');
      const color = named.toLowerCase() === 'lime' ? 'Lime Green'
        : named.toLowerCase() === 'skyblue' ? 'Sky Blue' : named;
      return {
        color,
        skin: chroma?.skin || skinFolders[color],
        hexColor: chroma?.hexColor || '',
        filter: ''
      };
    }

    function suitColorValue(suit) {
      const equipped = equippedChroma(suit);
      const appearance = equipped ? chromaAppearance(equipped) : null;
      return appearance?.hexColor || colorVars[appearance?.color || suitColors[suit]] || "var(--paper)";
    }

    function equippedChroma(suit) { return state?.dashboard?.equippedChromas?.[['B','F','S'][suit]]; }

    async function saveSuitAppearance(body) {
      try {
        const data = await api('/api/shop',body);
        state.dashboard = data.dashboard;
        openSuitMenu = null;
        openPuzzleSuitMenu = -1;
        render();
        const index = ['B','F','S'].indexOf(body.suit);
        const dockChooser = document.getElementById("gameplaySuitChooser");
        const cycle = dockChooser && !dockChooser.hidden ? "#dockSuitCycle"
          : state?.variant === "puzzler" ? "#puzzleSuitCycle" : "#suitCycle";
        const target = index >= 0
          ? `${cycle} [data-suit-trigger="${index}"]`
          : `${cycle} [data-rotate-colors]`;
        document.querySelector(target)?.focus({preventScroll:true});
      } catch (error) { setStatus(connectionError(error),true); }
    }

    function chromaPreview(chroma) {
      if (!chroma) return '';
      const look = chromaAppearance(chroma);
      return `<span class="chroma-preview-frame" data-preview-id="${esc(chroma.id)}"><span class="preview-placeholder" aria-hidden="true">Loading preview…</span><img class="chroma-preview" src="${import.meta.env.BASE_URL}skins/${look.skin || skinFolders[look.color]}/large_idle.png?thumb=160" style="filter:${look.filter || 'none'}" alt="${esc(chroma.name)} card artwork preview" loading="lazy" width="160" height="210"></span>`;
    }

    function stopShopPreview() {
      window.clearInterval(shopPreviewTimer);
      shopPreviewTimer = null;
      shopPreviewChromaID = "";
    }

    function openShopPreview(chromaID) {
      const item = (featureData?.chromas || []).find(entry => entry.chroma.id === chromaID);
      if (!item) return;
      shopPreviewChromaID = chromaID;
      shopPreviewPoseIndex = 0;
      window.clearInterval(shopPreviewTimer);
      shopPreviewTimer = window.setInterval(() => {
        shopPreviewPoseIndex = (shopPreviewPoseIndex + 1) % 4;
        updateShopPreviewImages();
      }, 1000);
      renderModal();
      syncModalAccessibility();
    }

    function changeShopPreviewChroma(chromaID) {
      const current = (featureData?.chromas || []).find(entry => entry.chroma.id === shopPreviewChromaID);
      const next = (featureData?.chromas || []).find(entry => entry.chroma.id === chromaID);
      if (!current || !next || chromaFamilyKey(current.chroma) !== chromaFamilyKey(next.chroma)) return;
      shopPreviewChromaID = chromaID;
      shopPreviewPoseIndex = 0;
      renderModal();
      syncModalAccessibility();
    }

    function renderShopPreviewModal(modal) {
      const item = (featureData?.chromas || []).find(entry => entry.chroma.id === shopPreviewChromaID);
      if (!item) {
        stopShopPreview();
        return false;
      }
      const chroma = item.chroma;
      const familyKey = chromaFamilyKey(chroma);
      const familyName = chromaFamilyName(chroma);
      const variants = shopFamilyItems(featureData, familyKey);
      const currency = chromaCurrencyName(chroma);
      const canBuy = !item.owned && chroma.currency !== "event" && canAffordChroma(featureData, chroma);
      const buyAllQuote = familyBuyAllQuote(featureData, familyKey);
      const canBuyAll = buyAllQuote && canAffordCurrency(featureData.dashboard, buyAllQuote.cost, buyAllQuote.currency);
      const purchaseLabel = item.owned ? "Already owned"
        : chroma.currency === "event" ? "Not for sale"
          : `Buy · ${formatNumber(chroma.cost)} ${currency}`;
      modal.classList.remove("hidden");
      modal.innerHTML = `<section class="modal skin-preview-modal" role="dialog" aria-modal="true" aria-labelledby="shopPreviewTitle">
        <h2 id="shopPreviewTitle">${esc(familyName)}</h2>
        <div class="skin-preview-controls">
          <label>Chroma color<select id="shopPreviewColor" data-initial-focus>
            ${variants.map(entry => `<option value="${esc(entry.chroma.id)}"${entry.chroma.id === chroma.id ? " selected" : ""}>${esc(chromaVariantLabel(entry, variants))}</option>`).join("")}
          </select></label>
          <button type="button" class="action primary" id="shopPreviewBuy"${canBuy ? "" : " disabled"}>${esc(purchaseLabel)}</button>
          ${buyAllQuote ? `<button type="button" class="action secondary" id="shopPreviewBuyAll" data-family="${esc(familyKey)}"${canBuyAll ? "" : " disabled"}>Buy all · 20% off (${formatNumber(buyAllQuote.cost)} ${currencyDisplayName(buyAllQuote.currency)})</button>` : ""}
        </div>
        <div class="skin-preview-gallery" aria-label="Skin artwork preview">
          ${[["Small", "small"], ["Medium", "med"], ["Large", "large"]].map(([label, size]) => `<article class="skin-preview-card">
            <h3>${label}</h3><div class="skin-preview-frame"><img data-shop-preview-size="${size}" alt="" aria-hidden="true"></div>
          </article>`).join("")}
        </div>
        ${featureError ? `<p class="payout-error" role="alert">${esc(featureError)}</p>` : ""}
        <div class="skin-preview-actions"><button type="button" class="action secondary" id="shopPreviewBack">Back to Shop</button></div>
      </section>`;
      modal.querySelector("#shopPreviewColor").addEventListener("change", event =>
        changeShopPreviewChroma(event.target.value));
      modal.querySelector("#shopPreviewBuy").addEventListener("click", () => purchaseChroma(chroma.id));
      modal.querySelector("#shopPreviewBuyAll")?.addEventListener("click", () => purchaseChromaFamily(familyKey));
      modal.querySelector("#shopPreviewBack").addEventListener("click", closeShopPreview);
      updateShopPreviewImages();
      return true;
    }

    function updateShopPreviewImages() {
      const item = (featureData?.chromas || []).find(entry => entry.chroma.id === shopPreviewChromaID);
      if (!item) return;
      const look = chromaAppearance(item.chroma);
      const pose = ["idle", "attack", "win", "lose"][shopPreviewPoseIndex];
      for (const image of document.querySelectorAll("#modal [data-shop-preview-size]")) {
        const size = image.dataset.shopPreviewSize;
        image.src = `${import.meta.env.BASE_URL}skins/${look.skin || skinFolders[look.color]}/${size}_${pose}.png?v=3`;
        image.style.filter = look.filter || "none";
        image.alt = `${chromaFamilyName(item.chroma)} ${chromaColorName(item.chroma)} ${size} ${pose} artwork`;
      }
    }

    function closeShopPreview() {
      stopShopPreview();
      renderModal();
      syncModalAccessibility();
    }

    async function purchaseChroma(chromaID) {
      if (featureActionInProgress) return;
      const item = (featureData?.chromas || []).find(entry => entry.chroma.id === chromaID);
      if (!item || item.owned || item.chroma.currency === "event" || !canAffordChroma(featureData, item.chroma)) return;
      const chroma = item.chroma;
      const confirmation = `Are you sure you want to spend ${formatNumber(chroma.cost)} ${chromaCurrencyName(chroma)} for ${chromaFamilyName(chroma)} ${chromaColorName(chroma)}?`;
      featureActionInProgress = true;
      const version = navigationVersion;
      try {
        if (!await confirmAction(confirmation, "This skin purchase is permanent.", "Yes")) return;
        const data = await api("/api/shop", { action: "buy-chroma", id: chromaID });
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureData = data;
        if (featureData.dashboard) state.dashboard = featureData.dashboard;
        stopShopPreview();
        featureError = "";
        render();
      } catch (error) {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureError = connectionError(error);
        render();
      } finally {
        featureActionInProgress = false;
      }
    }

    async function purchaseChromaFamily(familyKey) {
      if (featureActionInProgress) return;
      const quote = familyBuyAllQuote(featureData, familyKey);
      if (!quote || !canAffordCurrency(featureData.dashboard, quote.cost, quote.currency)) return;
      const firstItem = shopFamilyItems(featureData, familyKey)[0];
      if (!firstItem) return;
      const familyName = chromaFamilyName(firstItem.chroma);
      const currency = currencyDisplayName(quote.currency);
      const confirmation = `Are you sure you want to spend ${formatNumber(quote.cost)} ${currency} for all ${familyName} colors at 20% off?`;
      featureActionInProgress = true;
      const version = navigationVersion;
      try {
        if (!await confirmAction(confirmation, "This skin purchase is permanent.", "Yes")) return;
        const data = await api("/api/shop", { action: "buy-chroma-family", id: familyKey });
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureData = data;
        if (featureData.dashboard) state.dashboard = featureData.dashboard;
        stopShopPreview();
        featureError = "";
        render();
      } catch (error) {
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        featureError = connectionError(error);
        render();
      } finally {
        featureActionInProgress = false;
      }
    }

    function bindPreviewImages() {
      for (const img of document.querySelectorAll('img.chroma-preview')) {
        const ready = () => img.parentElement?.classList.add('preview-loaded');
        const failed = () => { const label = img.parentElement?.querySelector('.preview-placeholder'); if (label) label.textContent = 'Preview unavailable'; };
        img.onload = ready;
        img.onerror = failed;
        if (img.complete && img.naturalWidth) ready();
      }
    }

    function confirmAction(title, description, acceptLabel = "Confirm") {
      return new Promise(resolve => { pendingConfirmation = {title, description, acceptLabel, resolve}; renderModal(); syncModalAccessibility(); });
    }

    function tokenName(kind) {
      return ({restart: "Restart Mission", undo: "Undo Last Move", replace: "Replace Any Card", skip: "Campaign Skip"})[kind] || "token";
    }

    function tokenQuickBuyOffers(kind) {
      const offers = {
        restart: [
          {id: "restart-one", name: "1 token", cost: 20},
          {id: "restart-six", name: "Pack of 6", cost: 100}

        undo: [
          {id: "undo-one", name: "1 token", cost: 12},

        replace: [
          {id: "replace-card-one", name: "1 token", cost: 9},

    function openTokenBuyDialog(kind) {

      renderModal();
      syncModalAccessibility();

    function closeTokenDialog() {
      pendingTokenDialog = null;
      renderModal();
      syncModalAccessibility();

    function settleConfirmation(accepted) {
      const pending = pendingConfirmation;
      pendingConfirmation = null;
      renderModal();
      syncModalAccessibility();

    async function startMission(campaignId, missionIndex) {
      if (actionInProgress) return;
      if (state?.started && state.phase !== 'gameover' && !await confirmAction('Start campaign mission?', 'Your unfinished match will be archived. You can still review its saved history.')) return;
      actionInProgress = true;
      const version = navigationVersion;
      try {
        const hero = document.querySelector(`[data-mission-hero="${campaignId}-${missionIndex}"]`);
        const conductor = document.getElementById(`missionConductor-${campaignId}-${missionIndex}`);
        const data = await api('/api/new', {
          campaignId, missionIndex, playerHeroId: hero?.value,
          ...conductorTuningPayload(conductor)
        });
        if (version !== navigationVersion || lifecycle.signal.aborted) return;
        state = data;
        activeMode = state.mode;
        setupVariant = state.variant || "main";
        selected.clear();
        navigateGame('battle');
      } catch (error) {
        featureError = connectionError(error);
        render();
      } finally { actionInProgress = false; renderActions(); }
    }

    function scoreBreakdownMarkup() {
      if (!state?.started || !state?.scores || !state.players) return '';
      return `<details class="score-details"><summary>Score by suit</summary>${state.players.map((player, index) => {
        const score = state.scores[index];
        return `<h3>${esc(player.you ? 'You' : 'Opponent')} · ${score.Total} points</h3><ul>${suits.map((suit, s) => `<li>${suit}: ${score.BySuit[s]} points · ${score.WeightedCount[s]} weighted prisoners</li>`).join('')}</ul>`;
      }).join('')}<p>Each suit = weighted prisoner count × highest scoring face. Round weights: ${state.modifiers.reckoning.join(' / ')}. Shift ${formatModifier(state.modifiers.shift)}; ${suits[state.bounty.suit]} bounty ${formatModifier(state.modifiers.bounty)}.</p></details>`;
    }

    function syncModalAccessibility() {
      const backdrop = document.getElementById('modal');
      const dialog = backdrop.querySelector('.modal');
      const open = !backdrop.classList.contains('hidden') && Boolean(dialog);
      for (const id of ['dashboardScreen', 'featureScreen', 'gameShell', 'dashboardFooter']) document.getElementById(id).inert = open;
      const account = window.document.querySelector('.account-bar');
      if (account) account.inert = open;
      if (!open) {
        if (modalKey) modalReturnFocus?.focus({ preventScroll: true });
        modalKey = '';
        return;
      }
      dialog.setAttribute('role', 'dialog');
      dialog.setAttribute('aria-modal', 'true');
      dialog.setAttribute('aria-labelledby', 'activeModalTitle');
      dialog.tabIndex = -1;
      const heading = dialog.querySelector('h2');
      heading.id = 'activeModalTitle';
      const key = heading.textContent;
      if (key !== modalKey || !dialog.contains(window.document.activeElement)) {
        if (!modalKey) modalReturnFocus = window.document.activeElement;
        modalKey = key;
        (dialog.querySelector('[data-initial-focus]:not(:disabled)') || dialog.querySelector('button:not(:disabled), select, a[href]') || dialog).focus({ preventScroll: true });
      }
    }

    function handleModalKeyboard(event) {
      const dialog = document.getElementById('modal').querySelector('[role="dialog"]');
      if (!dialog) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        if (pendingTokenDialog) { closeTokenDialog(); return; }
        if (pendingConfirmation) { settleConfirmation(false); return; }
        if (shopPreviewChromaID) { closeShopPreview(); return; }
        if (state?.phase === 'handoff') return;
        if (showNewGameConfirmation) { showNewGameConfirmation = false; render(); }
        else navigateGame(state?.started && state.phase !== 'gameover' ? 'battle' : 'home');
      }
      if (event.key !== 'Tab') return;
      const controls = [...dialog.querySelectorAll('button:not(:disabled),select,a[href],input')];
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && window.document.activeElement === first) { event.preventDefault(); last?.focus(); }
      else if (!event.shiftKey && window.document.activeElement === last) { event.preventDefault(); first?.focus(); }
    }

    function disposeGame() {
      lifecycle.abort();
      if (pendingConfirmation) { pendingConfirmation.resolve(false); pendingConfirmation = null; }
      pendingTokenDialog = null;
      window.clearTimeout(battleAnimationTimer);
      window.clearInterval(shopPreviewTimer);
      const account = window.document.querySelector('.account-bar');
      if (account) account.inert = false;
    }

    document.getElementById("dashboardPlay").addEventListener("click", () => {
      navigateGame(state?.started && state.phase !== 'gameover' ? 'battle' : 'match/new');
    });

    document.getElementById("dashboardCampDraw").addEventListener("click", () => navigateGame("camp-draw"));
    document.getElementById("dashboardAchievements").addEventListener("click", () => navigateGame("achievements"));
    document.getElementById("dashboardShop").addEventListener("click", () => navigateGame("shop"));
    document.getElementById("dashboardCampaigns").addEventListener("click", () => navigateGame("campaigns"));
    document.getElementById("dashboardHistory").addEventListener("click", () => navigateGame("history"));
    document.getElementById("dashboardSkills").addEventListener("click", () => navigateGame("skills"));
    document.getElementById("dashboardNavHome").addEventListener("click", () => navigateGame('home'));
    document.getElementById("dashboardNavShop").addEventListener("click", () => navigateGame("shop"));
    document.getElementById("dashboardNavBattle").addEventListener("click", () =>
      document.getElementById("dashboardPlay").click());
    document.getElementById("dashboardNavHeroes").addEventListener("click", () => navigateGame("heroes"));
    document.getElementById("dashboardNavSocial").addEventListener("click", () => navigateGame("social"));
    document.getElementById("featureBack").addEventListener("click", () => navigateGame('home'));
    document.getElementById("featureTabs").addEventListener("click", handleFeatureClick);
    document.getElementById('featureTabs').addEventListener('keydown', event => {
      const tabs = [...event.currentTarget.querySelectorAll('[role="tab"]')];
      const index = tabs.indexOf(event.target);
      if (index < 0 || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      event.preventDefault();
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].click();
    });
    document.getElementById("featureContent").addEventListener("click", handleFeatureClick);
    document.getElementById('featureContent').addEventListener('change', event => {
      const id = event.target.id;
      if (id === 'achievementFilter') achievementFilter = event.target.value;
      else if (id === 'achievementCategory') achievementCategory = event.target.value;
      else return;
      renderFeatureScreen();
      document.getElementById(id)?.focus({preventScroll:true});
    });

    document.getElementById('dashboardChooseMode').addEventListener('click', chooseMatchMode);
    document.getElementById('retryInitialization').addEventListener('click', initialize);
    document.getElementById('resetPreview').addEventListener('click', async event => {
      event.stopPropagation();
      try { await api('/api/preview/reset', {}); window.location.reload(); }
      catch (error) { setStatus(connectionError(error), true); }
    }, { signal: lifecycle.signal });
    window.addEventListener('hashchange', applyGameRoute, { signal: lifecycle.signal });
    document.addEventListener('keydown', handleModalKeyboard);
    initialize();
  </script>
</body>
</html>
