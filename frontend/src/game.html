    function renderCommanderFeature(page) {
      const winRate = page.totalGames > 0
        ? `${Math.round(page.totalWins * 100 / page.totalGames)}%`
        : "—";
      const created = page.createdAt
        ? new Date(page.createdAt).toLocaleDateString()
        : "Unknown";
      const rows = [
        ["Matches", page.totalGames],
        ["Wins", page.totalWins],
        ["Losses", page.totalLosses],
        ["Draws", page.totalDraws],
        ["Win Rate", winRate],
        ["Current Streak", page.currentStreak],
        ["Best Streak", page.bestStreak],
        ["Clashes", page.totalClashes],
        ["Match Ties", page.matchTies],
        ["Seat X Wins", page.winsAsSeatX],
        ["Seat Y Wins", page.winsAsSeatY],
        ["Commander Since", created]
      ];
      return `<section class="feature-section"><h2>Player Record</h2>
        <p>Commander ID: ${esc(page.playerId || "Unavailable")}</p>
        <div class="feature-list">${rows.map(([label, value]) => `<article class="feature-item">
          <h3>${esc(label)}</h3><p>${esc(typeof value === "number" ? formatNumber(value) : value)}</p>
        </article>`).join("")}</div>
      </section>`;

    function renderCampaignsFeature(page) {
      const campaigns = (page.campaigns || []).map(campaign => {
        const percent = campaign.totalMissions > 0
          ? Math.round(campaign.missionsCompleted * 100 / campaign.totalMissions)
          : 0;
        const status = campaign.completed ? "Complete"
          : !campaign.unlocked ? "Locked"
            : campaign.started ? "In progress" : "Available";
        const missions = (campaign.missions || []).map(mission => `<article class="feature-item">
          <h3>${mission.completed ? "✓ " : ""}${esc(mission.index)}. ${esc(mission.name)}</h3>
          <p>${esc(mission.description)}</p>
          <p>${mission.completed ? "Completed" : "Not completed"} · Reward: ${formatNumber(mission.rewardMarks)} Marks</p>
        </article>`).join("");
        return `<article class="feature-item">
          <h3>${esc(campaign.name)} · ${esc(status)}</h3>
          <p>${esc(campaign.description)}</p>
          ${campaign.requires ? `<p>Requires campaign: ${esc(campaign.requires)}</p>` : ""}
          <p>${formatNumber(campaign.missionsCompleted)} / ${formatNumber(campaign.totalMissions)} missions</p>
          <div class="feature-progress"><span style="width:${percent}%"></span></div>
          <div class="feature-list">${missions}</div>

    function renderHistoryFeature(page) {
      const matches = (page.matches || []).map(item => {
        const record = item.record;
        const result = record.player_score === record.opp_score
          ? "Draw" : record.won ? "Victory" : "Defeat";
        const date = record.at ? new Date(record.at).toLocaleString() : "Date unavailable";
        return `<article class="feature-item">
          <h3>${esc(result)} · ${esc(item.modeName)}</h3>
          <p>${esc(date)} · Score ${esc(record.player_score)}–${esc(record.opp_score)}</p>
          <p>${esc(record.player_prisoners)} prisoners · ${esc(record.clashes)} clashes · ${formatNumber(record.marks_earned)} Marks earned</p>
          <p>Bounty suit: ${esc(record.bounty_suit || "Unknown")}</p>
        </article>`;
      }).join("");
      return `<section class="feature-section"><h2>Match Record</h2>
        <div class="feature-list">
          <article class="feature-item"><h3>Matches</h3><p>${formatNumber(page.totalGames)}</p></article>
          <article class="feature-item"><h3>Wins / Losses / Draws</h3>
            <p>${formatNumber(page.totalWins)} / ${formatNumber(page.totalLosses)} / ${formatNumber(page.totalDraws)}</p></article>
        </div>
      </section>
      <section class="feature-section"><h2>Recent Matches</h2>
        ${matches ? `<div class="feature-list">${matches}</div>` : "<p>No matches have been recorded yet.</p>"}
      </section>`;

    async function handleFeatureClick(event) {
      const shopTab = event.target.closest("[data-shop-tab]");
      if (shopTab) {
        currentShopTab = shopTab.dataset.shopTab;
        render();
        return;
      }
      const skillTab = event.target.closest("[data-skill-branch]");
      if (skillTab) {
        currentSkillBranch = skillTab.dataset.skillBranch;
        render();
        return;
      }
      const button = event.target.closest("[data-feature-action]");
      if (!button || button.disabled || featureActionInProgress) return;
      const action = button.dataset.featureAction;
      let path;
      let body;
      switch (action) {
        case "start-draw":
          path = "/api/camp-draw";
          body = { action: "start-draw" };
          break;
        case "play-camp-card":
          path = "/api/camp-draw";
          body = { action: "play-card", index: Number(button.dataset.index) };
          break;
        case "open-box":
          path = "/api/camp-draw";
          body = { action: "open-box", boxType: button.dataset.boxType };
          break;
        case "buy-chroma":
        case "buy-bundle":
        case "buy-hero":
        case "buy-box":
          if (!window.confirm(`Confirm ${button.textContent.trim()}?`)) return;
          path = "/api/shop";
          body = { action, id: button.dataset.id, boxType: button.dataset.boxType };
          break;
        case "open-hero-box":
          if (!window.confirm(`Confirm ${button.textContent.trim()}?`)) return;
          path = "/api/shop";
          body = { action, boxType: button.dataset.boxType };
          break;
        case "redeem-pick":
          path = "/api/shop";
          body = { action, id: document.getElementById("chromaPickChoice").value };
          break;
        case "select-hero":
          path = "/api/heroes";
          body = { action: "select", id: button.dataset.id };
          break;
        case "unlock-skill":
          path = "/api/skills";
          body = { action: "unlock", id: button.dataset.id, payment: button.dataset.payment };
          break;
        default:
          return;
      }
      featureError = "";
      featureActionInProgress = true;
      button.disabled = true;
      try {
        featureData = await api(path, body);
        if (action === "open-box") {
          const result = featureData.boxResult || {};
          const reward = result.chroma_id
            ? `${result.chroma_rarity || ""} ${result.chroma_id} chroma`
            : result.marks ? `${formatNumber(result.marks)} Marks`
              : result.crowns ? `${formatNumber(result.crowns)} Crowns` : "No listed reward";
          const boxName = result.box_type || button.dataset.boxType;
          const message = `Opened ${boxName} box: ${reward}.`;
          featureData = await api("/api/shop");
          featureData.message = message;
        }
        if (featureData.dashboard) state.dashboard = featureData.dashboard;
        if (currentFeature === "heroes" && featureData.defaultId) {
          state.defaultHeroId = featureData.defaultId;
        }
        render();
      } catch (error) {
        featureError = connectionError(error);
        render();
      } finally {
        featureActionInProgress = false;
      }
    }

    function render() {
      syncBattleAnimation();
      document.getElementById("dashboardScreen").classList.toggle("hidden", !showDashboard);
      document.getElementById("featureScreen").classList.toggle("hidden", !showFeature);
      document.getElementById("gameShell").classList.toggle("hidden", showDashboard || showFeature);
      const footer = document.getElementById("dashboardFooter");
      footer.hidden = !showDashboard && !showFeature;
      const activeNav = showDashboard ? "home" : showFeature ? currentFeature : "";
      for (const button of footer.querySelectorAll("[data-nav]")) {
        if (button.dataset.nav === activeNav) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      }
      renderDashboard();
      if (showFeature) renderFeatureScreen();
      document.getElementById("roundLabel").textContent = state && state.started
        ? `Round ${state.round} · Battle ${Math.min(state.exchange, 3)} of 3`
        : "Card battle";
      setStatus(state && state.started ? state.message : "Choose a game mode to begin.");
      renderTrack();
      renderMatchInfo();
      renderBattle();
      renderSuitCycle();
      renderPlayers();
      renderActions();
      renderModal();
    }

    async function startNewGame(mode) {
      try {
        showDashboard = false;
        showModeSelection = false;
        selected.clear();
        const playerHero = document.getElementById("playerHero");
        const opponentHero = document.getElementById("opponentHero");
        const body = {
          mode: mode || activeMode || (state && state.mode) || "hvh",
          playerHeroId: playerHero ? playerHero.value : (state && (state.playerHeroId || state.defaultHeroId)) || "warden",
          opponentHeroId: opponentHero ? opponentHero.value : (state && state.opponentHeroId) || ""
        };
        state = await api("/api/new", body);
        activeMode = state.mode;
        selected.clear();
        render();
      } catch (error) {
        setStatus(connectionError(error), true);
      }
    }

    async function act(action, payload = {}) {
      if (actionInProgress) return;
      actionInProgress = true;
      try {
        selected.clear();
        state = await api("/api/action", { action, ...payload });
        activeMode = state.mode;
        render();
      } catch (error) {
        if (action === "seat") {
          const previousPhase = state && state.phase;
          const previousActor = state && state.actor;
          try {
            state = await api("/api/state");
            activeMode = state.mode || "";
            selected.clear();
            render();
            if (!state.started || state.phase !== previousPhase || state.actor !== previousActor) {
              setStatus(state.started ? `Game state updated. ${state.message}` : "The game is no longer active.");
              return;
            }
          } catch (refreshError) {
            setStatus(`${connectionError(error)}; failed to refresh the game state: ${connectionError(refreshError)}`, true);
            return;
          }
        }
        setStatus(connectionError(error), true);
      } finally {
        actionInProgress = false;
      }
    }

    async function openDashboard() {
      showDashboard = true;
      showFeature = false;
      currentFeature = "";
      featureData = null;
      showModeSelection = false;
      render();
      try {
        state = await api("/api/state");
        render();
      } catch (error) {
        setStatus(connectionError(error), true);
      }
    }

    async function initialize() {
      try {
        state = await api("/api/state");
        activeMode = state.mode || "";
        showDashboard = !state.started || state.phase === "gameover";
        render();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    document.getElementById("dashboardPlay").addEventListener("click", () => {
      showDashboard = false;
      showFeature = false;
      showModeSelection = !state || !state.started || state.phase === "gameover";
      render();
    });

    document.getElementById("dashboardCommanderCard").addEventListener("click", () => openFeature("profile"));
    document.getElementById("dashboardCampDraw").addEventListener("click", () => openFeature("camp-draw"));
    document.getElementById("dashboardAchievements").addEventListener("click", () => openFeature("achievements"));
    document.getElementById("dashboardShop").addEventListener("click", () => openFeature("shop"));
    document.getElementById("dashboardCampaigns").addEventListener("click", () => openFeature("campaigns"));
    document.getElementById("dashboardHistory").addEventListener("click", () => openFeature("history"));
    document.getElementById("dashboardNavHome").addEventListener("click", openDashboard);
    document.getElementById("dashboardNavShop").addEventListener("click", () => openFeature("shop"));
    document.getElementById("dashboardNavBattle").addEventListener("click", () =>
      document.getElementById("dashboardPlay").click());
    document.getElementById("dashboardNavHeroes").addEventListener("click", () => openFeature("heroes"));
    document.getElementById("dashboardNavSkills").addEventListener("click", () => openFeature("skills"));
    document.getElementById("featureBack").addEventListener("click", openDashboard);
    document.getElementById("featureTabs").addEventListener("click", handleFeatureClick);
    document.getElementById("featureContent").addEventListener("click", handleFeatureClick);

    initialize();
  </script>
</body>
</html>
