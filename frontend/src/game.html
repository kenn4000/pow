<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prisoners of War</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #07090e;
      color: #f3f4ef;
      font-synthesis: none;
      --felt: #1a2333;
      --felt-dark: #121927;
      --gold: #f0c75e;
      --paper: #f4f2e9;
      --card-red: #c5373d;
      --card-blue: #2873be;
      --card-yellow: #b58a06;
      --card-green: #24834f;
      --card-orange: #c76516;
      --card-purple: #784bb1;
      --card-brown: #805332;
      --card-silver: #6c747b;
      --card-gray: #7b8086;
      --card-ruby: #bd2945;
      --card-white: #f4f3ec;
      --card-gold: #d4a72c;
      --card-pink: #d94f9d;
      --card-lime: #84b82d;
      --card-sky-blue: #57aee2;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: #07090e; }
    button { font: inherit; }
    .shell {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      width: min(430px, 100%); height: 100vh; height: 100dvh; min-height: min(540px, 100vh);
      container-type: inline-size; margin: 0 auto; padding: 0; border: 1px solid #273148; border-radius: 30px;
      background: #0b0f19; box-shadow: 0 24px 80px #000a; color: #eef1f7;
    }
    .shell::before {
      position: absolute; inset: 0; z-index: 0; pointer-events: none; content: "";
      background:
        radial-gradient(circle at 8% 35%, #dc262610, transparent 32%),
        radial-gradient(circle at 95% 70%, #2563eb12, transparent 36%),
        radial-gradient(#ffffff08 1px, transparent 1px);
      background-size: auto, auto, 24px 24px;
    }
    .topline {
      position: relative; z-index: 1; display: flex; justify-content: flex-start; align-items: center;
      gap: 10px; flex: 0 0 auto; margin: 0; padding: 13px;
      border-bottom: 1px solid #263047; background: #101624eb;
    }
    .brand { margin: 0; color: #f6d46f; font: 800 15px Georgia, "Times New Roman", serif; letter-spacing: .09em; text-transform: uppercase; }
    .brand span { color: var(--gold); }
    .board {
      position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; overflow-y: auto;
      padding: 12px; background: transparent; scrollbar-color: #344159 transparent; scrollbar-width: thin;
    }
    .track { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); align-items: start; gap: 5px; }
    .track.abandon-track { grid-template-columns: repeat(var(--abandon-columns, 5), minmax(0, 1fr)); }
    .track.puzzler-track { grid-template-columns: repeat(var(--puzzler-columns, 5), minmax(0, 1fr)); }
    .puzzler-pair-column { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; min-width: 0; }
    .bounty-column { display: grid; grid-column: span 1; grid-template-columns: minmax(0, 1fr); gap: 5px; min-width: 0; }
    .track-cell { min-width: 0; height: clamp(78px, 11vw, 130px); display: flex; align-items: center; justify-content: center; position: relative; border: 2px solid #3d4b63; border-radius: 9px; background: #182133; }
    .track-cell.bounty { border: 3px solid var(--bounty-border-color, var(--gold)); background: #2b2614; }
    .bounty-value { font-size: clamp(8px, 1vw, 12px); font-weight: 800; line-height: 1.2; text-align: center; white-space: nowrap; }
    .shop-hero-icon { display: block; width: min(100%, 180px); height: 150px; margin: 8px auto; object-fit: contain; }
    .track-cell.white-capture { border-color: #fff; }
    .track-cell.black-capture { border-color: #000; box-shadow: 0 0 0 2px #8d99ad; }
    .track-cell .card { width: min(64px, calc(100% - 10px)); height: calc(100% - 10px); min-height: 0; }
    .track-cell .card .face { font-size: clamp(18px, 3vw, 32px); }
    .jailed-card { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .jailed-card .card { width: min(64px, calc(100% - 8px)); height: calc(100% - 14px); }
    .jailed-card.abandon-pair .card { outline: 2px solid #f6d46f; outline-offset: -2px; border-radius: 8px; }
    .puzzler-score { display: block; min-height: 14px; color: #fff; font-size: clamp(9px, 1vw, 12px); font-weight: 900; line-height: 14px; text-align: center; white-space: nowrap; }
    .jailed-card { animation: capture-drop .35s ease-out both; }
    @keyframes capture-drop { from { opacity: 0; transform: translateY(-12px) scale(.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .capture-face { height: 14px; color: #fff; font-size: clamp(10px, 1.2vw, 13px); font-weight: 900; line-height: 14px; text-align: center; }
    .round-group { display: grid; grid-column: span 3; grid-template-rows: auto auto auto; gap: 2px; min-width: 0; }
    .round-slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .round-brace { position: relative; height: 12px; border-bottom: 2px solid #e1e5e1; color: #fff; }
    .round-brace::before, .round-brace::after, .round-brace .brace-tip {
      position: absolute; display: block; width: 2px; background: #e1e5e1; content: "";
    }
    .round-brace::before, .round-brace::after { bottom: -2px; height: 7px; }
    .round-brace::before { left: 0; }
    .round-brace::after { right: 0; }
    .round-brace .brace-tip { bottom: -2px; left: calc(50% - 1px); height: 8px; }
    .round-weight { display: block; font-size: 11px; font-weight: 800; text-align: center; }
    .cell-empty { color: #aeb5b0; font-size: 13px; }
    .card {
      width: clamp(49px, 7vw, 83px);
      height: clamp(66px, 9vw, 108px);
      display: inline-flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 5px;
      border: 2px solid #fff;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 4px 9px #0004;
      color: #252a2b;
      cursor: default;
      transition: transform .12s ease, box-shadow .12s ease, outline-color .12s ease;
    }
    .card.skin-card { overflow: visible; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: #fff; }
    .card-art { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .card.skin-card .face {
      position: absolute; z-index: 1; top: 7%; left: 50%; transform: translateX(-50%);
      color: var(--card-suit-color); font-size: clamp(20px, 3vw, 34px);
      -webkit-text-stroke: .7px #161a18; text-shadow: 0 2px 4px #000, 0 0 2px #000;
      pointer-events: none;
    }
    .card.skin-card.mirrored .card-art { transform: scaleX(-1); }
    button.card { cursor: pointer; }
    button.card:hover { transform: translateY(-5px); box-shadow: 0 8px 13px #0005; }
    button.card:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .card .face { font-size: clamp(24px, 4vw, 42px); font-weight: 800; line-height: 1; }
    .card .face { color: var(--card-suit-color); }
    .card.back { cursor: default; border-color: #e2e4df; background: repeating-linear-gradient(135deg, #323a39 0 7px, #414b48 7px 14px); }
    .card.back::after { content: "POW"; color: #f0c75e; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
    .card.back .face { display: none; }
    button.card.back { cursor: pointer; }
    .match-info { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 1.2fr) minmax(0, 1fr); align-items: center; gap: clamp(8px, 2vw, 24px); margin: 16px 0; }
    .match-info[hidden] { display: none; }
    .match-side { min-width: 0; }
    .match-hero { display: grid; justify-items: center; gap: 6px; min-width: 0; text-align: center; }
    .hero-portrait { width: clamp(54px, 16vw, 72px); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border: 3px solid #e7ebe8; border-radius: 10px; background: #353b37; box-shadow: 0 5px 13px #0005; }
    .hero-portrait.black { border-color: #171b1a; }
    .hero-portrait img { width: 100%; height: 100%; object-fit: cover; }
    .hero-portrait { position: relative; }
    .match-hero h2 { max-width: 100%; margin: 0; font-size: clamp(11px, 1.5vw, 16px); line-height: 1.2; overflow-wrap: anywhere; }
    .hero-score { margin: 0; font-size: clamp(12px, 1.7vw, 18px); font-weight: 800; }
    .hero-score.white { color: #fff; }
    .hero-score.black { color: #1a1e1c; text-shadow: 0 1px #d5dbd6; }
    .match-center { min-width: 0; text-align: center; }
    .match-rules { display: grid; gap: 3px; margin-top: 2px; color: #e9ece8; font-size: clamp(10px, 1.15vw, 13px); line-height: 1.25; }
    .match-rules p { margin: 0; }
    .match-rules strong { color: #ffe18a; }
    .hero-select { display: grid; gap: 5px; margin-top: 12px; color: #dfe4df; font-size: 13px; }
    .hero-select select { min-height: 38px; padding: 5px 8px; border: 1px solid #aeb7b1; border-radius: 6px; background: #424a47; color: #f2f4f0; font: inherit; }
    .status { min-height: 34px; margin: 2px 0 14px; text-align: center; color: #f4f5f1; font-size: 15px; }
    .player-instructions .status { margin: 3px 0 12px; }
    .battle { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(40px, 64px) minmax(0, 1fr); align-items: center; gap: 8px; min-height: 160px; padding: 14px clamp(8px, 3vw, 32px); border: 1px solid #33415a; border-radius: 13px; background: radial-gradient(ellipse at center, #1e2a3f 0%, #121a28 70%); }
    .battle-result { display: inline-block; margin-top: 2px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .battle-result.win { background: #f0c75e; color: #1d1a0e; }
    .battle-result.lose { background: #2a3347; color: #aeb8c9; }
    .battle-result.clash { background: #3b2f5c; color: #e5dcff; }
    .battle-card-lost { opacity: .55; filter: grayscale(.4); }
    .battle.variant-screen { display: block; min-height: max-content; padding: 14px; }
    .variant-overview { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; }
    .variant-overview.abandon-overview { grid-template-columns: minmax(0, 1fr); }
    .variant-overview.puzzler-overview { grid-template-columns: minmax(0, 1fr); }
    .variant-overview.ladder-overview { grid-template-columns: minmax(0, 1fr); }
    .ladder-hand-cards { display: grid; justify-items: center; gap: 12px; margin-top: 12px; padding-top: 14px; }
    .ladder-hand-row { display: flex; justify-content: center; gap: 8px; max-width: 100%; }
    .ladder-hand-cards .card { flex: none; width: clamp(42px, 13vw, 78px); height: clamp(63px, 18vw, 104px); }
    .ladder-hand-cards .card:not(:disabled) { cursor: pointer; }
    .ladder-hand-panel { width: 100%; min-width: 0; }
    .ladder-played-stack-panel { display: grid; justify-items: center; padding: 8px 12px; border: 1px solid #33415a; border-radius: 10px; background: #0c1220a8; }
    .ladder-stack-rows { display: grid; justify-items: center; gap: 12px; max-width: 100%; }
    .ladder-stack-row { display: flex; align-items: flex-start; justify-content: center; gap: 8px; }
    .ladder-stack-item { display: flex; flex: 0 0 42px; flex-direction: column; align-items: center; }
    .ladder-stack-item .card { width: 42px; height: 58px; }
    .ladder-stack-bracket { box-sizing: border-box; width: calc(100% - 8px); height: 8px; margin-top: 4px; border-right: 2px solid #f6d46f; border-bottom: 2px solid #f6d46f; border-left: 2px solid #f6d46f; }
    .ladder-stack-label { margin-top: 2px; color: #f6d46f; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .ladder-played-stack-panel .ladder-chain-status { color: #c9d2e3; font-size: 12px; font-weight: 700; }
    #gameShell[data-variant="ladder"] .ladder-stack-item .card .face { font-size: 20px; }
    .ladder-final-hands { display: grid; gap: 10px; }
    .ladder-final-hand { display: flex; flex-wrap: wrap; gap: 5px; }
    .ladder-final-hand .card { width: 42px; height: 58px; }
    .tug-war-overview { display: grid; gap: 10px; }
    .tug-war-players { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .tug-war-players p { padding: 6px 9px; border: 1px solid #33415a; border-radius: 8px; background: #0c1220a8; color: #d3d9e4; font-size: 12px; }
    .tug-war-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(88px, auto)); align-items: start; gap: 22px 8px; }
    .tug-war-pile { display: grid; grid-template-rows: auto auto; justify-items: stretch; align-content: start; width: min(240px, 100%); min-width: 0; padding: 2px; }
    .tug-war-pile-line { display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px; align-items: center; gap: 5px; }
    .tug-war-pile-controls { display: flex; justify-content: center; min-width: 0; }
    .tug-war-pile-controls .action { width: 100%; min-height: 34px; padding: 3px 2px; font-size: 10px; line-height: 1.1; white-space: normal; }
    .tug-war-pile-center { display: grid; justify-items: center; min-width: 0; }
    .tug-war-pile-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; width: 100%; min-height: 62px; padding: 3px 0; }
    .tug-war-pile-cards .card { width: 38px; height: 54px; }
    .tug-war-stack-bracket { box-sizing: border-box; width: min(80%, 112px); height: 8px; margin-top: 3px; border-right: 2px solid #f6d46f; border-bottom: 2px solid #f6d46f; border-left: 2px solid #f6d46f; }
    .tug-war-stack-value { margin-top: 2px; color: #f6d46f; font-size: 12px; font-weight: 800; }
    .tug-war-pile-actions { display: flex; justify-content: center; width: 100%; margin-top: 7px; }
    .tug-war-pile-actions .action { width: 100%; min-height: 32px; padding: 4px 6px; font-size: 11px; }
    .tug-war-hand { display: grid; grid-template-columns: repeat(var(--hand-columns, 1), minmax(0, 1fr)); justify-items: center; column-gap: 7px; row-gap: 34px; padding-top: 28px; }
    .tug-war-hand .card { width: clamp(55px, 12vw, 72px); height: clamp(74px, 17vw, 96px); }
    .tug-war-hand .card:not(:disabled) { cursor: pointer; }
    #gameShell[data-variant="tug-war"] .match-info { grid-template-columns: minmax(0, 1fr) minmax(118px, .7fr) minmax(0, 1fr); max-width: 760px; margin: 8px auto; }
    #gameShell[data-variant="tug-war"] .match-hero { gap: 3px; }
    #gameShell[data-variant="tug-war"] .hero-portrait { width: clamp(54px, 16vw, 72px); }
    .tug-war-bounty { display: flex; justify-content: center; align-items: baseline; gap: 5px; margin: 0; font-size: 12px; font-weight: 800; }
    .variant-overview .card { width: clamp(58px, 16vw, 78px); height: clamp(78px, 22vw, 104px); }
    .variant-overview h2, .variant-panel h2 { margin: 0 0 5px; color: #f0d477; font: 700 15px Georgia, "Times New Roman", serif; }
    .variant-overview p, .variant-panel p { margin: 4px 0; color: #d3d9e4; font-size: 12px; }
    .variant-panel { margin-top: 12px; padding: 10px; border: 1px solid #33415a; border-radius: 10px; background: #0c1220a8; }
    .variant-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); justify-items: center; gap: 12px 8px; padding: 15px 3px 6px; }
    .variant-card-grid .card { width: clamp(62px, 17vw, 82px); height: clamp(84px, 23vw, 108px); }
    .variant-card-grid .card .face { font-size: clamp(25px, 7vw, 38px); }
    .variant-card-grid .card:disabled { cursor: default; opacity: .62; }
    .variant-card-grid .card.used { opacity: .45; filter: grayscale(.8); }
    .puzzle-battle-lobby, .puzzle-battle-match { display: grid; gap: 12px; }
    .puzzle-battle-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: #d3d9e4; font-size: 12px; }
    .puzzle-battle-clock { color: #ffe18a; font-size: 18px; font-weight: 900; }
    .puzzle-battle-board-heading { align-items: center; }
    .puzzle-battle-board-heading h2 { margin: 0; }
    .puzzle-battle-board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .puzzle-battle-board .card { width: clamp(52px, 13vw, 72px); height: clamp(72px, 18vw, 96px); }
    .puzzle-battle-lobby-list, .puzzle-battle-results { display: grid; gap: 8px; }
    .puzzle-battle-lobby-item { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .puzzle-battle-lobby-item .actions { margin: 0; }
    .puzzle-battle-results > h2 { margin-bottom: 0; }
    .puzzle-battle-reward { margin: 0 !important; color: #ffe18a !important; font-weight: 800; }
    .puzzle-battle-score-boxes { display: grid; gap: 10px; }
    .puzzle-battle-score-box { min-width: 0; padding: 9px; border: 1px solid #344159; border-radius: 8px; background: #101624; }
    .puzzle-battle-score-box h3 { margin: 0 0 7px; color: #f0d477; font-size: 13px; }
    .puzzle-battle-jail-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 34px; align-items: center; gap: 5px; min-height: 62px; padding-block: 8px; border-top: 1px solid #263047; }
    .puzzle-battle-jail-round { color: #aebbd0; font-size: 10px; }
    .puzzle-battle-jailed-cards { display: flex; align-items: center; gap: 3px; min-width: 0; min-height: 44px; overflow: hidden; }
    .puzzle-battle-jailed-cards .card { width: clamp(26px, 7vw, 34px); height: clamp(36px, 9vw, 44px); }
    .puzzle-battle-jailed-cards .card.skin-card .face { top: 6%; font-size: clamp(12px, 3vw, 16px); }
    .puzzle-battle-no-jail { color: #8290a6; font-size: 10px; }
    .puzzle-battle-jail-value { display: flex; align-items: center; justify-content: flex-end; min-height: 44px; color: #fff; font-size: 12px; line-height: 1.35; text-align: right; }
    .puzzle-battle-total { margin: 7px 0 0 !important; padding-top: 6px; border-top: 1px solid #344159; color: #ffe18a !important; font-weight: 800; text-align: right; }
    .variant-score { color: #f6d46f !important; font-size: 14px !important; font-weight: 800; }
    .variant-results { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
    .variant-pair { display: grid; justify-items: center; gap: 4px; min-width: 62px; color: #d3d9e4; font-size: 10px; text-align: center; }
    .variant-pair .card { width: 48px; height: 64px; }
    .abandon-board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); justify-items: center; gap: 12px 8px; margin-top: 14px; }
    .abandon-board .card { width: clamp(50px, 17vw, 82px); height: clamp(68px, 23vw, 108px); }
    .abandon-board .card.used { opacity: .42; filter: grayscale(.85); }
    .abandon-board .abandon-empty-card { width: clamp(50px, 17vw, 82px); height: clamp(68px, 23vw, 108px); }
    .abandon-board-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
    .abandon-card-penalty { color: #fff; font-size: 13px; font-weight: 900; }
    .abandon-personal-pile { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); justify-items: center; gap: 8px 4px; margin-top: 10px; }
    .abandon-personal-pile .card { width: clamp(40px, 15vw, 64px); height: clamp(56px, 20vw, 84px); }
    .abandon-personal-pile .card.used { opacity: .42; filter: grayscale(.85); }
    .abandon-personal-pile .abandon-empty-card { width: clamp(40px, 15vw, 64px); height: clamp(56px, 20vw, 84px); }
    .abandon-instructions { color: #c9d2e0; font-size: 11px; line-height: 1.45; }
    .suit-cycle.puzzle-suit-cycle { width: min(190px, 100%); margin: 8px auto 0; }
    .variant-status { color: #f3d982 !important; font-weight: 800; }
    .battle-vs.clash { color: #c4b5fd; }
    .battle-player { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
    .battle-player-name { max-width: 100%; color: #e4e8e4; font-size: 12px; text-align: center; text-transform: uppercase; letter-spacing: .08em; }
    .battle-card-line { display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; min-width: 0; }
    .battle-face { position: relative; z-index: 2; min-width: 22px; color: #fff; font-size: clamp(20px, 3vw, 32px); font-weight: 900; line-height: 1; text-align: center; -webkit-text-stroke: .6px #101624; text-shadow: 0 2px 4px #000; }
    .battle-vs { position: relative; z-index: 1; color: #d5dbd6; text-align: center; font-weight: 800; letter-spacing: .12em; }
    .battle-cloud-frame { position: absolute; z-index: 1; top: 50%; left: 50%; width: clamp(150px, 30vw, 260px); height: auto; aspect-ratio: 1066 / 640; transform: translate(-50%, -50%); pointer-events: none; }
    .chest-reveal-overlay { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 16px; background: #080b0de8; }
    .chest-reveal-dialog { width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 18px; border: 1px solid #879083; border-radius: 14px; background: linear-gradient(145deg, #242b26, #111714); color: #f3f4ef; text-align: center; box-shadow: 0 18px 70px #000b; }
    .chest-reveal-dialog h2 { margin: 0 0 12px; }
    .chest-reveal-chests { display: grid; grid-template-columns: repeat(var(--chest-count), minmax(0, 1fr)); gap: 12px; }

  <script>
    const suits = ["Scissors", "Paper", "Rock"];
    const skinFolders = {
      Red: "shop/tribal/red",
      Blue: "shop/tribal/blue",
      Yellow: "shop/tribal/yellow",
      Purple: "shop/tribal/purple",
      Orange: "shop/tribal/orange",
      Green: "shop/tribal/green",
      "Lime Green": "shop/conq/lime",
      Gold: "shop/conq/gold",
      Pink: "shop/conq/pink",
      "Sky Blue": "shop/conq/blue",
      Silver: "shop/bee/silver",
      Brown: "shop/cat/brown",
      Gray: "shop/dog/gray",
      Ruby: "shop/dragon/ruby",
      White: "shop/orc/white"
    };
    const defaultSuitColors = ["Blue", "Yellow", "Red"];
    const colorVars = {
      Red: "var(--card-red)", Blue: "var(--card-blue)", Yellow: "var(--card-yellow)",
      Green: "var(--card-green)", Orange: "var(--card-orange)", Purple: "var(--card-purple)",
      "Lime Green": "var(--card-lime)", Gold: "var(--card-gold)", Pink: "var(--card-pink)",
      "Sky Blue": "var(--card-sky-blue)", Silver: "var(--card-silver)", Brown: "var(--card-brown)",
      Gray: "var(--card-gray)", Ruby: "var(--card-ruby)", White: "var(--card-white)"
    };
    const heroIconNames = {
      ascendant: "gorilla", anchor: "turtle", ascetic: "bureaucrat",
      herald: "bodybuilder", treasurer: "treasure"
    };
    const suitColors = loadSuitColors();
    const dashboardPreview = new URLSearchParams(window.location.search).get("preview") === "dashboard";
    const selected = new Set();
    let rummyDiscardFirstIndex = null;
    let rummyDiscardFirstRole = null;
    const lifecycle = new AbortController();
    let navigationVersion = 0;
    let initialized = false;
    let modalKey = '';
    let modalReturnFocus = null;
    let achievementFilter = 'all';
    let achievementCategory = 'all';
    let pendingConfirmation = null;
    let pendingTokenDialog = null;
    let setupMode = 'easy';
    let setupVariant = 'main';
    let pokerDuelTimer = null;
    let pokerDuelDeadline = 0;
    let pokerDuelTimerKey = "";
    let pokerDuelPollTimer = null;
    let pokerDuelPollInProgress = false;
    let ladderPollTimer = null;
    let ladderPollInProgress = false;
    let puzzleBattlePollTimer = null;
    let puzzleBattlePollInProgress = false;
    let puzzleBattleClockTimer = null;
    let puzzleBattleClockKey = "";
    let puzzleBattleDeadline = 0;
    let puzzleBattleShowHistory = false;
    let puzzleBattleHistoryCache = [];
    let puzzleBattlePendingPair = [];
    let puzzleBattlePendingRoundKey = "";
    let onlineBattlePollTimer = null;
    let onlineBattlePollInProgress = false;
    let onlineBattleVariant = "main";
    let onlineBattleStateKey = "";
    let openSuitMenu = null;
    let openPuzzleSuitMenu = -1;
    let state = null;
    let activeMode = "";
    let showNewGameConfirmation = false;
    let actionInProgress = false;
    let showDashboard = true;
    let showFeature = false;
    let currentFeature = "";
    let currentShopTab = "skins";
    let shopPreviewChromaID = "";
    let shopPreviewPoseIndex = 0;
    let shopPreviewTimer = null;
    let currentSkillBranch = "daily-wins";
    let featureFocusTarget = "";
    let featureData = null;
    let featureError = "";
    let featureActionInProgress = false;
    let showModeSelection = false;
    let battleAnimation = null;
    let battleAnimationTimer = null;
    let battleCloudAtlasPromise = null;
    const BATTLE_CLOUD_FRAME_DURATION_MS = 100;
    const battleCloudMiddleFrames = [
      "cloud_red.png", "cloud_orange.png", "cloud_yellow.png",
      "cloud_lime.png", "cloud_green.png", "cloud_skyblue.png",
      "cloud_blue.png", "cloud_purple.png", "cloud_pink.png"
    ];
    const battleCloudFrameAliases = {
      "cloud_base.png": "cloud.png",
      "cloud_prismatic.png": "cloud_prism.png"
    };
    let chestReveal = null;
    let chestRevealTimer = null;
    let chestRevealSequenceID = 0;
    const chestAnimationTypes = {
      wooden: { prefix: "wooden", sheet: "wooden_chest_anim" },
      silver: { prefix: "silver", sheet: "silver_chest_anim" },
      gold: { prefix: "golden", sheet: "golden_chest_anim" },
      diamond: { prefix: "prismatic", sheet: "prismatic_chest_anim" },
      prismatic: { prefix: "prismatic", sheet: "prismatic_chest_anim" }
    };
    const chestAtlasPromises = new Map();
    let aiDraftTimer = null;
    let aiDraftPendingKey = "";
    const skillTreeBranches = [
      { id: "daily-wins", label: "Daily Wins", icon: "branch_daily.png", nodeIDs: ["first-blood", "daily-double", "rations-readiness", "daily-triumph"] },
      { id: "multiplayer", label: "Multiplayer", icon: "branch_multi.png", nodeIDs: ["streak", "field-warden", "mark-of-victory", "bounty-hunter"] },
      { id: "general-rewards", label: "General Rewards", icon: "branch_general.png", nodeIDs: ["quartermaster", "salvager", "curator", "bounty-board"] },
      { id: "energy", label: "Energy", icon: "branch_energy.png", nodeIDs: ["expanded-rations", "quick-recovery", "stockpile", "second-wind", "overflow"] },
      { id: "collection", label: "Collection", icon: "branch_chest.png", nodeIDs: ["thrifty-quartermaster", "hero-broker", "veterans-discount", "lucky-duplicate", "premium-duplicate"] },
      { id: "camp", label: "Camp", icon: "branch_deck.png", nodeIDs: ["camp-lore", "reroll", "loaded-deck", "conductor-1", "conductor-2"] }
    ];

    function loadSuitColors() {
      const legacyDefaults = ["Red", "Yellow", "Blue"];
      try {
        const saved = JSON.parse(localStorage.getItem("pow-suit-colors") || "null");
        if (Array.isArray(saved) && saved.length === suits.length &&
            saved.every(color => colors.includes(color)) && new Set(saved).size === suits.length) {
          return JSON.stringify(saved) === JSON.stringify(legacyDefaults) ? [...defaultSuitColors] : saved;
        }
      } catch {
        return [...defaultSuitColors];
      }
      return [...defaultSuitColors];
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    async function api(path, body) {
      const requestPath = dashboardPreview
        ? `${path}${path.includes("?") ? "&" : "?"}preview=dashboard`
        : path;
      const response = await fetch(`${import.meta.env.BASE_URL}${requestPath.replace(/^\//, "")}`, body ? {
        signal: lifecycle.signal,
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      } : { signal: lifecycle.signal });
      const responseText = await response.text();
      if (response.status === 401) window.dispatchEvent(new Event("pow-session-expired"));
      let payload;
      try {
        payload = JSON.parse(responseText);
      } catch {
        const detail = responseText.trim().slice(0, 200);
        if (!response.ok) {
          throw new Error(`Request failed (${response.status})${detail ? `: ${detail}` : ""}`);
        }
        throw new Error("The server returned an invalid response.");
      }
      if (!response.ok) throw new Error(payload.error || "Request failed");
      if (payload && payload.dashboard && !dashboardPreview) {
        window.dispatchEvent(new CustomEvent("pow-commander", { detail: { displayName: payload.dashboard.displayName || "" } }));
      }
      return payload;
    }

    function cardMarkup(item, options = {}) {
      const card = item.card || item;
      const fogMasked = Boolean(item.faceHidden);
      const equipped = equippedChroma(card.suit);
      const appearance = options.appearance || (equipped ? chromaAppearance(equipped) : null);
      const color = appearance?.color || suitColors[card.suit];
      const skin = appearance?.skin || skinFolders[color] || skinFolders[defaultSuitColors[card.suit]];
      const tier = card.face <= 3 ? "small" : card.face <= 6 ? "med" : "large";
      const pose = ["idle", "attack", "win", "lose"].includes(options.pose) ? options.pose : "idle";
      const selectable = Boolean(item.selectable || options.selectable);
      const chosen = Boolean(options.selectedIndex !== undefined && options.selectedIndex === item.index &&
        (!options.selectedSource || options.selectedSource === options.source) ||
        options.commit && selected.has(item.index));
      const tag = selectable ? "button" : "div";
      const source = options.source ? ` data-source="${esc(options.source)}"` : "";
      const attrs = selectable ? `type="button" data-index="${item.index}"${source} aria-pressed="${chosen}"${item.disabled || options.disabled ? " disabled" : ""}` : "";
      const face = options.face === undefined ? card.face : options.face;
      const hideFace = Boolean(options.hideFace || fogMasked || options.back);
      const faceMarkup = hideFace ? "" : `<span class="face">${esc(face)}</span>`;
      const mirrored = options.mirror ? " mirrored" : "";
      const faceColor = options.faceColor || appearance?.hexColor || colorVars[color] || "var(--paper)";
      const ariaLabel = options.ariaLabel || (fogMasked
        ? `${suits[card.suit]} card`
        : options.back ? "Face-down card"
          : `${suits[card.suit]} ${card.face}, ${color}${options.face !== undefined ? `, effective value ${face}` : ''}`);
      const className = `card${options.back ? " back" : " skin-card"}${chosen ? " chosen" : ""}${mirrored}${options.used ? " used" : ""}`;
      const art = options.back ? "" : `<img class="card-art" style="${appearance?.filter ? `filter:${appearance.filter}` : ''}" src="${import.meta.env.BASE_URL}skins/${skin}/${tier}_${pose}.png?thumb=160" alt="" aria-hidden="true">`;
      return `<${tag} class="${className}" style="--card-suit-color:${faceColor}" ${attrs} aria-label="${esc(ariaLabel)}">
        ${art}${faceMarkup}
      </${tag}>`;
    }

    function battleAnimationKey() {
      if (!state || !state.battleAttack || !state.battleDefend || !state.battleOutcome) return "";
      return `${state.round}-${state.exchange}-${state.attacker}-${state.battleAttack.face}-${state.battleDefend.face}`;
    }

    async function loadBattleCloudAtlas() {
      if (!battleCloudAtlasPromise) {
        battleCloudAtlasPromise = (async () => {
          const metadataResponse = await fetch(`${import.meta.env.BASE_URL}skins/icons/animations/clouds.json`, { signal: lifecycle.signal });
          if (!metadataResponse.ok) throw new Error(`Cloud animation metadata request failed (${metadataResponse.status})`);
          const atlas = await metadataResponse.json();
          const names = ["cloud_base.png", ...battleCloudMiddleFrames, "cloud_prismatic.png", "cloud_brown.png"];
          const frameKeys = Object.fromEntries(names.map(name => {
            const key = battleCloudFrameAliases[name] || name;
            const frame = atlas.frames?.[key];
            if (!frame) throw new Error(`Cloud animation frame ${key} is missing`);
            return [name, frame];
          }));
          const firstFrame = frameKeys["cloud_base.png"];
          const frameWidth = firstFrame.frame?.w;
          const frameHeight = firstFrame.frame?.h;
          if (!frameWidth || !frameHeight || names.some(name =>
            frameKeys[name].frame?.w !== frameWidth || frameKeys[name].frame?.h !== frameHeight ||
            frameKeys[name].rotated || frameKeys[name].trimmed ||
            frameKeys[name].frame.x < 0 || frameKeys[name].frame.y < 0 ||
            frameKeys[name].frame.x + frameWidth > atlas.meta?.size?.w ||
            frameKeys[name].frame.y + frameHeight > atlas.meta?.size?.h)) {
            throw new Error("Cloud animation frames must have uniform, untrimmed dimensions");
          }
          const image = new Image();
          image.src = `${import.meta.env.BASE_URL}skins/icons/animations/${encodeURIComponent(atlas.meta?.image || "clouds.png")}`;
          await image.decode();
          if (image.naturalWidth !== atlas.meta?.size?.w || image.naturalHeight !== atlas.meta?.size?.h) {
            throw new Error("Cloud animation sheet dimensions do not match its metadata");
          }
          return { image, frameKeys, frameWidth, frameHeight };
        })().catch(error => {
          battleCloudAtlasPromise = null;
          throw error;
        });
      }
      return battleCloudAtlasPromise;
    }

    function drawBattleCloudFrame(animation) {
      const canvas = document.querySelector("#battleVs .battle-cloud-frame");
      if (!canvas || !animation?.cloudFrames) return;
      const atlas = animation.cloudAtlas;
      const frameName = animation.cloudFrames[animation.cloudFrameIndex];
      const frame = atlas.frameKeys[frameName];
      const context = canvas.getContext("2d");
      if (!context) return;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(atlas.image, frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
        0, 0, canvas.width, canvas.height);
    }

    async function startBattleCloudSequence(key) {
      try {
        const cloudAtlas = await loadBattleCloudAtlas();
        if (!battleAnimation || battleAnimation.key !== key || !state || state.phase !== "result") return;
        const startIndex = Math.floor(Math.random() * battleCloudMiddleFrames.length);
        const step = Math.random() < 0.5 ? 1 : -1;
        const middleFrames = Array.from({ length: 8 }, (_, index) =>
          battleCloudMiddleFrames[(startIndex + step * index + battleCloudMiddleFrames.length) %
            battleCloudMiddleFrames.length]);
        battleAnimation.stage = "clouds";
        battleAnimation.cloudAtlas = cloudAtlas;
        battleAnimation.cloudFrames = ["cloud_base.png", ...middleFrames, "cloud_prismatic.png", "cloud_brown.png"];
        battleAnimation.cloudFrameIndex = 0;
        render();
        drawBattleCloudFrame(battleAnimation);
        scheduleBattleCloudFrame(key);
      } catch (error) {
        if (error.name === "AbortError") return;
        console.error("Could not load battle cloud animation:", error);
        beginBattleOutcome(key);
      }
    }

    function scheduleBattleCloudFrame(key) {
      battleAnimationTimer = window.setTimeout(() => {
        if (!battleAnimation || battleAnimation.key !== key || battleAnimation.stage !== "clouds" ||
            !state || state.phase !== "result") return;
        battleAnimation.cloudFrameIndex++;
        if (battleAnimation.cloudFrameIndex >= battleAnimation.cloudFrames.length) {
          beginBattleOutcome(key);
          return;
        }
        render();
        drawBattleCloudFrame(battleAnimation);
        scheduleBattleCloudFrame(key);
      }, BATTLE_CLOUD_FRAME_DURATION_MS);
    }

    function beginBattleOutcome(key) {
      if (!battleAnimation || battleAnimation.key !== key || !state || state.phase !== "result") return;
      battleAnimation.stage = "outcome";
      render();
      scheduleBattleAnimation(key, "settled", 2000);
    }

    function scheduleBattleAnimation(key, stage, delay) {
      battleAnimationTimer = window.setTimeout(() => {
        if (!battleAnimation || battleAnimation.key !== key || !state || state.phase !== "result") return;
        battleAnimation.stage = stage;
        render();
        if (stage === "settled") scheduleBattleContinuation(key);
      }, delay);
    }

    function scheduleBattleContinuation(key) {
      if (showDashboard || showFeature) return;
      battleAnimationTimer = window.setTimeout(() => {
        if (!battleAnimation || battleAnimation.key !== key || battleAnimation.stage !== "settled" ||
            !state || state.phase !== "result") return;
        act("continue");
      }, 2000);
    }

    function syncBattleAnimation() {
      if (showDashboard || showFeature) { window.clearTimeout(battleAnimationTimer); battleAnimation = null; return; }
      if (!state || state.phase !== "result") {
        window.clearTimeout(battleAnimationTimer);
        battleAnimation = null;
        return;
      }
      const key = battleAnimationKey();
      if (!key || battleAnimation?.key === key) return;
      window.clearTimeout(battleAnimationTimer);
      battleAnimation = {
        key,
        stage: "impact",
        previousScores: {
          White: document.querySelector("#whiteHeroPanel .hero-score")?.textContent || "",
          Black: document.querySelector("#blackHeroPanel .hero-score")?.textContent || ""
        }
      };
      startBattleCloudSequence(key);
    }

    function puzzlerStatusText(puzzle = state?.puzzle || {}) {
      const direction = String(puzzle.direction || puzzle.expectedSolver || "High");
      const highLow = /low/i.test(direction) ? "Low" : "High";
      if (puzzle.complete) return puzzle.won ? `${highLow} · Puzzle won` : `${highLow} · Puzzle lost`;
      return hasSelectedIndex(puzzle.selectedIndex)
        ? `${highLow} · Select a second card`
        : `${highLow} · Choose a card`;
    }

    let puzzlerClock = null;
    let puzzlerClockKey = "";

    function syncPuzzlerClock() {
      const puzzle = state?.puzzle || {};
      const key = `${puzzle.id || ""}:${puzzle.startedAt || ""}`;
      const timestamp = Date.parse(puzzle.startedAt);
      const startedAt = Number.isFinite(timestamp) ? timestamp : Date.now();
      const update = () => {
        const clock = document.getElementById("puzzlerElapsedTime");
        if (!clock) return;
        const elapsed = Math.floor(Math.max(0, Date.now() - startedAt) / 1000);
        const hours = Math.floor(elapsed / 3600);
        const minutes = Math.floor(elapsed % 3600 / 60);
        const seconds = elapsed % 60;
        clock.textContent = hours
          ? `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
          : `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      };
      if (!document.getElementById("puzzlerElapsedTime")) {
        if (puzzlerClock !== null) window.clearInterval(puzzlerClock);
        puzzlerClock = null;
        puzzlerClockKey = "";
        return;
      }
      if (puzzlerClock !== null && puzzlerClockKey !== key) {
        window.clearInterval(puzzlerClock);
        puzzlerClock = null;
      }
      puzzlerClockKey = key;
      update();
      if (puzzle.complete) {
        if (puzzlerClock !== null) window.clearInterval(puzzlerClock);
        puzzlerClock = null;
      } else if (puzzlerClock === null) {
        puzzlerClock = window.setInterval(update, 1000);
      }
    }

    function renderRummyBattle() {

    function balancedLadderRows(cards) {
      const rowCount = Math.ceil(cards.length / 5);
      if (!rowCount) return [];
      const rowSize = Math.floor(cards.length / rowCount);
      const largerRows = cards.length % rowCount;
      const rows = [];
      let offset = 0;
      for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
        const size = rowSize + (rowIndex < largerRows ? 1 : 0);
        rows.push(cards.slice(offset, offset + size));
        offset += size;
      }
      return rows;
    }

    function nonemptyLadderHands(hands) {
      return (Array.isArray(hands) ? hands : [])
        .map((cards, index) => ({ cards: Array.isArray(cards) ? cards : [], index }))
        .filter(hand => hand.cards.length > 0);
    }

    function renderLadderBattle() {
      const ladder = state.ladder || {};
      const currentPlayer = Number(ladder.currentPlayer || 0);
      const activeName = state.mode === "online"
        ? currentPlayer === 0 ? "You" : "Opponent"
        : currentPlayer === 0 ? "You" : ({ easy: "Easy CPU", normal: "Medium CPU", hard: "Hard CPU" }[state.mode] || "CPU");
      const opponentHandCount = Number(ladder.opponentHandCount || 0);
      const handCards = ladder.hand || [];
      const hand = balancedLadderRows(handCards)
        .map(cards => `<div class="ladder-hand-row">${cards.map(card => cardMarkup(card)).join("")}</div>`)
        .join("");
      const chainCard = ladder.chainCard || (() => {
        // Older saved games retained only the effective value, so reconstruct only an unambiguous face.
        if (ladder.chainSuit == null) return null;
        const suit = Number(ladder.chainSuit);
        if (!Number.isInteger(suit) || suit < 0 || suit >= suits.length) return null;
        const wildFace = Number(ladder.wildFaceRaw);
        if (ladder.chainIsWild && Number.isInteger(wildFace) && wildFace >= 1 && wildFace <= 9) {
          return { suit, face: wildFace };
        }
        const value = Number(ladder.chainValue);
        if (!Number.isInteger(value)) return null;
        const shift = Number(ladder.sharedStats?.shift || 0);
        const favor = Number(ladder.sharedStats?.favor || 0);
        const faces = new Set();
        const unscaledFace = value - shift;
        if (unscaledFace >= 1 && unscaledFace <= 9) faces.add(unscaledFace);
        const scaledValue = value - favor;
        if (scaledValue % 2 === 0) {
          const scaledFace = scaledValue / 2 - shift;
          if (scaledFace >= 1 && scaledFace <= 9) faces.add(scaledFace);
        }
        return faces.size === 1 ? { suit, face: [...faces][0] } : null;
      })();
      const history = Array.isArray(ladder.playedCards) ? ladder.playedCards : [];
      const stackCards = ladder.openingChoice ? [] : history.length ? history : chainCard ? [chainCard] : [];
      let stackOffset = 0;
      const stack = balancedLadderRows(stackCards).map(cards => {
        const row = cards.map(card => {
          const isTarget = stackOffset === stackCards.length - 1;
          stackOffset++;
          return `<div class="ladder-stack-item">${cardMarkup(card)}${isTarget
            ? '<div class="ladder-stack-bracket" aria-hidden="true"></div><span class="ladder-stack-label">Card to beat</span>'
            : ""}</div>`;
        }).join("");
        return `<div class="ladder-stack-row">${row}</div>`;
      }).join("");
      const emptyStackMessage = ladder.openingChoice
        ? state.phase === "ladder-thinking"
          ? "The CPU is choosing a card to open the next ladder."
          : state.phase === "handoff"
            ? "Pass the screen to choose a card for the next ladder."
            : "Choose a card to open the next ladder."
        : "No cards played";
      const chainStatus = !ladder.openingChoice && ladder.chainIsWild
        ? "Wild chain · only a higher-suited wild can beat it"
        : "";
      const finalHands = nonemptyLadderHands(ladder.finalHands).map(({ cards, index }) => {
        return `<section><h3>${index === 0 ? "You" : "Opponent"} · ${cards.length} cards</h3>
          <div class="ladder-final-hand">${cards.map(card => cardMarkup(card)).join("")}</div>
        </section>`;
      }).join("");
      document.getElementById("variantContent").innerHTML = `<div class="variant-overview ladder-overview">
        <section class="ladder-played-stack-panel" aria-label="Played cards">
          <div class="ladder-stack-rows">${stack || `<span class="empty-row">${emptyStackMessage}</span>`}</div>
          ${chainStatus ? `<span class="ladder-chain-status">${esc(chainStatus)}</span>` : ""}
        </section>
        ${state.phase === "gameover" && finalHands ? `<section class="variant-panel"><h2>Remaining cards</h2><div class="ladder-final-hands">${finalHands}</div></section>` : ""}
        ${state.phase !== "gameover" ? `<section class="player-panel ladder-hand-panel">
          <div class="player-heading">
            <h2>${state.phase === "handoff" ? "Private hand hidden" : `${esc(activeName)}’s hand`}</h2>
            <span>Opponent’s hand size: ${opponentHandCount}</span>
          </div>
          <div class="ladder-hand-cards">${hand || '<span class="empty-row">Your hand is hidden until you are ready.</span>'}</div>
        </section>` : ""}
      </div>`;
      document.querySelectorAll(".ladder-hand-cards .card[data-index]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.disabled) return;
          act(state.phase === "ladder-opening-choice" ? "ladder-open" : "ladder-play", {
            index: Number(button.dataset.index)
          });
        });
      });
    }

    function renderTugWarBattle() {
      const tug = state.tugWar || {};
      const players = tug.players || [];
      const playerName = index => players[index]?.you
        ? "You"
        : state.mode === "online" ? "Opponent"
          : players[index]?.cpu ? "CPU"
            : `Player ${index + 1}`;
      const hand = tug.hand || [];
      const handColumns = Math.max(1, hand.length <= 4 ? hand.length : Math.ceil(hand.length / 2));
      const pullsRemaining = Number(players[Number(tug.viewer || 0)]?.pushes ?? 0);
      const selectedIndex = selected.size ? [...selected][0] : undefined;
      const pileValue = pile => (pile.cards || []).reduce((total, card) =>
        total + 1 + (Number(card.suit) === Number(tug.bountySuit) ? Number(tug.b || 0) : 0), 0);
      const piles = (tug.piles || []).map((pile, index) => {
        const position = pile.zone === -1 ? `${playerName(0)} side` : pile.zone === 1 ? `${playerName(1)} side` : "neutral";
        const column = pile.zone === -1 ? 1 : pile.zone === 1 ? 3 : 2;
        const alignment = column === 1 ? "start" : column === 3 ? "end" : "center";
        const cards = pile.cards?.length
          ? cardMarkup(pile.cards[pile.cards.length - 1])
          : "";
        const play = tug.canPlay && selectedIndex !== undefined
          ? `<button class="action primary" data-tug-action="tug-war-play" data-pile="${index}" data-index="${selectedIndex}">Play here</button>` : "";
        const pull = `<button class="action secondary" data-tug-action="tug-war-push" data-pile="${index}"${tug.canPush?.[index] && pullsRemaining > 0 ? "" : " disabled"}>Pull (${pullsRemaining})</button>`;
        const draw = `<button class="action secondary" data-tug-action="tug-war-flip" data-pile="${index}"${tug.canFlip ? "" : " disabled"}>Draw</button>`;
        return `<section class="tug-war-pile" style="grid-column:1 / -1;grid-row:${index + 1};justify-self:${alignment}" aria-label="Pile ${index + 1}, ${esc(position)}, value ${pileValue(pile)}">
          <div class="tug-war-pile-line">
            <div class="tug-war-pile-controls">${pull}</div>
            <div class="tug-war-pile-center">
              <div class="tug-war-pile-cards">${cards || '<span class="empty-row">No cards</span>'}</div>
              <div class="tug-war-stack-bracket" aria-hidden="true"></div>
              <span class="tug-war-stack-value">${pileValue(pile)}</span>
            </div>
            <div class="tug-war-pile-controls">${draw}</div>
          </div>
          <div class="tug-war-pile-actions">${play}</div>
        </section>`;
      }).join("");
      document.getElementById("variantContent").innerHTML = `<div class="tug-war-overview">
        <div class="tug-war-board">${piles}</div>
        <section class="player-panel">
          <div class="player-heading"><h2>${esc(playerName(Number(tug.viewer || 0)))}’s hand</h2><span>${hand.length} cards${tug.canAct ? " · select a card" : ""}</span></div>
          <div class="tug-war-hand" style="--hand-columns:${handColumns}">${hand.map((card, index) => cardMarkup({
            card, index, selectable: Boolean(tug.canPlay && tug.canAct)
          }, { commit: true })).join("") || '<span class="empty-row">No cards in hand</span>'}</div>
        </section>
      </div>`;
      document.querySelectorAll(".tug-war-hand .card[data-index]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.disabled) return;
          const index = Number(button.dataset.index);
          if (selected.has(index)) selected.delete(index);
          else {
            selected.clear();
            selected.add(index);
          }
          render();
        });
      });
      document.querySelectorAll("[data-tug-action]").forEach(button => {
        button.addEventListener("click", () => {
          const payload = { slot: Number(button.dataset.pile) };
          const action = button.dataset.tugAction;
          if (action === "tug-war-play") payload.index = Number(button.dataset.index);
          selected.clear();
          act(action, payload);
        });
      });
    }

    function renderAbandonBattle() {
      const abandon = state.abandon || {};
      const pairCount = Number(abandon.pairCount || 0);
      const pairsMade = (abandon.pairResults || []).length;
      const status = abandon.complete
        ? abandon.won ? "Mission complete — you win!" : "Mission complete — target not reached."
        : state.phase === "abandon-reveal" ? "Flip one face-down board card."
          : state.phase === "abandon-pair-first" ? "Choose the first card for this battle."
            : "Choose a second, different card.";
      document.getElementById("variantContent").innerHTML = `<div class="variant-overview abandon-overview">
        <div><h2>Abandon</h2>
          <p>Target score: ${esc(abandon.target ?? "—")} · Pairs: ${pairsMade}/${pairCount}</p>
          <p class="variant-score">Running score: ${esc(abandon.score ?? 0)}</p>
          <p class="variant-status abandon-instructions">${esc(status)}</p>
          ${abandon.complete && state.campaign?.result ? `<p class="variant-panel variant-status" role="status">${esc(state.campaign.result)}</p>` : ""}
        </div>
      </div>`;
      if (abandon.complete && state.campaign) {
        const missionActions = document.createElement("div");
        missionActions.className = "puzzle-actions";
        appendMissionActions(missionActions, () => startMission(state.campaign.id, state.campaign.index));
        document.getElementById("variantContent").append(missionActions);
      }
    }

    function renderAbandonDuelBattle() {
      const duel = state.abandonDuel;
      if (!duel || !Array.isArray(duel.board) || duel.board.length === 0 || !duel.modifiers) {
        document.getElementById("variantContent").innerHTML = `<section class="variant-panel">
          <p role="alert">Abandon game data is unavailable. Update and restart the game server, then start a new match.</p>
        </section>`;
        return;
      }
      const players = duel.players || [];
      const pairPhase = ["abandon-duel-pair-first", "abandon-duel-pair-second"].includes(state.phase);
      const board = duel.board || [];
      const cpuName = "CPU";
      const renderDuelCard = (item, source, selectable) => {
        if (item.used) {
          return '<div class="abandon-board-item abandon-empty-card" aria-hidden="true"></div>';
        }
        return `<div class="abandon-board-item">${cardMarkup({
          ...item,
          card: item.card || { suit: 0, face: 1 },
          selectable: Boolean(selectable) && !item.used,
          disabled: item.used || !selectable
        }, {
          back: !item.revealed,
          ariaLabel: !item.revealed
            ? `Face-down ${source === "board" ? "board" : "personal"} card ${Number(item.index) + 1}`
            : "",
          selectedIndex: duel.selectedIndex,
          selectedSource: duel.selectedSource,
          source,
          used: false
        })}</div>`;
      };
      const boardMarkup = board.map(item => renderDuelCard(item, "board",
        Boolean(item.selectable) ||
          state.canAct && state.phase === "abandon-duel-reveal" && !item.revealed && !item.used
      )).join("");
      const playerMarkup = players.slice(0, 1).map((player, index) => {
        const label = state.mode === "online"
          ? index === 0 ? `You · ${player.heroName || "Hero"}` :
            `${state.onlineBattle?.match?.players?.[index]?.handle || "Opponent"} · ${player.heroName || "Hero"}`
          : index === 0 ? `You · ${player.heroName || "Hero"}` :
            `${cpuName} · ${player.heroName || "Hero"}`;
        const pile = player.personalPile || [];
        const personalPileMarkup = index === 0 ? `<div class="abandon-personal-pile" role="group" aria-label="${esc(label)} personal pile">
          ${pile.map(item => renderDuelCard(item, "personal-pile",
            Boolean(item.selectable) && pairPhase
          )).join("")}
          </div>` : "";
        return `<section class="abandon-duel-player player-panel">
          <div class="player-heading">
            <h2>${esc(label)}</h2>
            <span>${Number(player.pairCount || 0)} / 6 pairs</span>
          </div>
          ${personalPileMarkup}
        </section>`;
      }).join("");
      const jailRows = players.map((player, index) => {
        const label = index === 0 ? "You" : "Opponent";
        const prisoners = player.prisoners || [];
        const cells = Array.from({ length: 6 }, (_, cellIndex) => {
          const card = prisoners[cellIndex];
          const content = card
            ? `<div class="jailed-card">
                ${cardMarkup(card, { pose: "lose", hideFace: true })}
                <span class="capture-face" style="color:${suitColorValue(card.suit)}">${esc(card.face)}</span>
              </div>`
            : `<span class="cell-empty">${String(cellIndex + 1).padStart(2, "0")}</span>`;
          const ariaLabel = card
            ? `${label} prisoner ${cellIndex + 1}: ${suits[card.suit]} ${card.face}`
            : `${label} prisoner space ${cellIndex + 1}, empty`;
          const captureColor = index === 0 ? "white-capture" : "black-capture";
          return `<div class="track-cell ${captureColor}" aria-label="${esc(ariaLabel)}">${content}</div>`;
        }).join("");
        return `<div class="abandon-duel-jail-row" role="group" aria-label="${label} prisoners">
          <strong class="abandon-duel-jail-label">${label}</strong>
          <div class="abandon-duel-jail-cells">${cells}</div>
        </div>`;
      }).join("");
      const container = document.getElementById("variantContent");
      container.innerHTML = `<div class="abandon-duel-overview">
        <article class="player-panel abandon-duel-jail">
          <div class="player-heading"><h2>Prisoners</h2></div>
          ${jailRows}
        </article>
        <article class="player-panel">
          <div class="player-heading"><h2>Shared board</h2><span>${board.filter(item => !item.used).length} / ${board.length} available</span></div>
          <div class="abandon-board abandon-duel-board" role="group" aria-label="Abandon Duel shared board">${boardMarkup}</div>
        </article>
        <div class="abandon-duel-players">${playerMarkup}</div>
      </div>`;
      container.querySelectorAll(".abandon-duel-board .card[data-index]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.disabled) return;
          const action = state.phase === "abandon-duel-reveal"
            ? "abandon-duel-flip" : "abandon-duel-pair-card";
          act(action, { index: Number(button.dataset.index), source: "board" });
        });
      });
      container.querySelectorAll(".abandon-duel-player .card[data-index][data-source]").forEach(button => {
        button.addEventListener("click", () => {
          if (button.disabled) return;
          act("abandon-duel-pair-card", {
            index: Number(button.dataset.index),
            source: "personal-pile"
          });
        });
      });
    }

    function campaignMissionSucceeded() {
      return Boolean(state?.campaign?.result?.startsWith("Mission complete!") ||
        state?.campaign?.result?.startsWith("Skipped "));
    }

    function appendMissionActions(container, restart) {
      container.append(makeButton("Restart", restart, "secondary"));
      container.append(makeButton("Home", openDashboard, "secondary"));
      const campaign = state?.campaign;
      if (campaign && campaignMissionSucceeded() && !campaign.result.includes("Campaign complete") &&
          campaign.hasNextMission !== false) {
        container.append(makeButton("Next Mission",
          () => startMission(campaign.id, campaign.index + 1), "primary"));
      }
    }

    function connectionError(error) {
      return error instanceof TypeError && error.message === "Failed to fetch"
        ? "Game server unavailable. Keep `go run .` running, then reload this page."
        : error.message;
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      if (!status || lifecycle.signal.aborted) return;
      status.textContent = message || "";
      status.style.color = isError ? "#ffd0ce" : "";
    }

    function renderTrack() {
      const track = document.getElementById("track");
      if (state?.variant === "rummy" || state?.variant === "ladder" || state?.variant === "tug-war" || state?.variant === "poker" || state?.variant === "poker-duel" || state?.variant === "puzzle-battle" || state?.variant === "abandon-duel") {
        track.hidden = true;
        track.classList.remove("abandon-track", "puzzler-track");
        track.style.removeProperty("--abandon-columns");
        track.style.removeProperty("--puzzler-columns");
        track.innerHTML = "";
        return;
      }
      track.hidden = false;
      if (state?.variant === "puzzler") {
        track.classList.remove("abandon-track");
        track.classList.add("puzzler-track");
        const puzzle = state.puzzle || {};
        const bountySuit = Number(puzzle.bountySuit);
        const pairResults = Array.isArray(puzzle.pairResults) ? puzzle.pairResults : [];
        const pairCount = Math.floor((puzzle.cards || []).length / 2);
        track.style.setProperty("--puzzler-columns", String(pairCount + 1));
        const bounty = `<div class="bounty-column">
          <div class="track-cell bounty" style="--bounty-border-color:${suitColorValue(bountySuit)}">
            ${cardMarkup(state.bounty || { suit: bountySuit, face: 1 }, { pose: "win", hideFace: true })}
          </div>
          <span class="bounty-value" style="color:${suitColorValue(bountySuit)}">Bounty ${formatModifier(Number(state.modifiers?.bounty ?? 1))}</span>
        </div>`;
        const pairs = Array.from({ length: pairCount }, (_, index) => {
          const result = pairResults[index];
          const captured = result?.captured;
          const score = Number(result?.score || 0);
          const content = captured
            ? `<div class="jailed-card puzzler-prisoner">
                ${cardMarkup({ ...captured }, { pose: "lose", hideFace: true })}
                <span class="capture-face" style="color:${suitColorValue(captured.suit)}">${esc(captured.face)}</span>
              </div>`
            : result ? `<span class="cell-empty">CLASH</span>`
              : `<span class="cell-empty">${String(index + 1).padStart(2, "0")}</span>`;
          const label = captured
            ? `Puzzle pair ${index + 1}, captured ${suits[captured.suit]} ${captured.face}, ${formatModifier(score)} points`
            : result ? `Puzzle pair ${index + 1}, tie, ${formatModifier(score)} points`
              : `Puzzle pair ${index + 1}, pending`;
          const scoreLabel = result
            ? `<span class="puzzler-score" aria-label="Score addition ${formatModifier(score)}">${formatModifier(score)}</span>`
            : `<span class="puzzler-score" aria-hidden="true"></span>`;
          return `<div class="puzzler-pair-column">
            <div class="track-cell" aria-label="${esc(label)}">${content}</div>
            ${scoreLabel}
          </div>`;
        }).join("");
        track.innerHTML = bounty + pairs;
        return;
      }
      track.classList.remove("puzzler-track");
      track.style.removeProperty("--puzzler-columns");
      if (!state || !state.started) {
        track.classList.remove("abandon-track");
        track.style.removeProperty("--abandon-columns");
        track.innerHTML = "";
        return;
      }
      if (state.variant === "abandon") {
        track.classList.add("abandon-track");
        const pairCount = Math.max(1, Number(state.abandon?.pairCount || 4));
        track.style.setProperty("--abandon-columns", String(pairCount + 1));
        const bounty = `<div class="bounty-column">
          <div class="track-cell bounty" style="--bounty-border-color:${suitColorValue(state.bounty.suit)}">
            ${cardMarkup(state.bounty, { pose: "win", hideFace: true })}
          </div>
          <span class="bounty-value" style="color:${suitColorValue(state.bounty.suit)}">Bounty ${formatModifier(Number(state.modifiers?.bounty || 0))}</span>
        </div>`;
        const results = Array.isArray(state.abandon?.pairResults) ? state.abandon.pairResults : [];
        const prisoners = Array.from({ length: pairCount }, (_, index) => {
          const result = results[index];
          const card = result?.captured;
          const content = card
            ? `<div class="jailed-card">
                ${cardMarkup({ ...card }, { pose: "lose", hideFace: true })}
                <span class="capture-face" style="color:${suitColorValue(card.suit)}">${esc(card.face)}</span>
              </div>`
            : result?.tie ? `<span class="cell-empty">CLASH</span>`
              : `<span class="cell-empty">${String(index + 1).padStart(2, "0")}</span>`;
          return `<div class="track-cell" aria-label="${card ? `Pair ${index + 1}, captured ${suits[card.suit]} ${card.face}` : result?.tie ? `Pair ${index + 1}, tie` : `Pair ${index + 1}, pending`}">${content}</div>`;
        }).join("");
        track.innerHTML = bounty + prisoners;
        return;
      }
      track.classList.remove("abandon-track");
      track.style.removeProperty("--abandon-columns");
      const bounty = `<div class="bounty-column">
        <div class="track-cell bounty" style="--bounty-border-color:${suitColorValue(state.bounty.suit)}">
          ${cardMarkup(state.bounty, { pose: "win", hideFace: true })}
        </div>
        <span class="bounty-value" style="color:${suitColorValue(state.bounty.suit)}">Bounty: ${formatModifier(state.modifiers.bounty)}</span>
      </div>`;
      const rounds = [0, 1, 2].map(roundIndex => {
        const slots = state.jailSlots.slice(roundIndex * 3, roundIndex * 3 + 3)
          .map((cell, index) => {
            const slotIndex = roundIndex * 3 + index;
            const border = cell.capturedBy === "White" ? "white-capture"
              : cell.capturedBy === "Black" ? "black-capture" : "";
            const resolvingSlot = state.phase === "result" && battleAnimation &&
              battleAnimation.key === battleAnimationKey() && battleAnimation.stage !== "settled" &&
              slotIndex === (state.round - 1) * 3 + state.exchange - 1;
            const content = resolvingSlot
              ? '<span class="cell-empty" aria-label="Battle resolving"></span>'
              : cell.card
              ? `<div class="jailed-card">${cardMarkup(cell.card, { pose: "lose", hideFace: true })}
                  ${cell.card.faceHidden ? "" : `<span class="capture-face" style="color:${suitColorValue(cell.card.suit)}">${esc(cell.card.face)}</span>`}
                </div>`
              : `<span class="cell-empty">${cell.clash ? "CLASH" : String(slotIndex + 1).padStart(2, "0")}</span>`;
            return `<div class="track-cell ${resolvingSlot ? "" : border}">${content}</div>`;
          }).join("");
          return `<div class="round-group">
            <div class="round-slots">${slots}</div>
            <div class="round-brace" aria-hidden="true"><span class="brace-tip"></span></div>
            <span class="round-weight">x${state.modifiers.reckoning[roundIndex]}</span>
          </div>`;
      }).join("");
      track.innerHTML = bounty + rounds;
    }

    function formatModifier(value) {
      return value > 0 ? `+${value}` : String(value);
    }

    function hasSelectedIndex(index) {
      return index !== null && index !== undefined && Number.isInteger(Number(index)) && Number(index) >= 0;
    }

    function heroPanelMarkup(player, heroName, heroID, playerIndex = (state.players || []).indexOf(player)) {
      const color = player.color.toLowerCase();
      const onlineOpponent = playerIndex === 1 &&
        (state.mode === "online" || state.variant === "puzzle-battle");
      const cpuOpponent = !state.campaign && ["easy", "normal", "hard"].includes(state.mode) && playerIndex !== 0;
      const campaignOpponent = state.campaign && playerIndex !== 0;
      const onlineHandle = state.onlineBattle?.match?.players?.[1]?.handle;
      const title = onlineOpponent ? player.handle || onlineHandle || heroName || "Opponent"
        : cpuOpponent
        ? ({easy:"Easy CPU",normal:"Medium CPU",hard:"Hard CPU"}[state.mode] || "Easy CPU")
        : campaignOpponent ? "Coach" : player.handle || heroName || (playerIndex === 1 ? "Opponent" : "Commander");
      const icon = campaignOpponent ? "coach"
        : cpuOpponent
          ? ({easy:"cpu_easy",normal:"cpu_med",hard:"cpu_hard"}[state.mode] || "cpu_easy")
          : (heroIconNames[heroID] || heroID || "recruit");
      const priorScore = player.score !== undefined && battleAnimation && battleAnimation.key === battleAnimationKey() &&
        battleAnimation.stage !== "settled" && battleAnimation.previousScores[player.color];
      const scoreText = priorScore ?? `${playerLabel(player)} = ${player.score}`;
      const scoreMarkup = state.variant === "abandon-duel"
        ? `<p class="hero-score abandon-round-scores ${color}">
            <span>Round 1: ${esc(formatModifier(Number(state.abandonDuel?.roundScores?.[0]?.[playerIndex] ?? 0)))}</span>
            <span>Round 2: ${esc(formatModifier(Number(state.abandonDuel?.roundScores?.[1]?.[playerIndex] ?? 0)))}</span>
          </p>`
        : player.score === undefined ? "" : `<p class="hero-score ${color}">${esc(scoreText)}</p>`;
      return `<article class="match-hero ${color}">
        <div class="hero-portrait ${color}" role="img" aria-label="${esc(title)} portrait for ${esc(player.color)}">
          <img src="${import.meta.env.BASE_URL}skins/hero_icons/${esc(icon)}.png" alt="" aria-hidden="true">
        </div>
        <h2>${esc(title)}</h2>
        ${scoreMarkup}
      </article>`;
    }

    function renderMatchInfo() {
      const info = document.getElementById("matchInfo");
      if (!state || !state.started || ["poker", "online-battle-lobby"].includes(state.variant)) {
        info.hidden = true;
        return;
      }
      info.hidden = false;
      let players = state.players?.length >= 2 ? state.players : [{ color: "White" }, { color: "Black" }];
      let playerHero = state.playerHero;
      let playerHeroID = state.playerHeroId;
      let opponentHero = state.opponentHero;
      let opponentHeroID = state.opponentHeroId;
      if (state.variant === "puzzle-battle") {
        const match = state.puzzleBattle?.match;
        const view = match?.view;
        const ownPlayer = match?.players?.[view?.player];
        const otherPlayer = match?.players?.[1 - Number(view?.player)];
        players = [
          { color: "White", handle: ownPlayer?.handle },
          { color: "Black", handle: otherPlayer?.handle }
        ];
        playerHero = ownPlayer?.hero || playerHero;
        playerHeroID = ownPlayer?.heroId || playerHeroID;
        opponentHero = otherPlayer?.hero || opponentHero;
        opponentHeroID = otherPlayer?.heroId || opponentHeroID;
      };
      const white = players.find(player => player.color === "White") || players[0];
      const black = players.find(player => player.color === "Black") || players[1];
      const heroAt = (index) => index === 0
        ? [playerHero, playerHeroID]
        : [opponentHero, opponentHeroID];
      const whiteIndex = players.indexOf(white);
      const blackIndex = players.indexOf(black);
      const [whiteHero, whiteHeroID] = heroAt(whiteIndex);
      const [blackHero, blackHeroID] = heroAt(blackIndex);
      document.getElementById("whiteHeroPanel").innerHTML = heroPanelMarkup(white, whiteHero, whiteHeroID || "", whiteIndex);
      document.getElementById("blackHeroPanel").innerHTML = heroPanelMarkup(black, blackHero, blackHeroID || "", blackIndex);

      const modifierLine = (label, value) =>
        `<p><strong>${esc(label)}:</strong> ${formatModifier(Number(value ?? 0))}</p>`;
      let rules = "";
      if (state.variant === "rummy") {
        const params = state.rummy?.parameters || {};
        rules = `<p><strong>set bonus:</strong> ${Number(params.j ?? 0)}</p>
          <p><strong>run bonus:</strong> ${Number(params.b ?? 0)}</p>`;
      } else if (state.variant === "puzzler") {
        const puzzle = state.puzzle || {};
        rules = `<p><strong>Target:</strong> ${esc(puzzle.target ?? "—")}</p>
          <p class="puzzler-match-status">${esc(puzzlerStatusText(puzzle))}</p>
          <p><strong>Elapsed:</strong> <time id="puzzlerElapsedTime">00:00</time></p>`;
      } else if (state.variant === "abandon-duel") {
        const duel = state.abandonDuel || {};
        const bountyColor = suitColorValue(Number(duel.bounty?.suit ?? 0));
        const bountyBonus = 1 + Number(duel.modifiers?.bounty ?? 0);
        rules = `<p><strong style="color:${bountyColor}">Bounty:</strong>
          <span style="color:${bountyColor}">${formatModifier(bountyBonus)}</span></p>`;
      } else if (state.variant === "abandon") {
        const mods = state.modifiers || {};
        rules = ["bounty", "shift", "favored"].map(key =>
          modifierLine(key === "favored" ? "Favor" : key[0].toUpperCase() + key.slice(1), mods[key])).join("");
      } else if (state.variant === "ladder") {
        const ladder = state.ladder || {};
        const mods = state.ladder?.sharedStats || {};
        rules = `<p><strong>Wild cards:</strong> ${esc(ladder.wildFaceRaw)}</p>` +
          ["bounty", "shift", "favor", "draft"].map(key =>
            modifierLine(key[0].toUpperCase() + key.slice(1), mods[key])).join("");
      } else if (state.variant === "tug-war") {
        const bountySuit = Number(state.tugWar?.bountySuit ?? 0);
        const bountyValue = Number(state.tugWar?.b ?? 0);
        const bountyName = suits[bountySuit] || "Unknown";
        rules = `<p class="tug-war-bounty" aria-label="Bounty ${esc(bountyName)} ${formatModifier(bountyValue)}"><strong>Bounty:</strong><span style="color:${suitColorValue(bountySuit)}">${formatModifier(bountyValue)}</span></p>`;
      } else if (state.variant === "poker-duel") {
        const mods = state.pokerDuel?.sharedStats || {};
        const bountyColor = suitColorValue(Number(state.pokerDuel?.bountySuit ?? 0));
        const bountyValue = Number(mods.bounty ?? 0) + Number(state.pokerDuel?.rules?.bountyBase ?? 0);
        rules = [
          `<p><strong>Bounty:</strong> <span style="color:${bountyColor}">${formatModifier(bountyValue)}</span></p>`,
          modifierLine("Shift", mods.shift),
          modifierLine("Favor", mods.favor),
          modifierLine("Draft", mods.draft)
        ].join("");
      } else if (state.variant === "puzzle-battle") {
        const mods = state.puzzleBattle?.match?.view?.modifiers || {};
        rules = ["bounty", "shift", "favored", "draft"].map(key =>
          modifierLine(key === "favored" ? "Favor" : key[0].toUpperCase() + key.slice(1), mods[key])).join("");
      } else {
        const mods = state.modifiers || {};
        const favoredValue = Number(mods.favored || 0);
        const favored = `x2${favoredValue > 0 ? `+${favoredValue}` : favoredValue < 0 ? favoredValue : ""}`;
        rules = `<p><strong>Favored Rule:</strong> ${favored}</p>
          <p><strong>Face Values:</strong> ${1 + Number(mods.shift || 0)}–${9 + Number(mods.shift || 0)}</p>`;
      }
      document.getElementById("matchRules").innerHTML = rules;
    }

    function renderPlayers() {
      const container = document.getElementById("players");
      const statusHost = document.getElementById("statusHost");
      const status = document.getElementById("status");
      if (status.parentElement !== statusHost) {
        statusHost.append(status);
      }
      if (!state || !state.started) {
        container.innerHTML = "";
        return;
      }
      if (state.variant === "puzzler") {
        const puzzle = state.puzzle || {};
        const cards = puzzle.cards || [];
        container.innerHTML = `<article class="player-panel">

            ${personalPile.map(item => renderAbandonCard(item, "personal-pile",

                pairPhase)).join("")}

        container.querySelectorAll(".card[data-index][data-source]").forEach(button => {
          button.addEventListener("click", () => {

      if (state.variant === "abandon-duel") {

        container.innerHTML = "";
        return;

      if (state.variant === "ladder") {
        container.innerHTML = "";
        return;
      }
      if (state.variant === "tug-war") {
        container.innerHTML = "";
        return;
      }

        container.innerHTML = "";
        return;

      if (state.phase === "draft") {

          <div class="player-heading"><h2>${esc(playerLabel(player))}</h2>

          <div class="player-card-rows">
            <section class="card-group"><div class="row-label">Your private dealt cards</div><div class="card-row hand-row">${draftedHand || '<span class="empty-row">No dealt cards</span>'}</div></section>
            <section class="card-group"><div class="row-label">Your draft picks · ${privatePicks.length} selected</div><div class="card-row pile-row">${draftedPicks || '<span class="empty-row">No picks yet</span>'}</div></section>
          </div>
          <p class="draft-opponent-count">Opponent picks: ${state.draftOpponentCount || 0} · Only your private cards are shown here.</p>
        </article>`;
        return;
      }
      const playerIndex = 0;
      const player = state.players[playerIndex];
      const committing = state.phase === "commit" && player.canSelectHand;
      const colorClass = player.color.toLowerCase();
      const playerTitle = "You";
      const handCards = player.hand.map(item => cardMarkup(item, { commit: state.phase === "commit" })).join("");
      const poolCards = player.pool.map(item => cardMarkup(item)).join("");
      const handContent = handCards || backs(player.hiddenHand) || '<span class="empty-row">No cards held</span>';
      const poolContent = poolCards || backs(player.hiddenPool) || '<span class="empty-row">No cards in pile</span>';
      container.innerHTML = `<article class="player-panel ${colorClass}${committing ? " committing" : ""}">
        <div class="player-heading">
          <h2>${esc(playerTitle)} · ${esc(player.color)}</h2>
          <span>${player.score} ${player.score === 1 ? 'pt' : 'pts'}</span>
        </div>
        <div class="player-instructions"></div>
        <div class="player-card-rows">
           <section class="card-group${committing ? ' empty-pile' : ''}">
            <div class="row-label">Round Pile</div>
            <div class="card-row pile-row">${poolContent}</div>

      container.querySelectorAll(".card[data-index]").forEach(button => {

          const player = state.players[state.actor];
          if (state.phase === "commit" && player.canSelectHand) {
            if (selected.has(index)) selected.delete(index);
            else if (selected.size < 3) selected.add(index);
             render();
             container.querySelector(`[data-index="${index}"]`)?.focus({ preventScroll: true });

            act("attack", { index });

    function renderBattle() {

      const versus = document.getElementById("battleVs");

        battle.classList.add("variant-screen");
        battle.classList.remove("drafting");

        right.hidden = true;
        versus.hidden = true;
        variantContent.hidden = false;

        return;
