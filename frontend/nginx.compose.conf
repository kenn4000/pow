server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /prisoner-of-war {
        include /etc/nginx/snippets/security-headers.conf;
        return 308 /prisoner-of-war/;
    }

    location /prisoner-of-war/api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://backend:8080/api/;
    }

    location /prisoner-of-war/skins/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8080/skins/;
    }

    location /prisoner-of-war/skills/icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8080/skills/icons/;
    }

    location /prisoner-of-war/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /prisoner-of-war/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /prisoner-of-war/index.html;
    }
}
