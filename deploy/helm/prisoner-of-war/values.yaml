backend:
  image:
    repository: registry.markdownthing.com/kenn/prisoners-of-war/backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
frontend:
  image:
    repository: registry.markdownthing.com/kenn/prisoners-of-war/frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
imagePullSecrets:
  - name: gitlab-registry
persistence:
  enabled: false
  storageClass: local-path
  size: 1Gi
postgres:
  image: postgres:17-alpine
  database: prisonersofwar
  username: prisonersofwar
  existingSecret: ""
  storageClass: local-path
  size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
bootstrapAdmin:
  existingSecret: ""
ingress:
  enabled: true
  className: traefik
  host: games.markdownthing.com
  issuer: letsencrypt-prod
  tlsSecretName: games-markdownthing-com-tls
  # Redirect plain HTTP to HTTPS with a Traefik Middleware (requires traefik.io CRDs).
  redirectHTTPS: true

# Passwordless "Sign in as any user" picker (GET /api/auth/users, POST /api/auth/assume).
# Anyone who can reach the site can then sign in as any account, including administrators.
# Disabled on this public deployment (2026-10-24, audit SEC-01). Enable only on a host that
# nobody else can reach.
developmentLogin:
  enabled: false
