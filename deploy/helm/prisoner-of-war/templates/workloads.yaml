{{- range $component := list "backend" "frontend" }}
{{- $config := index $.Values $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  {{- if eq $component "backend" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if eq $component "backend" }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- else }}
        runAsUser: 101
        runAsGroup: 101
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          image: {{ printf "%s:%s" $config.image.repository $config.image.tag | quote }}
          imagePullPolicy: {{ $config.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if eq $component "backend" }}
          env:
            - name: HOME
              value: /data
            - name: BASE_PATH
              value: /prisoner-of-war
          volumeMounts:
            - name: profile
              mountPath: /data
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            {{- toYaml $config.resources | nindent 12 }}
      {{- if eq $component "backend" }}
      volumes:
        - name: profile
          {{- if $.Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-profile
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
